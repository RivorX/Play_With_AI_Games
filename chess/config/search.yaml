# Inference/search settings.
# Keep these grouped values aligned with config normalization.
inference:
  # Simulations remain the default. Select time for play, UCI and standalone
  # Stockfish inference evaluation; training always uses simulation budgets.
  budget_mode: simulations       # simulations | time
  move_time_seconds: 0.2

reinforcement_learning:
  search:
    # The current supported root search algorithm.
    algorithm: gumbel
    # `revisiting` gives eliminated root actions another chance in later
    # passes. Select `standard` to use a single Sequential Halving schedule.
    # Adaptive fixed-simulation searches use revisiting passes for feedback
    # checkpoints and budget transfers, regardless of this fixed-search setting.
    gumbel_root_schedule: revisiting
    # Scale reused edge Q values by fresh visits or all retained edge visits.
    # `total` is the current default; Sequential-Halving quotas stay fresh.
    gumbel_reuse_q_scale: total
    simulations: 192
    # Interactive one-root searches otherwise shrink each batch to a quarter
    # of the remaining budget, creating many tiny GPU calls. 0 preserves that
    # legacy schedule; positive caps apply only to one root.
    single_root_batch_cap: 0
    # null auto-enables native revisiting for supported one-root eval models
    # and SECNNV9 feedback batches when every root is adaptive. false disables
    # graphs; true opts other local search/model combinations in explicitly.
    local_cuda_graph_forward: null
    # `feedback` freezes completed Q/prior checkpoints and spends the shared
    # simulation pool on roots with the greatest current uncertainty. It
    # transfers saved quotas between roots and carries earned credit only
    # within a bounded search session. A session may underspend when roots are
    # already clear or another complete pass does not fit the remaining pool.
    dynamic_budget_enabled: true
    # New configs use feedback. Set `prior` explicitly for the previous allocator.
    dynamic_budget_strategy: feedback  # feedback | prior
    dynamic_budget_min: 64
    dynamic_budget_max_multiplier: 1.6666667
    # Root-width cap. The search keeps 16 when the fresh action budget can fund
    # two initial visits per candidate, and narrows to 8 in the low-budget band.
    gumbel_max_considered_actions: 16
    gumbel_scale: 1.0              # self-play exploration
    gumbel_eval_scale: 0.0         # deterministic perfect-information eval
    # Controls the influence of completed child Q values on root ranking.
    gumbel_c_visit: 100.0
    gumbel_c_scale: 0.10
    # Minimum range used when scaling sibling completed-Q differences.
    gumbel_q_range_floor: 0.25
    gumbel_use_mixed_value: true
    # Temperature applied to the completed-Q policy target; it does not change
    # MCTS action selection.
    gumbel_target_temperature: 0.95

