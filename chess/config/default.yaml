# ==============================================================================
# CHESS AI CONFIGURATION - OPTIMIZED FOR RTX 5060Ti 16GB
# ==============================================================================

project:
  # Used for new IL/RL models. Existing checkpoints use their own model_spec.
  # se_cnn_v9, ...
  active_architecture: "se_cnn_v9"
  # Reproducible sampling, opening selection and learner updates. Change this
  # only when intentionally starting an independent comparison run.
  seed: 490050

# ------------------------------------------------------------------------------
# IMITATION LEARNING (IL)
# ------------------------------------------------------------------------------
imitation_learning:
  # Core training
  epochs: 50
  batch_size: 8192              # fallback; auto-tune may override
  learning_rate: 0.001          # fallback/base LR
  weight_decay: 0.002

  # LR schedule
  min_lr_ratio: 0.005
  lr_plateau_decay: true

  # Losses
  policy_loss_weight: 1.0
  value_loss_weight: 1.0
  value_scalar_aux_loss_weight: 0.20
  moves_left_loss_weight: 0.05
  wdl_label_smoothing: 0.01

  # Horizontal file symmetry without rebuilding data. Positions whose visible
  # history still has castling rights are skipped because castling is asymmetric.
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5

  # Checkpoint selection
  early_stop_monitor: value_aware # total | value_aware
  max_patience: 5
  min_delta: 0.0015

  # SWA
  use_swa: true

# ------------------------------------------------------------------------------
# REINFORCEMENT LEARNING (RL)
# ------------------------------------------------------------------------------
reinforcement_learning:
  # Main run size.
  run:
    version: "rl71"
    iterations: 100
    games_per_iteration: 1000
    # New quality experiments start from the canonical IL best with
    # empty replay. The normal startup menu remains available so resume/transfer
    # can be selected explicitly when this is not the controlled comparison.
    fresh_il_start: true

  # Game generation. Runtime mechanics use tested internal defaults.
  self_play:
    workers: auto
    max_moves: 272
    opening_diversity_fraction: 0.60
    opening_diversity_min_plies: 2
    opening_diversity_max_plies: 8

    # RL70's value head remained strongly under-dispersed in openings and MCTS
    # often erased a raw-policy advantage. Re-search a bounded archive sample
    # with the current learner to produce shorter, more independent trajectories
    # while retaining 80% normal start-position self-play.
    hard_start_fraction: 0.20
    hard_start_min_age: 1

    # One frozen snapshot plays both colours. Only a confirmed MCTS/anchor
    # regression changes the next self-play actor to champion; a weak raw policy
    # remains on-policy so search can keep teaching it.

    syzygy_paths:
      - "data/syzygy"

  # Full Gumbel AlphaZero search with Sequential Halving at the root and
  # completed-Q policy improvement below it.
  search:
    simulations: 192
    # Assign the complete budget before Sequential Halving. `simulations` is
    # the exact group average. Difficulty combines prior ambiguity/entropy,
    # branching and value uncertainty on a smooth 16-sim grid in the strict
    # 64-320 range. Every root produces a complete policy target.
    dynamic_budget_enabled: true
    dynamic_budget_min: 64
    dynamic_budget_max_multiplier: 1.6666667
    gumbel_max_considered_actions: 16
    gumbel_scale: 1.0              # self-play exploration
    gumbel_eval_scale: 0.0         # deterministic perfect-information eval
    # Earlier Q influence is valuable with the compensated dynamic budget:
    # paired ablations beat c_visit=50 at 64/192 sims and tied it at 320 sims.
    gumbel_c_visit: 100.0
    gumbel_c_scale: 0.10
    # Do not stretch tiny, noisy sibling-Q differences to the full [0, 1]
    # interval. The current value head is strongly under-dispersed in openings.
    gumbel_q_range_floor: 0.25
    gumbel_use_mixed_value: true
    # The completed-Q policy is already soft. Do not flatten it a second time:
    # the last run's target top-1 fell from 65.7% to 53.7%, while useful
    # correction top-1 stayed near 10%.
    # A small sharpening step makes the completed-Q teacher more separable while
    # preserving its full distribution. It never changes MCTS action selection.
    gumbel_target_temperature: 0.95

  # Optimizer and the few regularizers worth tuning between runs.
  training:
    # Four-generation rolling replay. Rows are interleaved by complete game so
    # each batch sees broad independent-game coverage before a second position
    # from the same game; the validation split also reserves complete games.
    # Prior A/B (1,000 self-play + 256 holdout games):
    # three passes beat one by 59.4% raw NN and 57.3% MCTS. Four passes kept
    # lowering supervised loss but raw NN fell back to 50%, so three is the
    # measured quality/overfit boundary rather than simply using the maximum.
    train_epochs_per_iteration: 3

    # Initial IL warm-up is used only once. Arena/promotions never alter LR.
    learning_rate: 0.00002
    weight_decay: 0.002
    # One AdamW LR for the shared tower and every head. Task balance is defined
    # only by the explicit losses below, so resume/new runs use the same contract.
    # The measured pre-clip norm in rl33 stayed around 0.76-0.98, so 0.5
    # attenuated every optimizer step to only 51-66% of its intended size.
    # Keep clipping as a spike guard instead of making it the normal update.
    grad_clip: 1.0

    # Keep the measured three-iteration warm-up, then span the cosine over the
    # actual run so a 100-iteration learner remains plastic after iteration 60.
    warmup_pct: 0.05              # pretrained IL + conservative 2e-5 LR
    # RL56 had no promotion after iteration 2; at the 7e-6 floor its fixed
    # correction-audit gains were only a few tenths of a percentage point.
    # Keep enough late-run plasticity without adding cyclic restarts.
    min_lr_ratio: 0.50
    augment_prob: 0.50            # Applied only where horizontal symmetry is exact

  # Uniform FIFO training replay. A bounded regret archive controls 20% of game
  # starts, while a small periodic current-model search refreshes stale targets.
  replay:
    buffer_multiplier: 3.2

  # Model comparison and promotion. Technical worker/opening settings are fixed.
  evaluation:
    eval_every: 2
    # Promotion and anchor evaluation are exact: both models receive 192 fresh
    # root simulations, without self-play redistribution or easy-root cuts.
    # Keep the raw-policy match against current best beside every MCTS arena.
    # It is cheap, useful promotion evidence and shows whether search is hiding
    # a policy regression. This is separate from the disabled raw anchor gate.
    eval_no_mcts_every: 2
    eval_no_mcts_games: 96
    # A candidate may improve with search while degrading its raw policy. Keep
    # that learner training, but do not replace the user-facing best unless the
    # paired raw score is approximately non-inferior to the current champion.
    promotion_no_mcts_score_rate_min: 0.48

    # Weak learners stop early. A plausible candidate reaches 192 paired games;
    # only a narrow confidence miss receives a 96-game confirmation extension.
    eval_funnel_preliminary_games: 48
    eval_funnel_preliminary_score_rate: 0.45
    eval_funnel_medium_games: 48
    eval_funnel_medium_score_rate: 0.50
    eval_funnel_advanced_games: 96

    score_rate_threshold: 0.52
    true_win_rate_threshold: 0.02
    # Run only after a candidate passes learner-vs-best. Start with 64 and
    # extend an inconclusive direct IL-anchor match to at most 192 games.
    # There are no periodic anchor matches between promotion attempts.
    anchor_eval_games: 64
    # One-sided non-inferiority guard. The point score still has to reach 50%,
    # and its z=1.28 lower bound may be at most 3 pp below parity.
    promotion_anchor_score_lower_bound_min: 0.47
    # The direct MCTS anchor gate plus raw candidate-vs-best safety gate are
    # sufficient. A second raw-vs-anchor ladder duplicated evidence and could
    # consume another 512 games without changing the promotion question.
    promotion_anchor_no_mcts_gate_enabled: false

  # Elo reporting after promotions and at shutdown.
  stockfish_elo:
    # Reporting only. Stockfish never generates replay, targets or opponents.
    # Promotion-time raw NN Elo is automatic. MCTS Elo is allowed only for a
    # newly promoted RL best; an unchanged IL/startup best is never measured
    # periodically by RL. The gap only rate-limits close consecutive promotions.
    promoted_use_mcts: true
    promoted_mcts_min_iteration_gap: 10
    final_enabled: true
    final_use_mcts: true

  # Search teaches policy through one soft CE target; an internal bounded
  # top-move margin acts only when search measured a higher-Q correction. The
  # final result teaches WDL. A small confidence-weighted consistency loss also
  # aligns WDL's W-L scalar with root-Q without inventing a draw distribution;
  # the separate search-Q head continues to distil the same searched state value.
  # Production MCTS consumes WDL. The trained root-Q head remains auxiliary-only:
  # the paired benchmark showed that pure Q and WDL/Q blending weakened play.
  losses:
    policy: 1.0
    value: 1.00
    # Match the canonical IL value contract: WDL CE preserves draw calibration,
    # while a small robust loss directly trains the W-L scalar used by MCTS.
    value_scalar_aux: 0.20
    value_search_consistency: 0.05
    moves_left: 0.05
    search_q: 0.20

# ------------------------------------------------------------------------------
# HARDWARE & OPTIMIZATION
# ------------------------------------------------------------------------------
hardware:
  # User-facing hardware choices. Other transport/prefetch settings are fixed
  # in code to their measured fastest values.
  device: "cuda"
  use_bfloat16: true
  num_workers: 4


# ------------------------------------------------------------------------------
# SHARED CENTRAL GPU INFERENCE
# ------------------------------------------------------------------------------
central_inference:
  max_batch_size: 384            # Production 192-sim throughput optimum.
  flush_ms: 0.5                  # Coalesce concurrent MCTS requests.


# ------------------------------------------------------------------------------
# DEBUG
# ------------------------------------------------------------------------------
debug:
  enabled: false
