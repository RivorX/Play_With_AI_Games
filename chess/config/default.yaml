# ==============================================================================
# CHESS AI CONFIGURATION - OPTIMIZED FOR RTX 5060Ti 16GB
# ==============================================================================

project:
  # Used for new IL/RL models. Existing checkpoints use their own model_spec.
  # se_cnn_v9 or nested_cnn_v10. CLI selection is also available via --architecture.
  active_architecture: "se_cnn_v9"
  # Reproducible sampling, opening selection and learner updates. Change this
  # only when intentionally starting an independent comparison run.
  seed: 490050

# ------------------------------------------------------------------------------
# IMITATION LEARNING (IL)
# ------------------------------------------------------------------------------
imitation_learning:
  # Core training
  epochs: 50
  batch_size: 8192              # fallback; auto-tune may override
  learning_rate: 0.001          # fallback/base LR
  weight_decay: 0.002

  # LR schedule
  min_lr_ratio: 0.005
  lr_plateau_decay: true

  # Losses
  policy_loss_weight: 1.0
  value_loss_weight: 1.0
  value_scalar_aux_loss_weight: 0.20
  moves_left_loss_weight: 0.05
  wdl_label_smoothing: 0.01

  # Horizontal file symmetry without rebuilding data. Positions whose visible
  # history still has castling rights are skipped because castling is asymmetric.
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5

  # Checkpoint selection
  early_stop_monitor: value_aware # total | value_aware
  max_patience: 5
  min_delta: 0.0015

  # SWA
  use_swa: true

# ------------------------------------------------------------------------------
# REINFORCEMENT LEARNING (RL)
# ------------------------------------------------------------------------------
reinforcement_learning:
  # Main run size.
  run:
    version: "rl83"
    iterations: 100
    games_per_iteration: 1000
    # Start each RL comparison from the canonical IL best with empty replay.
    # Select RESUME explicitly in the startup menu to continue an existing run.
    fresh_il_start: true

  # Game generation. Runtime mechanics use tested internal defaults.
  self_play:
    workers: auto
    max_moves: 272
    # Apply a sampled prefix to every normal-start game. The separate 20% hard
    # starts stay untouched, so prefix coverage is about 80% of all self-play.
    opening_diversity_fraction: 1.0
    opening_diversity_min_plies: 6
    opening_diversity_max_plies: 8

    # RL70's value head remained strongly under-dispersed in openings and MCTS
    # often erased a raw-policy advantage. Re-search a bounded archive sample
    # with the current learner to produce shorter, more independent trajectories
    # while retaining 80% normal start-position self-play.
    hard_start_fraction: 0.20
    hard_start_min_age: 1

    # Only a confirmed best-relative MCTS regression changes the complete
    # self-play actor to champion; a weak raw policy remains learner-led so
    # search can keep teaching it.

    syzygy_paths:
      - "data/syzygy"
    # Startup and training must use existing local tables only. Downloads are
    # available through the explicit Syzygy download tool.
    syzygy_auto_download_enabled: false
    # Policy confidence uses completed effective simulations against the
    # nominal 192-simulation teacher budget.
    teacher_policy_budget_weighting_enabled: true
    teacher_policy_min_budget_ratio: 0.60
    # Keep one half of each game's replay cap for rows with high teacher KL.
    # Policy loss remains uniform so the same KL signal is not weighted twice.
    cap_kl_weighted_fraction: 0.50

  # Optimizer and the few regularizers worth tuning between runs.
  training:
    # Four-generation rolling replay. Rows are interleaved by complete game so
    # each round covers independent games before selecting another position.
    # Shuffle round order so epoch tails do not contain only the longest games
    # and bias BatchNorm. Validation also reserves complete games.
    # Prior A/B (1,000 self-play + 256 holdout games):
    # three passes beat one by 59.4% raw NN and 57.3% MCTS. Four passes kept
    # lowering supervised loss but raw NN fell back to 50%, so three is the
    # measured quality/overfit boundary rather than simply using the maximum.
    train_epochs_per_iteration: 3
    # Optional BN-only regularization: use running stats without freezing affine
    # parameters; dropout and other train-mode behavior remain enabled.
    freeze_batchnorm_stats: false

    # RL72 reached near-zero late holdout uptake while gradient clipping was
    # effectively inactive. Raise plasticity in one controlled axis; retain the
    # measured three-pass replay contract and the existing dynamic batch.
    learning_rate: 0.00005
    weight_decay: 0.002
    # One AdamW LR for the shared tower and every head. Task balance is defined
    # only by the explicit losses below, so resume/new runs use the same contract.
    # The measured pre-clip norm in rl33 stayed around 0.76-0.98, so 0.5
    # attenuated every optimizer step to only 51-66% of its intended size.
    # Keep clipping as a spike guard instead of making it the normal update.
    grad_clip: 1.0

    # Warm up the pretrained IL checkpoint to 5e-5, then keep a 2.5e-5 floor.
    # This isolates optimizer plasticity from replay-pass and batch-size changes.
    warmup_pct: 0.05
    min_lr_ratio: 0.50
    augment_prob: 0.50            # Applied only where horizontal symmetry is exact

  # Uniform FIFO training replay. A bounded regret archive controls 20% of game
  # starts, while a bounded current-model search refreshes stale targets with
  # at least their recorded prior search effort.
  replay:
    buffer_multiplier: 3.2
    reanalyse_enabled: true
    reanalyse_interval: 1
    reanalyse_fraction: 0.005
    reanalyse_max_positions: 512
    reanalyse_min_age: 2
    reanalyse_min_staleness: 2
    reanalyse_max_refreshes: 2
    # Minimum refresh budget; each row is raised to at least its recorded prior
    # assigned/effective/fresh search effort when that metadata is available.
    reanalyse_simulations: 192
    reanalyse_batch_positions: 16

  # Model comparison and promotion. Technical worker/opening settings are fixed.
  evaluation:
    eval_every: 2
    # Promotion evaluation is exact: both models receive 192 fresh root
    # simulations on 96 unique colour-paired opening positions, without
    # self-play redistribution or easy-root cuts.
    # Raw-policy matches are periodic diagnostics and never gate promotion.
    # This gate does not choose the self-play actor: a safe learner-MCTS actor
    # may still generate data.
    eval_no_mcts_every: 4
    eval_no_mcts_games: 96
    # Deprecated compatibility flag. Raw NN is diagnostic and cannot gate promotion.
    promotion_no_mcts_gate_enabled: false
    promotion_no_mcts_score_rate_min: 0.48

    # Early rejection uses paired-score upper bounds with the nominal one-sided
    # z=1.28 error budget divided across the rejecting looks actually planned.
    # A two-look funnel uses z≈1.64 at each look; one look keeps z=1.28.
    # A plausible selector candidate reaches 192 games on 96 unique opening pairs.
    # It must then pass a second, independent 96-opening confirmation arena.
    eval_funnel_preliminary_games: 48
    eval_funnel_preliminary_score_rate: 0.45
    eval_funnel_medium_games: 48
    eval_funnel_medium_score_rate: 0.50
    eval_funnel_advanced_games: 96

    # MCTS-first promotion: the candidate must score at least 53%, and the
    # one-sided 95% paired-opening confidence bound must remain above parity.
    # Candidate promotion is based on MCTS and independent MCTS confirmation.
    score_rate_threshold: 0.53
    promotion_stat_gate_z: 1.645
    promotion_score_lower_bound_min: 0.50
    # After the MCTS selector passes, promotion requires an
    # independent 96-opening confirmation arena at the same MCTS budget.
    promotion_confirmation_games: 192
    promotion_confirmation_openings: 96
    promotion_confirmation_score_rate_min: 0.53
    promotion_confirmation_score_lower_bound_min: 0.50
    promotion_require_anchor_non_regression: false
    anchor_eval_enabled: false

  # Elo reporting after promotions and at shutdown.
  stockfish_elo:
    # Reporting only. Stockfish never generates replay, targets or opponents.
    # Promotion-time raw NN Elo is automatic. MCTS Elo is allowed only for a
    # newly promoted RL best; an unchanged IL/startup best is never measured
    # periodically by RL. The gap only rate-limits close consecutive promotions.
    promoted_use_mcts: true
    promoted_mcts_min_iteration_gap: 10
    final_enabled: true
    final_use_mcts: true

  # Search teaches policy through one soft CE target; an internal bounded
  # top-move margin acts only when search measured a higher-Q correction. The
  # final result teaches WDL. A small confidence-weighted consistency loss also
  # aligns WDL's W-L scalar with root-Q without inventing a draw distribution;
  # the separate search-Q head continues to distil the same searched state value.
  # Production MCTS consumes WDL. The trained root-Q head remains auxiliary-only:
  # the paired benchmark showed that pure Q and WDL/Q blending weakened play.
  losses:
    policy: 1.0
    # Optional loss-side KL attention. Default zero because cap retention uses
    # the same teacher KL for replay selection; enable only as an alternative.
    policy_surprise_weight: 0.0
    value: 1.00
    # Match the canonical IL value contract: WDL CE preserves draw calibration,
    # while a small robust loss directly trains the W-L scalar used by MCTS.
    value_scalar_aux: 0.20
    # Root-Q is the dense searched state-value target. RL73 left opening
    # value_std_ratio near 0.11 and root-Q bias near +0.05 while this term was
    # only about 0.7% of WDL CE. Double the still-auxiliary route in one bounded
    # ablation; terminal WDL remains the dominant calibrated objective.
    value_search_consistency: 0.0  #test, prob to jest problemem mcts
    moves_left: 0.05
    search_q: 0.20

# ------------------------------------------------------------------------------
# HARDWARE & OPTIMIZATION
# ------------------------------------------------------------------------------
hardware:
  # User-facing hardware choices. Other transport/prefetch settings are fixed
  # in code to their measured fastest values.
  device: "cuda"
  use_bfloat16: true
  num_workers: 4


# ------------------------------------------------------------------------------
# SHARED CENTRAL GPU INFERENCE
# ------------------------------------------------------------------------------
central_inference:
  max_batch_size: 384            # Production 192-sim throughput optimum.
  flush_ms: 0.5                  # Coalesce concurrent MCTS requests.
  # Batch sizes vary; autotuning adds multi-second latency on each new shape.
  # Set true explicitly to trade first-use latency for tuned steady-state speed.
  cudnn_benchmark: false


# ------------------------------------------------------------------------------
# PLAY UI
# ------------------------------------------------------------------------------
play:
  # Preserve the canonical shrinking-batch schedule. Positive overrides change
  # search feedback timing; caps 16/32 reduced revisiting quality in testing.
  # This UI-only override does not affect RL, UCI/Elo, or background matches.
  single_game_mcts_batch_cap: 0
  # Minimum on-screen time before a fast AI move is applied; background games
  # and evaluation workers are unaffected. Set 0 to disable presentation pacing.
  min_visible_move_seconds: 1.0
  # Auto keeps a single-worker match in-process and only uses the central
  # server when multiple workers can batch inference. Central compilation is
  # opt-in because cold compile warmup delayed the first move by over a minute.
  match_central_inference: auto
  match_central_inference_compile: false
  # Model matches end by chess rules. Set a positive ply count only for short
  # diagnostic runs; capped games are unresolved and excluded from match score.
  match_max_moves: null


# ------------------------------------------------------------------------------
# DEBUG
# ------------------------------------------------------------------------------
debug:
  enabled: false
