# ==============================================================================
# CHESS AI CONFIGURATION - OPTIMIZED FOR RTX 5060Ti 16GB
# ==============================================================================

# ------------------------------------------------------------------------------
# FILE PATHS (relative to chess/ project root)
# ------------------------------------------------------------------------------
paths:
  data_dir: "data"
  models_dir: "models"
  logs_dir: "logs"

  # Best models (single file, overwritten when improved)
  best_model_il: "models/best_model_il.pt"
  best_model_rl: "models/best_model_rl.pt"

  # Checkpoint directories (saved every N epochs/iterations)
  il_checkpoints_dir: "models/IL"
  rl_checkpoints_dir: "models/RL"


# ------------------------------------------------------------------------------
# DATA
# Each section below matches exactly one pipeline phase.  The loader flattens
# this presentation internally, so changing a value still has the cache impact
# shown in its section title.
# ------------------------------------------------------------------------------
data:
  # Phase 1 — PGN -> binary. Changes rebuild *_positions.bin.
  phase_1_binary:
    min_elo: 2300
    max_games: "max"             # number per PGN, or "max" for full file
    max_moves_per_game: 300
    game_filters:
      enabled: true
      min_fullmove: 10
      min_fullmove_draw: 20
      min_fullmove_resign: 12
      max_elo_gap: 500
      exclude_terminations:
        - "Time forfeit"
        - "Timeout"
        - "Flag"
        - "Abandoned"
        - "Rules infraction"

  # Phase 2 — independent train/validation game split.
  phase_2_split:
    train_split: 0.85

  # Phase 3 — positions selected from each game. Main coverage/diversity knob.
  phase_3_positions:
    positions_per_game:
      enabled: true
      selection_mode: "smart"    # smart | even
      max_total: 40
      min_distance: 4
      opening_pct: 20
      middlegame_pct: 45
      endgame_pct: 35
      rare_or_eventful_pct: 0

  # Phase 4 — final-state dedup. Binary retains full games for history.
  phase_4_deduplication:
    sample_dedup:
      enabled: true
      mode: "fen"
      include_turn: true
      include_history: true
      max_count: 1

  # Phase 5 — training candidate pool. Rebuilds final index and soft cache.
  phase_5_training_pool:
    target_positions: 20000000
    target_selection:
      mode: "count_aware"        # even | count_aware
      train_pool_multiplier: 3.0 # cache more train rows than one epoch
      broad_fraction: 0.30       # candidate-pool coverage
      soft_candidate_selection:
        enabled: true            # extra train-only candidate keys
        min_distance: 2          # coverage only; does not change target probabilities
        max_total: 40

  # Phase 6 — aggregate raw split knowledge into policy/WDL soft targets.
  phase_6_soft_targets:
    soft_targets:
      enabled: true
      source: "raw_split"
      mode: "fen_no_counters"
      include_turn: true
      include_history: false

      # Store and use the target-mover's Elo; the gain is capped deliberately.
      policy_rating_weight:
        enabled: true
        min_elo: 2300
        reference_elo: 2800
        max_multiplier: 1.35
        apply_to_value: true     # use the same evidence quality for WDL aggregation


  # Phase 7 — fixed per-epoch draw from the cached pool. No cache rebuild.
  phase_7_epoch_sampling:
    train_sampling:
      enabled: true
      # Every informative soft row appears once per epoch; all remaining rows
      # are broad, non-soft coverage.
      soft_max_fraction: 0.28
      min_soft_moves: 2
      min_soft_entropy: 0.12     # skip technically multi-move but near-hard targets

  # Runtime affects preprocessing speed only, never data/cache semantics.
  runtime:
    preprocess_threads: all     # ALL logical CPU workers; ~4 balanced shards per worker
    soft_target_workers: auto
    soft_target_chunk_size: auto


# ------------------------------------------------------------------------------
# MODEL ARCHITECTURE
# ------------------------------------------------------------------------------
model:
  # Model version identifier
  version: "v9.9b"
  # Base architecture
  num_residual_blocks: 8        # Number of residual blocks (6-12 optimal)
  filters: 128                  # Convolutional filters (128-256 for RTX 5060 Ti)

  # Policy head: Conv 3x3 C->96 + BN/ReLU + Conv 1x1 -> 73 planes,
  # then fixed LC0-style gather to ACTION_SIZE=1858.
  policy_head_channels: 96      # Policy head intermediate filters
  value_head_filters: 16        # Spatial value conv filters before flatten
  value_hidden_dim: 384         # Value head hidden dimension
  moves_left_hidden_dim: 128    # Small global-mean MLP for moves-left head
  dropout: 0.08                 # Value-head dropout

  history_positions: 4       # Number of past positions to include (0 = current only, current + 4 history)

  # Advanced features
  use_se_blocks: true           # Squeeze-and-Excitation channel attention
  use_se_bottleneck: true       # Use FC bottleneck in SE block (recommended)
  se_reduction: 4               # Used when bottleneck=true (4=mid=32, 8=mid=16, 16=mid=8)
  drop_path_rate: 0.05          # Stochastic Depth
  use_coord_conv: true          # Position-aware conv

  # Advanced architectural features
  use_layer_scale: true         # LayerScale for better training stability
  layer_scale_init: 1e-5        # Initial LayerScale value (1e-6 to 1e-4)



# ------------------------------------------------------------------------------
# SHARED AUTO-TUNE (IL + RL)
# ------------------------------------------------------------------------------
auto_tune:
  # Scope/cache
  use_for_rl: false                  # IL auto-tune is enabled by default; RL should not reuse IL-sized batches
  cache_path: "logs/il_auto_tune_cache.yaml"

  # Batch search
  dedicated_vram_utilization: 0.90
  max_batch_size: 24576
  batch_round_to: 256
  batch_selection: throughput
  throughput_candidate_count: 7
  throughput_tolerance: 0.03

  # LR range test
  lr_test_min: 0.0002
  lr_test_max: 0.005
  lr_test_points: 10
  lr_test_steps: 20

  # Final LR clamp
  lr_min: 0.0002
  lr_max: 0.005


# ------------------------------------------------------------------------------
# IMITATION LEARNING (IL)
# ------------------------------------------------------------------------------
imitation_learning:
  # Core training
  epochs: 50
  batch_size: 8192              # fallback; auto-tune may override
  learning_rate: 0.001          # fallback/base LR
  weight_decay: 0.002

  # LR schedule
  min_lr_ratio: 0.005
  lr_plateau_decay: true
  lr_plateau_patience: auto     # auto = ~60% of max_patience, clamped below early stop
  lr_plateau_factor: 0.7
  lr_plateau_min_scale: 0.35
  lr_plateau_cooldown: 1
  lr_plateau_reset_patience: true

  # Losses
  policy_loss_weight: 1.0
  value_loss_weight: 1.0
  value_scalar_aux_loss_weight: 0.20
  moves_left_loss_weight: 0.05
  wdl_label_smoothing: 0.01

  # Horizontal file symmetry without rebuilding data. Positions whose visible
  # history still has castling rights are skipped because castling is asymmetric.
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5

  # Checkpoint selection
  early_stop_monitor: value_aware # total | value_aware
  max_patience: 5
  min_delta: 0.0015

  # SWA
  use_swa: true
  swa_auto_min_epoch: 36
  swa_anneal_epochs: 5
  swa_min_updates_before_stop: 8
  swa_lr_ratio: 0.08
  swa_lr_max: 0.00012
  swa_bn_refresh_max_batches: 512

# ------------------------------------------------------------------------------
# REINFORCEMENT LEARNING (RL)
# ------------------------------------------------------------------------------
reinforcement_learning:
  # Main run size.
  run:
    version: "rl30"
    iterations: 40
    games_per_iteration: 350

  # Game generation. Runtime mechanics use tested internal defaults.
  self_play:
    device: "cuda"                 # cpu | cuda | auto
    workers: auto
    worker_auto_multiplier: 1.50       # RTX 5060 Ti + 12 CPU threads: benchmark optimum = 18 workers
    max_batch_games_per_worker: 30
    max_moves: 190

    opening_diversity_fraction: 0.60
    opening_diversity_min_plies: 2
    opening_diversity_max_plies: 8

    opponent_current_fraction: 0.30
    opponent_best_fraction: 0.70

    syzygy_paths:
      - "data/syzygy"

  # Search quality. Q values are the verified Q-on benchmark setup.
  search:
    simulations: 192
    # Test 1: redistribute the same average compute across roots. Every active
    # root gets 64 sims, then uncertain roots receive additional 64-sim chunks.
    # Eval/Elo stay fixed-budget so RL30 remains a stable strength baseline.
    dynamic_budget_enabled: true
    dynamic_budget_min: 64
    dynamic_budget_target_avg: 192
    dynamic_budget_max: 320
    dynamic_budget_chunk: 64
    c_puct_base: 19652
    c_puct_init: 1.18
    c_puct_max: 1.85
    fpu_reduction: 0.12
    fpu_absolute: 0.0

    # Frozen v9.9b direct matches (2026-07-13): Q=2.0 scored 61.7% vs 0.5
    # and 63.3% vs 1.0. q_max_abs remains the hard search-influence safety cap.
    q_selection_weight: 2.0
    q_centered: true
    q_min_child_visits: 2
    q_parent_visit_warmup: 36
    q_tanh_scale: 0.55
    q_max_abs: 0.055
    q_min_fullmove: 12
    q_full_weight_fullmove: 28

    temperature: 0.65
    temperature_threshold: 12
    dirichlet_alpha: 0.30
    dirichlet_weight: 0.095

  # Optimizer and the few regularizers worth tuning between runs.
  training:
    batch_size: 8192               # fallback before dynamic sizing
    train_batch_size_min: 1024
    train_batch_size_max: 6144

    learning_rate: 0.00002
    weight_decay: 0.002
    backbone_lr_factor: 0.75
    policy_head_lr_factor: 1.15
    value_head_lr_factor: 1.75
    head_weight_decay: 0.0005
    grad_clip: 0.5

    warmup_pct: 0.05              # 2/40 iterations: pretrained IL + conservative 2e-5 LR do not need a six-iteration ramp.
    min_lr_ratio: 0.35
    entropy_weight: 0.0010
    policy_target_confidence_min_weight: 0.58
    policy_target_confidence_power: 1.0
    augment_prob: 0.50             # Applied only where horizontal symmetry is exact

    # Promotion changes only the frozen evaluation/self-play baseline; learner
    # weights and optimizer state do not jump, so slowing LR here wastes updates.
    post_promotion_stabilization_iterations: 0
    post_promotion_lr_scale: 1.00

  # Uniform FIFO replay. Generations controls freshness; caps control coverage.
  replay:
    buffer_multiplier: 5
    max_policy_targets: 28
    cap_fraction_decisive: 0.65
    cap_fraction_draw: 0.60
    cap_min_positions: 24
    cap_max_positions: 120

  # Model comparison and promotion. Technical worker/opening settings are fixed.
  evaluation:
    eval_every: 2
    eval_workers: auto
    eval_batch_games: 32
    eval_mcts_simulations_multiplier: 1.25
    eval_max_moves: 320
    eval_no_mcts_games: 50

    eval_funnel_preliminary_games: 40
    eval_funnel_preliminary_score_rate: 0.45
    eval_funnel_medium_games: 60
    eval_funnel_medium_score_rate: 0.53
    eval_funnel_advanced_games: 80
    eval_funnel_later_simulations_multiplier: 1.25

    score_rate_threshold: 0.55
    true_win_rate_threshold: 0.02
    anchor_eval_games: 50
    # One-sided non-inferiority guard. The point score still has to reach 50%,
    # and its z=1.28 lower bound may be at most 3 pp below parity.
    promotion_anchor_score_lower_bound_min: 0.47
    early_stop_patience: 10

  # Elo reporting after promotions and at shutdown.
  stockfish_elo:
    promoted_use_mcts: true
    promoted_mcts_every: 3          # Raw NN after every promotion; MCTS every third promotion
    final_enabled: true
    final_use_mcts: true

  # Training objective.
  losses:
    policy: 1.0
    # The IL anchor remains an evaluation/promotion gate, while frozen best is the
    # self-play guardrail. A permanent KL teacher would cap improvement past IL.
    policy_anchor_kl: 0.00
    value: 1.00
    value_scalar_aux: 0.25
    moves_left: 0.05
    value_std_floor: 1.50
    value_std_target_ratio: 0.95
    wdl_label_smoothing: 0.010

# ------------------------------------------------------------------------------
# HARDWARE & OPTIMIZATION
# ------------------------------------------------------------------------------
hardware:
  # Device + precision
  device: "cuda"
  use_amp: true
  use_bfloat16: true
  use_compile: true

  # DataLoader throughput
  num_workers: 4
  train_prefetch_factor: 1
  cuda_train_prefetch_queue_size: 2
  cuda_eval_prefetch_queue_size: 1
  dataloader_worker_restart_limit: 2
  dataloader_worker_failure_tail_tolerance_batches: 2
  dataloader_board_dtype: "float16"
  dataloader_return_numpy: true
  dataloader_block_shuffle: true
  dataloader_block_shuffle_size: 65536
  dataloader_train_in_order: false
  dataloader_val_in_order: false


# ------------------------------------------------------------------------------
# SHARED CENTRAL GPU INFERENCE
# ------------------------------------------------------------------------------
central_inference:
  enabled: true
  servers: auto                  # Auto = one central server per available GPU; never split one GPU into competing server processes.
  auto_min_servers: 1
  auto_workers_per_server: 9
  auto_max_servers: 3
  max_batch_size: 512             # Shared learner/best queue is split by model; 512 keeps each GPU forward closer to a full batch.
  flush_ms: 0.0                  # No deliberate coalescing delay: ~5% more pos/s in the 18-worker RTX 5060 Ti smoke benchmark.
  transport_dtype: "float16"
  use_bfloat16: false          # RTX 5060 Ti benchmark: FP16 central forward was ~9% faster; training still uses global BF16.
  timeout_s: 0
  stall_warning_s: 15
  load_timeout_s: 300
  use_compile: true
  compile_warmup_batches: [1, 32, 128, 256, 512]
  cudnn_benchmark: false
  sync_timing: false


# ------------------------------------------------------------------------------
# PLAY / GUI MATCH RUNTIME
# ------------------------------------------------------------------------------
play:
  # AI-vs-AI uses the same batched evaluator and central GPU server as RL eval.
  match_workers: auto
  match_batch_games: auto
  match_max_moves: 220


# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging:
  log_level: "INFO"          # DEBUG, INFO, WARNING, ERROR
  tensorboard: true          # Enable TensorBoard logging
  print_every: 10            # Print stats every N batches
  il_plot_smoothing_enabled: true # Light EMA smoothing for IL PNG curves; exact best/SWA markers stay raw
  il_plot_smoothing_alpha: 0.65   # Higher = follows raw curve more closely, lower = smoother
  il_plot_smoothing_min_points: 5 # Do not smooth very short runs


# ------------------------------------------------------------------------------
# ELO ESTIMATION
# ------------------------------------------------------------------------------
elo_estimation:
  # Shared Stockfish match
  enabled: true
  stockfish_path: "stockfish"
  levels: [1320, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2600, 2800]
  stockfish_time_limit: 0.10
  max_moves: 150
  stockfish_threads: 1
  stockfish_hash_mb: 32

  # Runtime scheduling
  prioritize_training: true
  reserve_dataloader_workers: true
  stockfish_priority: "below_normal"

  # Adaptive ladder
  adaptive_probe_games_per_level: 5
  adaptive_min_batch_games: 24   # Probe in waves; do not pre-schedule the full ladder
  adaptive_focus_games_per_level: 24
  adaptive_extra_games_per_level: 5
  adaptive_target_focus_levels: 3
  adaptive_max_total_games: 160
  adaptive_target_standard_error: 45.0
  adaptive_min_games_for_se_stop: 80

  # NN eval: shared by IL periodic checks and RL raw-network checks
  nn_eval_workers: 4             # Local benchmark sweet spot; 6-12 contend on tiny NN forwards
  nn_eval_free_threads_utilization: 0.35
  nn_eval_adaptive_probe_games_per_level: 6
  nn_eval_adaptive_min_batch_games: 84
  nn_eval_adaptive_focus_games_per_level: 30
  nn_eval_adaptive_extra_games_per_level: 6
  nn_eval_adaptive_max_total_games: 192
  nn_eval_adaptive_target_standard_error: 38.0
  nn_eval_adaptive_min_games_for_se_stop: 112

  # MCTS eval: shared final/search-strength check
  mcts_eval_workers: 12
  mcts_eval_simulations: 192

  # IL scheduling
  il_eval_every: 2
  il_async_process_restart_limit: 2
  final_on_il_shutdown: true

  # Model move generation
  batch_model_moves: true
  batch_raw_model_moves: false
  # MCTS central batching for eval_elo.py and final IL/RL Elo checks
  eval_elo_central_inference_enabled: true
  eval_elo_central_inference_servers: 1
  eval_elo_central_inference_max_batch_size: 64
  eval_elo_central_inference_use_compile: true
  eval_elo_central_inference_compile_warmup_batches: [1, 8, 16]
  eval_elo_central_client_groups: 1 # One larger MCTS batch beats multiple tiny Python clients
  eval_elo_central_games_per_worker_chunk: 6
  eval_elo_central_target_chunks_per_group: 2
  eval_elo_central_max_chunk_games: 36

# ------------------------------------------------------------------------------
# 🆕 DEBUG & PROFILING
# ------------------------------------------------------------------------------
debug:
  enabled: false                   # Master switch for verbose diagnostics

  # Imitation Learning diagnostics
  il:
    profile_training: false         # Full CUDA-sync timing is expensive; false profiles only first phase epoch
    print_profile_to_console: false # Keep epoch timing tables in logs/debug only
    log_gpu_memory: false           # GPU memory logging is diagnostic, not needed in the hot training loop
    print_batch0_diagnostics: false # Print batch-0 target stats + WDL samples
    print_wdl_loss_diagnostics: false # Print one-time WDL class distribution from loss

  # Reinforcement Learning diagnostics
  rl:
    profile_training: false         # Iteration/self-play/train/eval timing breakdown
    profile_mcts_detail: false      # Enable only for diagnostics: per-leaf CPU timers slow self-play.
    profile_mcts_sample_rate: 64    # Low-overhead sampled tensor timing still feeds aggregate diagnostics.
    log_gpu_memory: false           # GPU memory usage around RL iterations
    central_inference:
      verbose: false                # Per-request/heartbeat logs; summaries still go to console, RL.csv and PNG
      stall_warning_s: 15           # When verbose=true, print if a worker waits this long for central inference


# ------------------------------------------------------------------------------
# REPRODUCIBILITY
# ------------------------------------------------------------------------------
seed: 42                     # Random seed

