# ==============================================================================
# CHESS AI CONFIGURATION - OPTIMIZED FOR RTX 5060Ti 16GB
# ==============================================================================

# ------------------------------------------------------------------------------
# FILE PATHS (relative to chess/ project root)
# ------------------------------------------------------------------------------
paths:
  data_dir: "data"
  models_dir: "models"
  logs_dir: "logs"
  
  # Best models (single file, overwritten when improved)
  best_model_il: "models/best_model_il.pt"
  best_model_rl: "models/best_model_rl.pt"
  
  # Checkpoint directories (saved every N epochs/iterations)
  il_checkpoints_dir: "models/IL"
  rl_checkpoints_dir: "models/RL"


# ------------------------------------------------------------------------------
# DATA PROCESSING - v4.3 TEMPORAL DISCOUNTING + v4.2 POV + SLIDING WINDOW
# ------------------------------------------------------------------------------
data:
  min_elo: 2300              # Minimum Elo rating for games
  max_games: "max"           # Top N games per PGN, or "max" to use the entire file (disables per-file sort/top-N)
  train_split: 0.85          # Train/validation split ratio
  max_moves_per_game: 200    # Skip games longer than this
  
  # Quality filtering
  sort_by_avg_elo: true      # Sort by average Elo of both players

  # Game-level quality filters (headers + length)
  game_filters:
    enabled: true
    min_fullmove: 10              # Minimum fullmoves for any decisive game
    min_fullmove_draw: 20         # Stronger filter for short draws
    min_fullmove_resign: 12       # Early resignations
    max_elo_gap: 300              # Detect "rozkladówki"
    exclude_terminations:
      - "Time forfeit"
      - "Timeout"
      - "Flag"
      - "Abandoned"
      - "Rules infraction"
  
  # SLIDING WINDOW: dynamic history, no redundant storage
  sliding_window_stride: 2   # Sample every Nth position (1=all, 2=half, 3=third)
  
  # Position sampling by game progress (reduce opening duplicates)
  # keep_prob = keep_min + (keep_max - keep_min) * (progress ** power)
  # progress = move_idx / (total_moves - 1)
  position_sampling:
    enabled: true
    seed: 42
    min_fullmove: 3      # hard-skip first N fullmoves
    keep_min: 0.1        # early-game keep probability
    keep_max: 1.0        # late-game keep probability
    power: 2.0           # >1 biases toward mid/late game

  # Position deduplication (across games)
  # 🆕 v4.7: SMART DEDUP with max_count + position_plus_move mode
  position_dedup:
    enabled: true
    mode: "position_plus_move"   # position_plus_move | fen_no_counters | fen | pieces
    include_turn: true           # Include side-to-move in signature
    max_count: 2                 # Max occurrences per signature (None = remove all duplicates)
    random_sample: true          # Random sample (vs first K) - prevents bias
  
  # 4-PHASE: parse -> positions -> write -> cleanup
  files_at_once: 1            # PGN files per batch (1=seq, 2-4=batch)
  phase1_threads: all         # PGN parse workers (1=off, all=cpu)
  phase2_threads: all         # Position workers (1=off, all=cpu)


# ------------------------------------------------------------------------------
# MODEL ARCHITECTURE 
# ------------------------------------------------------------------------------
model:
  # Model version identifier
  version: "v7.6"
  # Base architecture
  num_residual_blocks: 8        # Number of residual blocks (6-12 optimal)
  filters: 128                  # Convolutional filters (128-256 for RTX 5060 Ti)
  # Policy head (AZ-style classic chess planes, 8x8x73):
  # 1x1 conv (C -> policy_head_channels) + BN + ReLU + 1x1 conv (policy_head_channels -> 73 planes)
  # logits are reshaped to ACTION_SIZE (4672) in from_square-major order
  policy_head_channels: 128     # Policy head intermediate filters
  value_head_filters: 128       # Value head filters 
  value_hidden_dim: 512         # Value head hidden dimension 
  dropout: 0.2                  # Dropout rate 

  history_positions: 4       # Number of past positions to include (0 = current only, 4 = current + 3 history)
  
  # Advanced features
  use_se_blocks: true           # Squeeze-and-Excitation channel attention
  use_se_bottleneck: true       # Use FC bottleneck in SE block (recommended)
  se_reduction: 4               # Used when bottleneck=true (4=mid=32, 8=mid=16, 16=mid=8)
  drop_path_rate: 0.1           # Stochastic Depth
  use_coord_conv: true          # Position-aware conv
  
  # Advanced architectural features
  use_layer_scale: true         # LayerScale for better training stability
  layer_scale_init: 1e-5        # Initial LayerScale value (1e-6 to 1e-4)



# ------------------------------------------------------------------------------
# SHARED AUTO-TUNE (IL + RL)
# ------------------------------------------------------------------------------
auto_tune:
  use_for_il: true                   # IL may run probing + cache writes (when IL mode=auto)
  use_for_rl: false                  # RL should not reuse IL cache; huge IL-sized batches were starving RL of update steps
  cache_path: "logs/il_auto_tune_cache.yaml"
  free_vram_utilization: 0.98
  safety_margin_gib: 0.1
  min_batch_size: 64
  max_batch_size: 32768
  batch_round_to: 64
  lr_test_enabled: true
  lr_test_min: 0.0002
  lr_test_max: 0.005
  lr_test_points: 10
  lr_test_steps: 20
  lr_test_early_stop_patience: 3   # Stop LR scan after N clearly worse candidates in a row
  lr_test_early_stop_min_candidates: 4
  lr_test_early_stop_score_margin: 0.0002
  lr_min: 0.0002
  lr_max: 0.005


# ------------------------------------------------------------------------------
# IMITATION LEARNING (IL)
# ------------------------------------------------------------------------------
imitation_learning:
  # Checkpoint content
  save_optimizer_state: true  # Save optimizer state in IL checkpoints for true resume

  # Training hyperparameters (used directly in config mode, and as fallback defaults)
  batch_size: 9216           # Batch size
  learning_rate: 0.001       # Base/fallback LR (used for config mode and LR-test fallback)

  # Advanced training hyperparameters
  value_head_lr_factor: 1.0  # Value head LR multiplier (1.0 = full LR)
  epochs: 30                 # Maximum training epochs
  weight_decay: 0.002        # L2 regularization (10x stronger for value head)
  grad_clip: 1.0             # Gradient clipping threshold
  
  # 🆕 Stochastic Weight Averaging (SWA) for better generalization
  use_swa: true              # Enable SWA (averages weights from multiple epochs)
  swa_start_epoch: 14        # Start SWA after this epoch
  swa_auto_start: true       # Auto-start SWA earlier when transfer warmup/unfreeze suggests it
  swa_transfer_unfreeze_offset: 2  # In transfer mode: start SWA N epoch(s) after first fully unfrozen epoch
  swa_lr_mode: "auto"        # auto | manual
  swa_lr: 0.00005            # Used only when swa_lr_mode=manual
  swa_lr_ratio: 0.12         # Auto mode: target fraction of effective LR around SWA start
  swa_lr_min: 0.00003        # Auto mode lower clamp
  swa_lr_max: 0.00020        # Auto mode upper clamp
  
  # Advanced training features
  label_smoothing: 0.08      # Label smoothing (0.0 = off, 0.1 = standard)
  warmup_pct: 0.05           # Warmup fraction of epochs (e.g., 0.02-0.05)
  min_lr_ratio: 0.005        # Min LR = base_lr * ratio
  
  # 🆕 v4.3: WDL-specific options
  wdl_label_smoothing: 0.01  # Smoothing for value head (WDL is more sensitive to overconfidence)
  # Loss weights
  policy_loss_weight: 1.0    # Policy loss weight
  value_loss_weight: 0.5     # Value loss weight (balanced with policy)
  # 🆕 WDL value weighting by move index (later positions = stronger signal)
  value_move_weighting: true
  value_move_weight_min: 0.1
  value_move_weight_use_game_length: true
  value_move_weight_min_total_moves: 40

  # Evaluation
  eval_every: 1              # Evaluate every N epochs
  
  # Early stopping
  max_patience: 7            # Stop if no improvement for N epochs
  min_delta: 0.001           # Minimum improvement threshold








# ------------------------------------------------------------------------------
# REINFORCEMENT LEARNING (RL)
# ------------------------------------------------------------------------------
reinforcement_learning:
  # ---------------------------
  # Core RL Loop
  # ---------------------------
  version: "rl6"             # RL run/version tag added to RL log filenames
  iterations: 40                # Total RL iterations
  games_per_iteration: 600      # Enough signal per iteration without stretching self-play too long

  # ---------------------------
  # Self-Play Runtime
  # ---------------------------
  self_play_device: "cuda"      # cpu | cuda | auto (auto uses GPU if available)
  self_play_workers: auto       # 0/auto = cpu_count - 1, or set explicit number
  self_play_workers_per_gpu: 10  # Better throughput on 1x RTX 5060 Ti + Ryzen 7500F; fewer workers means less GPU/context fragmentation
  self_play_torch_threads: 1    # Keep 1 thread per worker; Python MCTS already fans out across many processes
  self_play_use_compile: true   # Self-play workers: torch.compile(mode=default) on CUDA; guarded so Windows workers don't compile/cache concurrently
  persistent_self_play_workers: true  # Keep self-play workers alive across RL iterations
  self_play_stream_to_replay: true    # Stream worker results into replay buffer to reduce parent RAM peak
  self_play_queue_transport: true     # For persistent workers + stream_to_replay: send packed batches over mp queue instead of writing them to disk
  self_play_queue_chunk_games: 5      # Number of games bundled into one queue payload
  self_play_compile_lock_timeout_s: 900  # Max wait for another worker to finish compile/cache warmup before falling back

  self_play_save_every_games: 1  # Multiplier of games_per_iteration (0=off); progress still updates per finished game
  
  # ---------------------------
  # Self-Play Game Flow
  # ---------------------------
  use_batch_selfplay: true         # Play multiple games simultaneously (5-10x faster)
  max_batch_games_per_worker: 24     # Slightly smaller worker batches reduce latency spikes once search gets stronger
  self_play_max_moves: 190          # Shorter cap: cut low-value sterile games earlier instead of harvesting many doomed draw samples
  self_play_auto_claim_draw: true   # Allow manual draw claims from python-chess instead of waiting only for automatic terminal detection
  self_play_claim_repetition_after_moves: 40  # Claim sterile repetition earlier to reduce low-signal looping positions
  self_play_claim_draw_after_moves: 85  # End generic claimable draws sooner before they flood replay with redundant samples
  self_play_adjudication_enabled: false  # Disabled by default: self-generated terminal labels were destabilizing value training
  self_play_adjudication_min_moves: 70   # Start a bit earlier so clearly won games convert before drifting into long drawish tails
  self_play_adjudication_threshold: 0.82 # Slightly more eager conversion of stable winning positions into decisive outcomes
  self_play_adjudication_patience: 3     # Need a stable edge, but finish games faster once it is obvious
  syzygy_enabled: true                   # Probe local Syzygy tablebases in tiny endgames and finish them without wasting search
  syzygy_paths:
    - "data/syzygy"                      # Relative paths are resolved from chess/ (e.g. chess/data/syzygy)
  syzygy_max_pieces: 6                   # 6-man is the practical sweet spot; 7-man is much heavier on disk
  syzygy_auto_download_enabled: true     # If local Syzygy WDL files are missing, bootstrap them automatically on RL startup
  syzygy_auto_download_preset: "wdl_345" # Safe default: 3-4-5 WDL only. Use "wdl_345_6" for 6-man WDL too (much larger download)
  syzygy_auto_download_provider: "lichess" # Recommended mirror for auto-download (stable TLS + 3-4-5/6 WDL dirs)
  self_play_resignation_enabled: false   # Disabled by default: resignation targets fed back the model's own value errors
  self_play_resignation_min_moves: 70    # Do not allow very early resigns out of the opening
  self_play_resignation_threshold: 0.93  # Require a clearly losing root value before resigning
  self_play_resignation_patience: 3      # Need a short stable losing streak before resignation triggers
  self_play_resignation_disable_fraction: 0.10  # Keep a small slice of games resignation-free to reduce false positives
  self_play_progress_interval_games: 5  # Fewer progress file writes on Windows workers

  # ---------------------------
  # Self-Play Diversity
  # ---------------------------
  self_play_opening_diversity_enabled: true   # Start many games from short curated opening prefixes to avoid replaying the same opening shell forever
  self_play_opening_diversity_fraction: 0.45  # Slightly less opening randomization so more games stay in repeatable training regimes
  self_play_opening_diversity_min_plies: 2    # Let sharp curated lines branch early
  self_play_opening_diversity_max_plies: 8    # Allow enough depth to land in asymmetrical structures
  self_play_opponent_pool_enabled: true       # Mix current-vs-current with frozen opponents instead of only mirror self-play
  self_play_opponent_current_fraction: 0.35   # Reduce mirror self-play further so training signal is less self-referential
  self_play_opponent_best_fraction: 0.10      # Increase anchor pressure: more direct practice against IL-best weaknesses
  self_play_opponent_recent_fraction: 0.55    # Keep most games vs recent snapshots while preserving stronger anchor exposure
  self_play_recent_snapshots_to_keep: 10       # Keep a wider recent window, then let the smart selector choose the actually useful opponents
  self_play_recent_candidate_pool_size: 4     # From the wider recent window, expose only the best-matched few snapshots to self-play
  self_play_recent_fallback_min_count: 2      # If too few recent snapshots fall into the preferred score band, still keep at least a small fallback pool
  self_play_recent_recency_bias: 0.35         # Prefer fresher snapshots, but still let matchup quality dominate the selection
  self_play_recent_confidence_games: 24       # Avg games needed before a recent snapshot score is treated as high-confidence
  self_play_recent_uncertainty_bonus: 0.15    # Small exploration bonus for newer/under-tested recent snapshots
  self_play_recent_in_band_boost: 1.10        # Slight boost for recent snapshots already inside the preferred score band
  self_play_randomize_learner_color: true     # Let the training model play both colors against frozen opponents
  self_play_opponent_adaptive_enabled: true   # Reweight best/recent opponents cautiously using observed matchup scores
  self_play_opponent_adaptive_update_every: 2 # Adjust every few iterations instead of reacting to one noisy batch
  self_play_opponent_adaptive_min_games: 8    # Ignore tiny matchup samples
  self_play_opponent_adaptive_history_size: 4 # Smooth score estimates over a short recent window
  self_play_opponent_adaptive_target_score: 0.50 # Prefer opponents that are neither too easy nor too hard
  self_play_opponent_adaptive_band: 0.12      # Tighten the preferred difficulty band so the scheduler reacts sooner to bad matchups
  self_play_opponent_adaptive_min_factor: 0.60 # Do not fully zero out hard/easy opponents
  self_play_opponent_adaptive_max_factor: 1.40 # Also do not over-spike one opponent source
  self_play_opponent_current_min_fraction: 0.20 # Let the scheduler reduce mirror self-play harder when it becomes too draw-heavy
  self_play_opponent_current_max_fraction: 0.55 # Also cap mirror self-play so adaptive weighting cannot drift back into draw spam
  self_play_opponent_min_score: 0.28            # Avoid opponent buckets that are so hard they mostly generate hopeless targets
  self_play_opponent_max_score: 0.72            # Avoid buckets that are so easy they stop challenging the policy
  self_play_opponent_best_min_score: 0.10       # Keep best-opponent channel alive longer; avoid dropping anchor pressure too early
  self_play_opponent_recent_min_score: 0.32     # Recent snapshots should usually be in the learnable band
  self_play_opponent_recent_max_score: 0.68     # Also skip recent snapshots that have become too easy
  self_play_opponent_target_draw_rate: 0.35     # Prefer matchups that stay meaningfully decisive instead of settling into draw-heavy shells
  self_play_opponent_draw_band: 0.10            # React sooner once an opponent source starts producing too many draws
  self_play_opponent_draw_penalty_min_factor: 0.45 # Penalize draw-heavy opponent sources more aggressively while still keeping some diversity

  # ---------------------------
  # Replay Shaping
  # ---------------------------
  replay_dynamic_cap_enabled: true
  replay_cap_fraction_decisive: 0.95          # Keep almost all decisive positions
  replay_cap_fraction_draw: 0.08              # Keep fewer draw positions overall so decisive trajectories dominate replay more clearly
  replay_cap_min_positions: 12                # Still preserve some draw structure, but waste less replay budget on sterile games
  replay_cap_max_positions: 120               # Absolute hard cap to avoid RAM bloat
  
  replay_max_positions_per_game: 32           # Fallback hard cap if dynamic is disabled

  # ---------------------------
  # Exploration Schedule
  # ---------------------------
  use_temperature_schedule: true      # Enable adaptive temperature
  temperature_start: 0.65             # RL should start more focused; search, not policy noise, should drive improvement
  temperature_end: 0.35               # Sharpen later training further so the policy keeps tactical wins instead of washing them out
  temperature_decay_iterations: auto  # Auto: decay spans the full RL run (matches iterations)
  adaptive_temperature_enabled: true  # Apply small telemetry-driven corrections on top of the base decay schedule
  adaptive_temperature_min: 0.28      # Never let adaptive control collapse exploration completely
  adaptive_temperature_max: 0.68      # Also avoid over-correcting above the intended search regime
  adaptive_temperature_max_adjustment: 0.12 # Allow the controller to react more visibly when self-play turns too draw-heavy
  adaptive_temperature_draw_target: 0.26    # Prefer a moderate draw rate instead of sterile 30%+ draw-heavy self-play
  adaptive_temperature_draw_band: 0.04      # React a bit earlier once draw rate starts drifting upward
  adaptive_temperature_decisive_target: 0.70 # Aim for mostly decisive completed games
  adaptive_temperature_decisive_band: 0.06   # React a bit sooner when decisive rate falls off
  adaptive_temperature_min_eval_gain: 0.015  # Require a bit more eval progress before calling the run healthy
  adaptive_temperature_value_guard_step: 0.015 # Extra temp reduction per active value-guard streak
  adaptive_temperature_smoothing: 0.35       # Lower smoothing so adjustments appear faster on the next iterations
  adaptive_temperature_threshold_step: 3     # Let deterministic-play threshold move a bit more with temperature

  # ---------------------------
  # MCTS Search
  # ---------------------------
  mcts_simulations: 160     # Higher search pressure so RL learns from targets that more clearly improve over the IL prior
  mcts_batch_size: 256        # Match the heavier search budget without overfragmenting GPU inference
  mcts_reuse_tree: true      # Reuse tree across moves (faster, better)
  mcts_c_puct: 1.15          # Move back toward healthier exploration; too-low PUCT was over-trusting the current policy
  mcts_dynamic_c_puct: true  # MuZero-style dynamic exploration scaling by parent visits
  mcts_c_puct_base: 12000    # Slightly slower scaling keeps exploration healthier over a 96-sim search budget
  mcts_c_puct_init: 1.05     # Reduce policy lock-in early in the search
  mcts_c_puct_max: 1.8       # Let dynamic PUCT breathe a bit more at higher visit counts
  mcts_use_fpu: true         # First Play Urgency: non-visited moves get parent-aware prior value
  mcts_fpu_reduction: 0.12   # Reduce FPU from parent value to encourage some exploration of unvisited moves (0.0 = no reduction, 1.0 = zero FPU)
  mcts_fpu_absolute: null    # null = adaptive parent-Q FPU, float = fixed FPU value in [-1, 1]
  mcts_temperature: 0.65      # Sharper visit sampling produces better policy targets once the search is strong enough
  mcts_temperature_threshold: 12  # Quicker shift toward deterministic play helps convert advantages instead of drifting
  mcts_dirichlet_alpha: 0.3  # Standard rzędu szachowego
  mcts_dirichlet_weight: 0.06 # Keep some root noise, but stop polluting stronger searches with too much randomization
  mcts_tactical_priors_enabled: true  # Light tactical nudges help low-budget search notice forcing moves sooner
  mcts_tactical_capture_bonus: 0.10   # Small prior boost for captures
  mcts_tactical_winning_capture_bonus: 0.08  # Extra nudge for obviously favorable captures
  mcts_tactical_check_bonus: 0.06     # Checks are often tactically forcing
  mcts_tactical_promotion_bonus: 0.12 # Promotions are rare and critical
  mcts_tactical_recapture_bonus: 0.08 # Helps short tactical recapture sequences
  mcts_adaptive_search_enabled: true            # Stop self-play search early when the root move distribution is already confident instead of using a random playout cap
  mcts_adaptive_search_min_simulations: 64      # Never stop before this many sims; easy positions still get a minimum amount of search
  mcts_adaptive_search_top_visit_confidence: 0.76 # Early-stop only when the best move owns a large share of root visits
  mcts_adaptive_search_visit_gap: 0.2           # Also require a healthy lead over the runner-up move
  mcts_adaptive_search_max_entropy: 0.52        # Prevent early stop when root policy is still broad/uncertain
  mcts_adaptive_policy_weight_min_fraction: 0.75 # Policy target gets weight 1 only if search used at least this fraction of the full budget
  policy_target_pruning_enabled: true           # Drop low-visit exploration noise before training the policy head
  policy_target_pruning_keep_top_n: 8           # Always keep a broader top slice so uncertain positions retain more searched alternatives
  policy_target_pruning_max_moves: 28           # Let wider post-search support reach the learner before pruning the long tail
  policy_target_pruning_min_prob: 0.005         # Still trim only the weakest tail; low-probability tactical moves can survive if search supports them
  policy_target_pruning_min_fraction_of_max: 0.05 # Keep moves that are closer to the best visit count instead of over-sharpening the target
  policy_target_pruning_keep_mass: 0.96         # Preserve more of the MCTS distribution when many moves are similarly plausible
  
  # ---------------------------
  # Optimizer & Training
  # ---------------------------
  batch_size: 1024           # More gradient steps per iteration from the same replay buffer
  learning_rate: 0.0002      # Fallback base LR when RL auto-tune cache is unavailable
  weight_decay: 0.05         # L2 regularization (AdamW)
  grad_clip: 0.5             # Gradient clipping
  train_epochs_per_iteration: 3  # Fewer passes per iteration to reduce overfitting to stale replay slices

  # Replay buffer sizing:
  # Capacity now bootstraps small and then auto-resizes from observed positions/iteration.
  replay_buffer_multiplier: 5     # Shorter horizon: fresher replay distribution, lower non-stationarity pressure on value head
  replay_buffer_bootstrap_positions_per_iteration: auto  # auto = start from a small conservative bootstrap instead of a large fixed guess
  replay_buffer_ema_alpha: 0.15   # React more slowly so replay size does not shrink too aggressively between iterations
  replay_buffer_min_size: 4096    # Never shrink below a small practical floor
  replay_buffer_capacity_round_to: 256  # Round capacity changes to reduce realloc noise
  replay_fp16: true             # Store replay tensors in float16 to reduce RAM (~2x)
  replay_max_policy_targets: 28 # Hard cap for stored policy support; keeps replay/queue tensors aligned with pruning and cuts RAM
  replay_decisive_sampling_fraction: 0.22   # Keep a small decisive bias, but avoid oversampling mostly losing decisive positions
  replay_decisive_value_epsilon: 0.05       # Treat |value| > epsilon as decisive for replay sampling
  replay_hard_negative_sampling_fraction: 0.10  # Keep some tactical focus, but stop over-concentrating batches on noisy tails
  replay_hard_negative_min_importance: 1.35    # Threshold for positions to count as "hard" in replay sampling
  replay_recent_sampling_fraction: 0.35       # Heavier recent slice so updates follow current opponent/policy regime faster
  replay_recent_window_fraction: 0.30         # Define "recent" as the newest ~30% of the replay buffer
  replay_quality_sampling_fraction: 0.18      # Separate from hard negatives: sample positions that look globally high-quality, not only hard/noisy
  replay_quality_min_importance: 1.15         # Lower than hard negatives so quality replay includes more than just the tactical tail
  replay_quality_value_bonus: 0.20            # Slightly prefer positions with clearer value targets inside the quality slice
  replay_resize_preserve_decisive_fraction: 0.15  # On buffer shrink, preserve some older decisive samples instead of only the newest data
  replay_resize_preserve_decisive_min_count: 1024 # Floor for protected decisive positions when available
  replay_importance_gating_enabled: true       # Gate per-game positions by importance before the normal replay cap
  replay_importance_gate_fraction_decisive: 0.90 # Keep more decisive trajectories intact for stabler value learning
  replay_importance_gate_fraction_draw: 0.35   # Filter draw games more aggressively before the per-game cap so replay stays less draw-dominated
  replay_importance_gate_min_positions: 12     # Never let importance gating erase a game completely
  replay_importance_top_fraction: 0.70         # Mostly keep top-importance moments plus some timeline coverage
  
  # Learning rate schedule
  use_lr_schedule: true
  warmup_pct: 0.05           # RL already uses warmup + cosine decay over iterations
  min_lr_ratio: 0.25         # Final LR = auto-tuned base_lr * min_lr_ratio
  
  # Entropy regularization
  entropy_weight: 0.0003      # Keep some policy spread, but do not push late self-play back toward drawish entropy
  
  # Data augmentation
  use_augmentation: true
  augment_horizontal_flip: true   # Mirror board horizontally
  augment_prob: 0.5               # 50% chance per position
  
  # ---------------------------
  # Evaluation & Promotion
  # ---------------------------
  eval_games: 100            # Fallback total games when staged eval is disabled
  eval_mcts_simulations_multiplier: 2.5  # Eval uses base mcts_simulations * this multiplier (1.0 = same search budget as self-play base)
  eval_max_moves: 320        # Align eval with self-play so results are not dominated by ultra-long unresolved games
  eval_auto_claim_draw: true
  eval_claim_repetition_after_moves: 70
  eval_claim_draw_after_moves: 180  # Generic claimable draws after ~70 full moves
  eval_every: 3              # Slightly faster feedback loop while iterating toward surpassing IL
  eval_staged_enabled: true   # true = two-stage eval vs best: short MCTS screen first, then extra MCTS games only if stage 1 looks promising
  eval_stage1_games: 60       # Stage 1 uses the normal eval MCTS path too; this is the cheap first sample
  eval_stage2_games: 120      # Stage 2 adds this many more MCTS games and combines them with stage 1 for the final eval result
  eval_stage2_gate_score_rate: 0.52  # Run stage 2 only if stage 1 score_rate reaches at least this threshold
  eval_stage2_gate_true_win_rate: 0.02  # Also require a small decisive edge in stage 1 to avoid paying for stage 2 on drawish noise
  eval_fixed_openings_enabled: true
  eval_fixed_openings_max_plies: 6
  early_stop_enabled: true
  early_stop_patience: 5          # Stop RL after 5 eval cycles without meaningful improvement
  early_stop_min_score_improvement: 0.01   # Require at least +1pp score-rate improvement to reset patience
  early_stop_min_true_win_improvement: 0.005 # Or at least +0.5pp true-win improvement
  score_rate_threshold: 0.55    # Promote best model only if score vs current best is clearly positive
  true_win_rate_threshold: 0.02 # Also require some real decisive edge, not only draw-heavy scoring
  win_rate_threshold: 0.55      # Backward-compat alias; current code uses score_rate_threshold for promotion
  anchor_eval_enabled: true
  anchor_eval_every: 1          # Run anchor eval on every RL evaluation cycle
  anchor_eval_games: 40
  anchor_eval_use_fixed_openings: true
  checkpoint_every: 10        # Save checkpoint every N iterations
  
  # ---------------------------
  # Loss Weights
  # ---------------------------
  policy_loss_weight: 1.0    # Policy loss weight
  value_loss_weight: 0.45    # Keep value learning alive, but reduce pressure until RL targets get cleaner
  value_aux_scalar_loss_weight: 0.25  # Extra scalar consistency term on (P(win)-P(loss)); helps prevent value collapse toward perpetual draws
  # Value loss weight schedule - start conservatively and only warm up slightly later
  value_loss_weight_schedule:
    start: 0.40
    end: 0.48
  value_guard_enabled: true
  value_guard_mae_window: 3
  value_guard_patience: 1
  value_guard_mae_increase_tolerance: 0.006
  value_guard_min_score_gain: 0.005
  value_guard_scale: 0.75
  value_guard_min_weight: 0.40
  value_target_noise_std: 0.0
  value_target_temporal_decay: 0.993   # Carry final outcomes farther back so early/midgame value targets stay informative
  value_target_min_scale: 0.25         # Keep a stronger minimum supervision signal for early positions
  value_target_root_blend_enabled: true  # Blend final outcome with root MCTS value so early targets are less noisy
  value_target_root_blend_start: 0.70    # Trust root eval less early so value learns more from actual game outcomes
  value_target_root_blend_end: 0.10      # Lean even harder on true outcomes in later plies
  value_target_root_blend_power: 1.7     # Keep the stronger root-value blend a bit longer into the game
  adaptive_dirichlet_enabled: true       # Reduce root noise when self-play turns too draw-heavy or eval stagnates
  adaptive_dirichlet_min_weight: 0.015   # Keep a small amount of root noise for exploration even under heavy draw pressure
  adaptive_dirichlet_draw_scale: 0.65    # Cut root noise harder when completed draw rate drifts above target
  adaptive_dirichlet_value_guard_scale: 0.85 # Reduce root noise further while value guard is active
  adaptive_dirichlet_eval_scale: 0.85    # Also tighten root noise when eval stops improving






# ------------------------------------------------------------------------------
# HARDWARE & OPTIMIZATION
# ------------------------------------------------------------------------------
hardware:
  device: "cuda"             # Device: cuda, cpu, or mps (Mac)
  
  # Performance optimizations
  use_amp: true              # Mixed Precision Training (~2x speedup)
  use_bfloat16: true         # bfloat16 instead of float16 (better range)
  num_workers: 5             # CPU workers for data loading
  prefetch_factor: 1         # DataLoader prefetch factor
  pin_memory: true           # Faster GPU data transfer
  use_compile: true          # torch.compile: fuse Conv+BN+ReLU kernels (~3x speedup)


# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging:
  log_level: "INFO"          # DEBUG, INFO, WARNING, ERROR
  tensorboard: true          # Enable TensorBoard logging
  print_every: 10            # Print stats every N batches


# ------------------------------------------------------------------------------
# 🆕 ELO ESTIMATION (via Stockfish matches during evaluation)
# ------------------------------------------------------------------------------
elo_estimation:
  enabled: true                # Enable Elo estimation during training
  eval_every: 2                # Estimate Elo every N epochs (expensive, don't run every epoch)
  rl_every_n_evals: 3          # In RL: run Stockfish Elo every Nth model-vs-best evaluation
  rl_min_score_rate_for_stockfish: 0.50     # Gate periodic Stockfish Elo by score rate vs current best
  rl_min_true_win_rate_for_stockfish: 0.02  # Also require at least a small decisive edge before paying for Elo
  rl_min_win_rate_for_stockfish: 0.50       # Backward-compat alias for score-rate gate
  final_on_rl_shutdown: true   # In RL: run one final Elo test on normal end and after Ctrl+C training stop; press Ctrl+C again during that Elo to cancel it
  stockfish_path: "stockfish"  # Path to Stockfish binary (or just "stockfish" if on PATH)
  workers: 0                   # Parallel game workers (0/auto = use full available CPU budget, adjusted by stockfish_threads in RL)
  prioritize_training: true    # Keep IL training/data-loading responsive while Elo runs
  reserve_dataloader_workers: true    # Reserve hardware.num_workers CPU slots for DataLoader
  free_threads_utilization: 1.0       # Use this fraction of free CPU threads after DataLoader reservation
  stockfish_priority: "below_normal"  # Windows process priority for Stockfish: idle|below_normal|normal
  stockfish_hide_window: true  # Windows: spawn Stockfish without console windows
  batch_model_moves: true      # Batch model-side Elo moves across active games to better use GPU/CPU, especially with MCTS
  stockfish_threads: 1         # Threads per Stockfish process; tune together with workers (e.g. 12x1, 6x2, 4x3)
  stockfish_hash_mb: 64        # Hash MB per Stockfish process; total RAM ~= workers * hash_mb plus engine overhead
  max_error_logs_per_type: 8   # Suppress repeated Stockfish error spam after N logs
  cancel_shutdown_wait_s: 0.0  # After Ctrl+C, do not wait for graceful unwind; cancel shutdown Elo immediately
  
  games_per_level: 40          # Games per Elo level (half as white, half as black)
  levels: [1320, 1400, 1500, 1600, 1700, 1850, 2000, 2200]  # Stockfish UCI_Elo levels (min 1320 for SF 17+)
  stockfish_time_limit: 0.2    # Seconds per Stockfish move (lower = faster but weaker play)
  max_moves: 150               # Max full moves per game before declaring draw
  rl_games_per_level: 12       # Faster periodic RL Stockfish check: 8 levels x 12 games = 96 total games
  rl_stockfish_time_limit: 0.10  # Faster periodic RL Elo; keep constant across runs for comparability
  rl_max_moves: 120            # Shorter periodic RL Elo games to avoid very long low-signal endings
  rl_workers: 12               # Fill the CPU budget during periodic RL Elo
  rl_stockfish_threads: 1      # Throughput-oriented periodic RL Elo: many 1-thread engines
  rl_stockfish_hash_mb: 32     # Enough cache for short time controls without wasting RAM
  final_rl_games_per_level: 24   # Final RL Elo can be slower/more stable than periodic checks
  final_rl_stockfish_time_limit: 0.20  # Keep final RL Elo closer to the previous baseline
  final_rl_max_moves: 150      # Final RL Elo keeps the normal move horizon
  final_rl_workers: 6          # Better CPU saturation for final Elo with 2-thread Stockfish workers
  final_rl_stockfish_threads: 2  # Stronger per-game Stockfish search in final RL Elo
  final_rl_stockfish_hash_mb: 64  # More cache is reasonable when fewer final Elo workers are active
  
  # MCTS options (for stronger but slower play)
  # NOTE: IL training forces this to false (raw net only for speed).
  use_mcts: false              # Enable MCTS for model moves (default false)
  mcts_simulations: 100        # MCTS sims per move (50-100 = fast, 200-400 = strong, 800+ = very strong)
  final_rl_use_mcts: true      # In RL final Elo: optionally override use_mcts for the last Stockfish test
  final_rl_mcts_simulations: 200  # In RL final Elo: override MCTS sims used for the final Stockfish test

  # Async worker device (used by IL background Elo and RL cancellable Elo worker).
  async_in_il: true                # true = do not block IL training loop on Elo
  async_device: "cpu"              # cpu | cuda | same (same = training device)
  async_wait_on_shutdown_sec: 0.0  # Optional wait for pending async Elo at normal end


# ------------------------------------------------------------------------------
# 🆕 DEBUG & PROFILING
# ------------------------------------------------------------------------------
debug:
  enabled: true                    # Master switch for debug mode
  profile_training: true            # Time breakdown per epoch
  log_gpu_memory: true              # GPU memory usage
  print_batch0_diagnostics: false   # Print batch-0 target stats + WDL samples


# ------------------------------------------------------------------------------
# REPRODUCIBILITY
# ------------------------------------------------------------------------------
seed: 42                     # Random seed

