# ==============================================================================
# CHESS AI CONFIGURATION - OPTIMIZED FOR RTX 5060Ti 16GB
# ==============================================================================

# ------------------------------------------------------------------------------
# FILE PATHS (relative to chess/ project root)
# ------------------------------------------------------------------------------
paths:
  data_dir: "data"
  models_dir: "models"
  logs_dir: "logs"
  
  # Best models (single file, overwritten when improved)
  best_model_il: "models/best_model_il.pt"
  best_model_rl: "models/best_model_rl.pt"
  
  # Checkpoint directories (saved every N epochs/iterations)
  il_checkpoints_dir: "models/IL"
  rl_checkpoints_dir: "models/RL"


# ------------------------------------------------------------------------------
# DATA PROCESSING - v4.3 TEMPORAL DISCOUNTING + v4.2 POV + SLIDING WINDOW
# ------------------------------------------------------------------------------
data:
  min_elo: 2300              # Minimum Elo rating for games
  max_games: "max"           # Top N games per PGN, or "max" to use the entire file (disables per-file sort/top-N)
  train_split: 0.85          # Train/validation split ratio
  max_moves_per_game: 200    # Skip games longer than this
  
  # Quality filtering
  sort_by_avg_elo: true      # Sort by average Elo of both players

  # Game-level quality filters (headers + length)
  game_filters:
    enabled: true
    min_fullmove: 10              # Minimum fullmoves for any decisive game
    min_fullmove_draw: 20         # Stronger filter for short draws
    min_fullmove_resign: 12       # Early resignations
    max_elo_gap: 300              # Detect "rozkladówki"
    exclude_terminations:
      - "Time forfeit"
      - "Timeout"
      - "Flag"
      - "Abandoned"
      - "Rules infraction"
  
  # SLIDING WINDOW: dynamic history, no redundant storage
  sliding_window_stride: 2   # Sample every Nth position (1=all, 2=half, 3=third)
  
  # Position sampling by game progress (reduce opening duplicates)
  # keep_prob = keep_min + (keep_max - keep_min) * (progress ** power)
  # progress = move_idx / (total_moves - 1)
  position_sampling:
    enabled: true
    seed: 42
    min_fullmove: 3      # hard-skip first N fullmoves
    keep_min: 0.1        # early-game keep probability
    keep_max: 1.0        # late-game keep probability
    power: 2.0           # >1 biases toward mid/late game

  # Position deduplication (across games)
  # 🆕 v4.7: SMART DEDUP with max_count + position_plus_move mode
  position_dedup:
    enabled: true
    mode: "position_plus_move"   # position_plus_move | fen_no_counters | fen | pieces
    include_turn: true           # Include side-to-move in signature
    max_count: 2                 # Max occurrences per signature (None = remove all duplicates)
    random_sample: true          # Random sample (vs first K) - prevents bias
  
  # 4-PHASE: parse -> positions -> write -> cleanup
  files_at_once: 1            # PGN files per batch (1=seq, 2-4=batch)
  phase1_threads: all         # PGN parse workers (1=off, all=cpu)
  phase2_threads: all         # Position workers (1=off, all=cpu)


# ------------------------------------------------------------------------------
# MODEL ARCHITECTURE 
# ------------------------------------------------------------------------------
model:
  # Model version identifier
  version: "v8"
  # Base architecture
  num_residual_blocks: 8        # Number of residual blocks (6-12 optimal)
  filters: 128                  # Convolutional filters (128-256 for RTX 5060 Ti)
  # Policy head (AZ-style classic chess planes, 8x8x73):
  # 1x1 conv (C -> policy_head_channels) + BN + ReLU + 1x1 conv (policy_head_channels -> 73 planes)
  # logits are reshaped to ACTION_SIZE (4672) in from_square-major order
  policy_head_channels: 128     # Policy head intermediate filters
  value_head_filters: 192       # Wider value head; cheap extra capacity for MCTS value calibration
  value_hidden_dim: 1024        # Value head hidden dimension 
  dropout: 0.15                 # Value-head dropout; lower improves scalar value calibration for MCTS

  history_positions: 4       # Number of past positions to include (0 = current only, current + 4 history)
  
  # Advanced features
  use_se_blocks: true           # Squeeze-and-Excitation channel attention
  use_se_bottleneck: true       # Use FC bottleneck in SE block (recommended)
  se_reduction: 4               # Used when bottleneck=true (4=mid=32, 8=mid=16, 16=mid=8)
  drop_path_rate: 0.1           # Stochastic Depth
  use_coord_conv: true          # Position-aware conv
  
  # Advanced architectural features
  use_layer_scale: true         # LayerScale for better training stability
  layer_scale_init: 1e-5        # Initial LayerScale value (1e-6 to 1e-4)



# ------------------------------------------------------------------------------
# SHARED AUTO-TUNE (IL + RL)
# ------------------------------------------------------------------------------
auto_tune:
  use_for_il: true                   # IL may run probing + cache writes (when IL mode=auto)
  use_for_rl: false                  # RL should not reuse IL cache; huge IL-sized batches were starving RL of update steps
  cache_path: "logs/il_auto_tune_cache.yaml"
  free_vram_utilization: 0.98
  safety_margin_gib: 0.1
  min_batch_size: 64
  max_batch_size: 32768
  batch_round_to: 64
  lr_test_enabled: true
  lr_test_min: 0.0002
  lr_test_max: 0.005
  lr_test_points: 10
  lr_test_steps: 20
  lr_test_early_stop_patience: 3   # Stop LR scan after N clearly worse candidates in a row
  lr_test_early_stop_min_candidates: 4
  lr_test_early_stop_score_margin: 0.0002
  lr_min: 0.0002
  lr_max: 0.005


# ------------------------------------------------------------------------------
# IMITATION LEARNING (IL)
# ------------------------------------------------------------------------------
imitation_learning:
  # Checkpoint content
  save_optimizer_state: true  # Save optimizer state in IL checkpoints for true resume

  # Training hyperparameters (used directly in config mode, and as fallback defaults)
  batch_size: 9216           # Batch size
  eval_batch_size: 0         # 0 = derive from train batch using eval_batch_size_multiplier
  eval_batch_size_multiplier: 1.0 # Eval has no backward pass, so it can use a larger batch
  learning_rate: 0.001       # Base/fallback LR (used for config mode and LR-test fallback)

  # Advanced training hyperparameters
  value_head_lr_factor: 1.25 # Value head LR multiplier; value needs extra adaptation for MCTS usefulness
  epochs: 50                 # Maximum training epochs
  weight_decay: 0.002        # L2 regularization (10x stronger for value head)
  grad_clip: 1.0             # Gradient clipping threshold
  
  # Stochastic Weight Averaging (SWA) for better generalization
  use_swa: true              # Enable SWA (averages weights from multiple epochs)
  swa_auto_start: true       # Auto-start SWA from validation plateau instead of a fixed early epoch
  swa_auto_min_epoch: 24     # Never start SWA before this epoch in new/resume training
  swa_auto_plateau_patience: 3 # Start after N evals without meaningful val-loss improvement
  swa_auto_min_delta: 0.0015 # Meaningful val-loss improvement threshold for SWA plateau detection
  swa_transfer_unfreeze_offset: 2  # In transfer mode: start SWA N epoch(s) after first fully unfrozen epoch
  swa_anneal_epochs: 12      # Number of epochs SWALR uses to anneal from current LR to swa_lr
  swa_stop_after_anneal_no_improve: true # Once SWA LR anneal is done, stop on the first eval without meaningful improvement
  swa_stop_after_anneal_grace_evals: 1 # Number of post-anneal no-improve evals allowed before stopping
  swa_lr_mode: "auto"        # auto | manual
  swa_lr: 0.00005            # Used only when swa_lr_mode=manual
  swa_lr_ratio: 0.12         # Auto mode: target fraction of effective LR around SWA start
  swa_lr_min: 0.00003        # Auto mode lower clamp
  swa_lr_max: 0.00020        # Auto mode upper clamp
  
  # Advanced training features
  label_smoothing: 0.08      # Label smoothing (0.0 = off, 0.1 = standard)
  warmup_pct: 0.05           # Warmup fraction of epochs (e.g., 0.02-0.05)
  min_lr_ratio: 0.005        # Min LR = base_lr * ratio
  
  # v4.3: WDL-specific options
  wdl_label_smoothing: 0.01  # Smoothing for value head (WDL is more sensitive to overconfidence)
  # Loss weights
  policy_loss_weight: 1.0    # Policy loss weight
  value_loss_weight: 0.75    # Stronger value supervision; policy was ahead of value for MCTS use
  value_scalar_aux_loss_weight: 0.25 # Extra SmoothL1 on W-L scalar to improve search calibration
  train_metrics_interval: 2  # Compute expensive train top-k/softmax metrics every N batches; val metrics remain full
  # 🆕 WDL value weighting by move index (later positions = stronger signal)
  value_move_weighting: true
  value_move_weight_min: 0.1
  value_move_weight_use_game_length: true
  value_move_weight_min_total_moves: 40

  # Evaluation
  eval_every: 1              # Evaluate every N epochs
  
  # Early stopping
  max_patience: 7            # Stop if no improvement for N epochs
  min_delta: 0.001           # Minimum improvement threshold








# ------------------------------------------------------------------------------
# REINFORCEMENT LEARNING (RL)
# ------------------------------------------------------------------------------
reinforcement_learning:
  # ---------------------------
  # Core RL Loop
  # ---------------------------
  version: "rl15"                # RL run/version tag added to RL log filenames
  iterations: 40                # Total RL iterations
  games_per_iteration: 260      # Hour-scale RL: enough signal without letting MCTS self-play dominate runtime

  # ---------------------------
  # Self-Play Runtime
  # ---------------------------
  self_play_device: "cuda"      # cpu | cuda | auto (auto uses GPU if available)
  self_play_workers: 18         # Total self-play worker processes; central inference uses one GPU server, so this is not per-GPU
  self_play_worker_cap_multiplier: 1.7 # Allow CPU oversubscription because workers block on central inference
  self_play_torch_threads: 1    # Keep 1 thread per worker; Python MCTS already fans out across many processes
  self_play_use_compile: true   # Self-play workers: torch.compile(mode=default) on CUDA; guarded so Windows workers don't compile/cache concurrently
  self_play_central_inference_enabled: true   # Use one GPU inference server for persistent self-play workers; workers keep MCTS trees on CPU
  self_play_central_inference_servers: auto # auto = shard workers across a safe number of GPU inference servers
  self_play_central_inference_auto_min_servers: 2 # Fewer GPU server processes reduce context switching on one GPU
  self_play_central_inference_auto_workers_per_server: 9 # 18 workers -> 2 larger CIL servers with better per-server batching
  self_play_central_inference_auto_max_servers: 2 # Keep self-play on two CIL processes unless explicitly retuned
  self_play_central_inference_use_compile: true # Compile the single central GPU model; warmup happens before workers start
  self_play_central_inference_compile_warmup_batches: [1, 32, 128, 256] # Pre-warm common dynamic batch sizes outside self-play
  self_play_compile_reset_dynamo: false # Keep compiled graphs cached inside the persistent central inference process
  self_play_central_inference_flush_ms: 2.0   # Small coalescing window; two servers reduce queueing while preserving useful batch sizes
  self_play_central_inference_max_batch_size: 256 # Larger per-server batches improve GPU efficiency with sharded CIL
  self_play_central_inference_transport_dtype: "float16" # Halve IPC payloads; board planes are binary/small and CUDA inference runs under AMP
  self_play_central_inference_timeout_s: 0    # 0 = wait indefinitely for queued GPU inference; positive value = watchdog timeout
  self_play_central_inference_load_timeout_s: 300 # Parent waits for central model load before dispatching workers
  self_play_central_inference_cudnn_benchmark: false # Variable MCTS batch sizes make cuDNN autotune re-benchmark too often
  self_play_central_inference_cache_enabled: false # Raw position hashing is usually slower than useful during self-play
  self_play_central_inference_cache_entries: 4096 # Per-model LRU cache entries inside the central inference server
  persistent_self_play_workers: true  # Keep self-play workers alive across RL iterations
  self_play_worker_restart_limit: 2   # Respawn a crashed persistent worker and replay only its unfinished games
  self_play_stream_to_replay: true    # Stream worker results into replay buffer to reduce parent RAM peak
  self_play_queue_transport: true     # For persistent workers + stream_to_replay: send packed batches over mp queue instead of writing them to disk
  self_play_queue_chunk_games: 5      # Number of games bundled into one queue payload
  self_play_compile_lock_timeout_s: 900  # Max wait for another worker to finish compile/cache warmup before falling back

  self_play_save_every_games: 1  # Multiplier of games_per_iteration (0=off); progress still updates per finished game
  
  # ---------------------------
  # Self-Play Game Flow
  # ---------------------------
  use_batch_selfplay: true         # Play multiple games simultaneously (5-10x faster)
  max_batch_games_per_worker: 30     # Keep total active games/RAM near 16x20 while giving CPU more worker processes
  self_play_dispatch_chunk_games: 96 # Requested chunk cap; runtime caps it by games/worker so large chunks do not starve workers
  self_play_max_moves: 190          # Hard cap in plies; keep speed while draw claims below decide only clearly claimable games
  self_play_auto_claim_draw: true   # Allow manual draw claims from python-chess instead of waiting only for automatic terminal detection
  self_play_claim_repetition_after_moves: 64  # Plies before claiming repetition; avoid ending useful middlegame cycles too early
  self_play_claim_draw_after_moves: 120 # Plies before generic claimable draws; lets more value targets resolve naturally
  self_play_adjudication_enabled: false  # Disabled by default: self-generated terminal labels were destabilizing value training
  self_play_adjudication_min_moves: 70   # Start a bit earlier so clearly won games convert before drifting into long drawish tails
  self_play_adjudication_threshold: 0.82 # Slightly more eager conversion of stable winning positions into decisive outcomes
  self_play_adjudication_patience: 3     # Need a stable edge, but finish games faster once it is obvious
  syzygy_enabled: true                   # Probe local Syzygy tablebases in tiny endgames and finish them without wasting search
  syzygy_paths:
    - "data/syzygy"                      # Relative paths are resolved from chess/ (e.g. chess/data/syzygy)
  syzygy_max_pieces: 6                   # 6-man is the practical sweet spot; 7-man is much heavier on disk
  syzygy_auto_download_enabled: true     # If local Syzygy WDL files are missing, bootstrap them automatically on RL startup
  syzygy_auto_download_preset: "wdl_345" # Safe default: 3-4-5 WDL only. Use "wdl_345_6" for 6-man WDL too (much larger download)
  syzygy_auto_download_provider: "lichess" # Recommended mirror for auto-download (stable TLS + 3-4-5/6 WDL dirs)
  self_play_resignation_enabled: false   # Disabled by default: resignation targets fed back the model's own value errors
  self_play_resignation_min_moves: 70    # Do not allow very early resigns out of the opening
  self_play_resignation_threshold: 0.93  # Require a clearly losing root value before resigning
  self_play_resignation_patience: 3      # Need a short stable losing streak before resignation triggers
  self_play_resignation_disable_fraction: 0.10  # Keep a small slice of games resignation-free to reduce false positives
  self_play_progress_interval_games: 5  # Fewer progress file writes on Windows workers

  # ---------------------------
  # Self-Play Diversity
  # ---------------------------
  self_play_opening_diversity_enabled: true   # Start many games from short curated opening prefixes to avoid replaying the same opening shell forever
  self_play_opening_diversity_fraction: 0.60  # More opening variety so short hour-scale runs cover more structures
  self_play_opening_diversity_min_plies: 2    # Let sharp curated lines branch early
  self_play_opening_diversity_max_plies: 8    # Allow enough depth to land in asymmetrical structures
  self_play_opponent_pool_enabled: true       # Mix current-vs-current with frozen opponents instead of only mirror self-play
  self_play_opponent_current_fraction: 0.30   # Leave more room for the IL anchor once RL-best has been promoted
  self_play_opponent_best_fraction: 0.45      # Stronger best anchor: current was drifting while training mostly on its own losses
  self_play_opponent_recent_fraction: 0.10    # Keep recent pressure, but reduce model-label fragmentation in central inference
  self_play_opponent_anchor_fraction: 0.15    # After RL first beats IL-anchor, keep more IL-best pressure so RL does not overfit its own best
  self_play_recent_snapshots_to_keep: 10       # Keep a wider recent window, then let the smart selector choose the actually useful opponents
  self_play_recent_candidate_pool_size: 2     # Fewer simultaneous frozen recent models reduces MCTS batch fragmentation
  self_play_recent_recency_bias: 0.35         # Prefer fresher snapshots, but still let matchup quality dominate the selection
  self_play_recent_confidence_games: 24       # Avg games needed before a recent snapshot score is treated as high-confidence
  self_play_recent_uncertainty_bonus: 0.15    # Small exploration bonus for newer/under-tested recent snapshots
  self_play_recent_in_band_boost: 1.10        # Slight boost for recent snapshots already inside the preferred score band
  self_play_randomize_learner_color: true     # Let the training model play both colors against frozen opponents
  self_play_opponent_adaptive_enabled: false   # Reweight best/recent opponents cautiously using observed matchup scores
  self_play_opponent_adaptive_update_every: 2 # Adjust every few iterations instead of reacting to one noisy batch
  self_play_opponent_adaptive_min_games: 8    # Ignore tiny matchup samples
  self_play_opponent_adaptive_history_size: 4 # Smooth score estimates over a short recent window
  self_play_opponent_adaptive_target_score: 0.50 # Prefer opponents that are neither too easy nor too hard
  self_play_opponent_adaptive_band: 0.12      # Tighten the preferred difficulty band so the scheduler reacts sooner to bad matchups
  self_play_opponent_adaptive_min_factor: 0.60 # Do not fully zero out hard/easy opponents
  self_play_opponent_adaptive_max_factor: 1.40 # Also do not over-spike one opponent source
  self_play_opponent_current_min_fraction: 0.20 # Let the scheduler reduce mirror self-play harder when it becomes too draw-heavy
  self_play_opponent_current_max_fraction: 0.55 # Also cap mirror self-play so adaptive weighting cannot drift back into draw spam
  self_play_opponent_best_min_fraction: 0.25    # Adaptive scheduler may not drop best-model games below this share when best exists
  self_play_opponent_recent_max_fraction: 0.40  # Adaptive scheduler may not assign more than this share to all recent snapshots
  self_play_recent_latest_cap_count: 2          # Treat the newest N recent snapshots as one capped echo-chamber bucket
  self_play_recent_latest_max_fraction: 0.35    # Newest recent snapshots may not exceed this share of all self-play games
  self_play_opponent_min_score: 0.28            # Avoid opponent buckets that are so hard they mostly generate hopeless targets
  self_play_opponent_max_score: 0.72            # Avoid buckets that are so easy they stop challenging the policy
  self_play_opponent_best_min_score: 0.00       # Keep best-opponent channel alive even when it is temporarily hard
  self_play_opponent_anchor_min_score: 0.00     # Keep the IL-anchor channel alive once unlocked; it is a stability reference
  self_play_opponent_recent_min_score: 0.32     # Recent snapshots should usually be in the learnable band
  self_play_opponent_recent_max_score: 0.68     # Also skip recent snapshots that have become too easy
  self_play_opponent_target_draw_rate: 0.35     # Prefer matchups that stay meaningfully decisive instead of settling into draw-heavy shells
  self_play_opponent_draw_band: 0.10            # React sooner once an opponent source starts producing too many draws
  self_play_opponent_draw_penalty_min_factor: 0.45 # Penalize draw-heavy opponent sources more aggressively while still keeping some diversity
  self_play_store_frozen_best_positions: true   # Distill best-model MCTS replies too, not only learner moves from lost games
  self_play_store_frozen_recent_positions: false # Recent snapshots are less trustworthy teachers; keep them as opponents only
  self_play_frozen_opponent_policy_weight: 0.65  # Best replies teach policy, but should not overpower current self-play targets

  # ---------------------------
  # Replay Shaping
  # ---------------------------
  replay_dynamic_cap_enabled: true
  replay_cap_fraction_decisive: 0.80          # Keep decisive games represented without drowning neutral value calibration
  replay_cap_fraction_draw: 0.75              # Fraction is per draw-game timeline; this must be close to decisive to reach ~30-40% replay draws
  replay_cap_min_positions: 24                # Keep a fuller timeline from draw games; value needs neutral structure, not only decisive moments
  replay_cap_max_positions: 120               # Absolute hard cap to avoid RAM bloat
  
  replay_max_positions_per_game: 32           # Fallback hard cap if dynamic is disabled

  # ---------------------------
  # Exploration Schedule
  # ---------------------------
  use_temperature_schedule: true      # Enable adaptive temperature
  temperature_start: 0.65             # RL should start more focused; search, not policy noise, should drive improvement
  temperature_end: 0.45               # Keep late self-play from becoming too draw-stable while value is still recalibrating
  temperature_decay_iterations: auto  # Auto: decay spans the full RL run (matches iterations)
  adaptive_temperature_enabled: true  # Small telemetry-driven corrections on top of the base decay schedule
  adaptive_temperature_min: 0.42      # Keep controller close to the intended RL sampling regime
  adaptive_temperature_max: 0.68      # Also avoid over-correcting above the intended search regime
  adaptive_temperature_max_adjustment: 0.045 # Frequent but small corrections; avoid turning temperature into a moving target
  adaptive_temperature_draw_target: 0.30    # Moderate draw rate: enough neutral calibration without sterile self-play
  adaptive_temperature_draw_band: 0.05      # Ignore normal draw-rate noise, react to sustained drift
  adaptive_temperature_decisive_target: 0.70 # Aim for mostly decisive completed games
  adaptive_temperature_decisive_band: 0.07   # Ignore ordinary decisive-rate noise
  adaptive_temperature_min_eval_gain: 0.010  # Treat flat eval as a small sharpening signal
  adaptive_temperature_draw_step: 0.018      # Max temp move from draw pressure before smoothing
  adaptive_temperature_low_draw_step: 0.012  # Re-open exploration gently when games are too decisive
  adaptive_temperature_decisive_step: 0.014  # Small correction from decisive-rate pressure
  adaptive_temperature_eval_step: 0.010      # Eval stagnation should nudge, not dominate
  adaptive_temperature_value_guard_step: 0.010 # Extra temp reduction per active value-guard streak
  adaptive_temperature_smoothing: 0.25       # More responsive, while max_adjustment keeps it small
  adaptive_temperature_threshold_step: 1     # Only small threshold movement with adaptive temperature

  # ---------------------------
  # MCTS Search
  # ---------------------------
  mcts_simulations: 192     # More root evidence so low-weight value can separate moves without needing aggressive Q
  mcts_batch_size: 192        # Lower search-batch latency; central inference already recovers GPU batching across workers
  mcts_reuse_tree: true      # Reuse tree across moves (faster, better)
  mcts_cache_node_tensors: false # Keep per-worker RAM lower; central inference rebuilds leaf tensors in batch anyway
  self_play_history_fp16: true # Store active game history in fp16 inside workers; replay tensors are still emitted as fp32
  mcts_c_puct_base: 19652    # AZ-style slow growth; keep exploration stable as sims increase
  mcts_c_puct_init: 1.20     # Slightly less prior-dominated so backed-up value can matter at low weight
  mcts_c_puct_max: 2.00      # Keep prior pressure bounded once the root has enough visits
  mcts_use_fpu: true         # First Play Urgency baseline for unvisited/low-visit children
  mcts_fpu_reduction: 0.12   # Used only when mcts_fpu_absolute is null
  mcts_fpu_absolute: 0.0     # Neutral unvisited Q; avoids punishing exploration while value is still calibrating
  mcts_q_value_scale: 0.0    # Small dynamic trust add-on after the trust-scaled base Q voice
  mcts_q_selection_weight: 0.08 # Smaller base Q voice; runtime scales it by value trust before MCTS sees it
  mcts_q_selection_floor: 0.030 # After warmup, keep MCTS from becoming prior-only when trust temporarily disables Q
  mcts_q_selection_trust_scaling_enabled: true # When trust falls, the main Q selection voice falls too
  mcts_q_value_scale_schedule:
    enabled: true
    warmup_iterations: 6    # Keep Q disabled early, then let a tiny value floor make search real from iteration 7
    start: 0.002            # Start very small; value MAE is still not good enough for aggressive Q
    end: 0.015              # Small final add-on; the floor supplies continuity while trust controls extra Q
    power: 1.60             # Slow ramp; trust gates still shrink this when MAE/eval are weak
    value_guard_scale: 0.65  # Reduce Q trust hard when value guard detects poor value/eval behavior
    eval_stagnation_scale: 0.80 # Nudge Q trust down when eval stops improving
    dynamic_trust_enabled: true # Long-term controller: trust value more only when value/eval metrics are healthy
    trust_initial: 0.30       # Start cautious; a good MAE alone is not proof that Q improves play
    trust_min: 0.0
    trust_max: 0.45
    trust_step_up: 0.015
    trust_step_down: 0.045
    trust_value_only_step_fraction: 0.35 # Between MCTS evals, allow tiny recovery nudges from value metrics
    trust_max_single_eval_drop: 0.06 # Q trust should move often, but in small increments
    trust_bad_eval_cooldown: 2 # After a bad MCTS-vs-no-MCTS eval, do not recover trust from value-only metrics
    trust_promotion_grace_evals: 1 # Reset comparable baselines immediately after promoting a new best
    trust_good_mae: 0.45
    trust_bad_mae: 0.52
    trust_good_std_ratio: 0.62 # pred_value_std / target_value_std; value should not stay too flat
    trust_bad_std_ratio: 0.50
    trust_good_q_ablation_gap: 0.05 # MCTS(Q-on) must clearly beat MCTS(Q-off) before trust rises
    trust_bad_q_ablation_gap: -0.02 # Q-off wins are an early warning that value is hurting search
    trust_good_q_requires_mcts_not_bad: true # Do not reward Q if both Q-on and Q-off MCTS are weak vs raw policy
    trust_min_mcts_score_for_q_good: 0.45 # Q can earn trust only when MCTS itself is at least competitive
    trust_q_ablation_bad_weight: 1.25
    trust_disable_q_ablation_gap: -0.08 # If Q-on clearly loses to Q-off, fully disable Q for a short probe window
    trust_good_mcts_gap: 0.08  # MCTS score - no-MCTS score; require a real edge before raising Q trust
    trust_good_mcts_min_score: 0.45 # A positive gap at a terrible absolute score should not revive Q
    trust_bad_mcts_gap: -0.04  # Avoid punishing normal eval noise around parity
    trust_mcts_gap_bad_weight: 1.00
    trust_disable_q_mcts_gap: -0.10 # If MCTS is clearly worse than raw policy, remove Q instead of merely shrinking it
    trust_disable_q_cooldown_evals: 2 # Keep Q off across the next short window so search without value can be measured
    trust_recovery_after_disable: 0.08 # Reintroduce Q as a very small probe only after search metrics turn good again
    trust_anchor_drop_tolerance: 0.08
    trust_anchor_drop_requires_search_bad: true # Anchor drops are stability warnings, not standalone proof that Q is bad
    trust_anchor_bad_weight: 0.50
  mcts_q_centered: true      # Use Q as relative sibling preference, not as poorly calibrated absolute value
  mcts_q_min_child_visits: 2 # Require a little real child evidence before Q can redirect visits
  mcts_q_parent_visit_warmup: 48 # Let policy/PUCT compare moves before value starts steering the root
  mcts_q_tanh_scale: 0.55    # Smoothly squash value differences without turning most deltas into the same saturated bonus
  mcts_q_max_abs: 0.040      # Per-edge Q cap; enough for ordering, too small to bulldoze a strong raw policy
  mcts_q_min_fullmove: 16    # Do not let noisy opening value steer search
  mcts_q_full_weight_fullmove: 34 # Ramp Q in through the middlegame instead of switching it on globally
  mcts_temperature: 0.65      # Sharper visit sampling produces better policy targets once the search is strong enough
  mcts_temperature_threshold: 12  # Quicker shift toward deterministic play helps convert advantages instead of drifting
  mcts_dirichlet_alpha: 0.3  # Standard rzędu szachowego
  mcts_dirichlet_weight: 0.080 # A bit more root exploration so low-Q search can find alternatives to the raw prior
  mcts_tactical_priors_enabled: true  # Small tactical nudges help low-budget search notice forcing moves sooner
  mcts_tactical_capture_bonus: 0.06   # Small prior boost for captures
  mcts_tactical_winning_capture_bonus: 0.05  # Extra nudge for obviously favorable captures
  mcts_tactical_check_bonus: 0.04     # Checks are often tactically forcing
  mcts_tactical_promotion_bonus: 0.08 # Promotions are rare and critical
  mcts_tactical_recapture_bonus: 0.05 # Helps short tactical recapture sequences
  mcts_search_early_stop_enabled: true          # Training/self-play only; eval/promotions/Elo always use full-budget MCTS
  mcts_search_early_stop_min_simulations: 80    # Never accept a policy target before this many visits
  mcts_search_early_stop_check_interval: 16     # Check stop criteria in chunks to avoid CPU churn
  mcts_search_simple_position_legal_moves: 6    # Low-branching positions may stop earlier once stable
  mcts_search_simple_endgame_piece_count: 10    # Small endgames often stabilize sooner, especially with Syzygy nearby
  mcts_search_early_stop_min_top_visit_prob: 0.68 # Stop only when the best move has a real visit lead
  mcts_search_early_stop_min_visit_gap: 0.16    # Require separation over the runner-up without forcing full-budget searches
  mcts_search_early_stop_max_visit_entropy: 0.62 # Let clearly narrowing roots stop before every tail move is sampled
  mcts_search_early_stop_min_budget_fraction: 0.78 # Normal roots may stop only after enough comparison visits
  mcts_search_early_stop_min_explored_prior_mass: 0.92 # Cover most meaningful prior mass, not every low-prior tail
  mcts_search_early_stop_min_visited_moves: 5   # Avoid stopping before MCTS has compared plausible moves
  mcts_search_sensitive_min_budget_fraction: 0.92 # True checks/sharp tactics still spend most of the budget
  mcts_search_sensitive_min_explored_prior_mass: 0.96
  mcts_search_sensitive_min_visited_moves: 6
  mcts_search_check_budget_multiplier: 1.20
  mcts_search_sharp_tactic_budget_multiplier: 1.10 # Only promotions, checks, or clearly winning captures get extra budget
  mcts_search_sharp_capture_min_gain: 1.0       # Do not classify every legal capture as a sensitive tactic
  mcts_search_late_extra_after_ply: 72          # Later roots can still get extra proof, but not most middlegames
  mcts_search_late_extra_fraction: 0.12         # Keep expensive late probes sparse on 160-sim training
  mcts_search_late_extra_budget_multiplier: 1.35 # 160 base -> ~216 cap for sampled late roots
  policy_target_pruning_enabled: true           # Drop low-visit exploration noise before training the policy head
  policy_target_pruning_keep_top_n: 8           # Always keep a broader top slice so uncertain positions retain more searched alternatives
  policy_target_pruning_max_moves: 28           # Let wider post-search support reach the learner before pruning the long tail
  policy_target_pruning_min_prob: 0.005         # Still trim only the weakest tail; low-probability tactical moves can survive if search supports them
  policy_target_pruning_min_fraction_of_max: 0.05 # Keep moves that are closer to the best visit count instead of over-sharpening the target
  policy_target_pruning_keep_mass: 0.96         # Preserve more of the MCTS distribution when many moves are similarly plausible
  policy_target_quality_weighting_enabled: true # Downweight flat/ambiguous targets at storage time, not only during training
  policy_target_quality_min_weight: 0.50        # MCTS targets are now cleaner; do not starve policy gradients on broader roots
  policy_target_quality_entropy_threshold: 0.78 # Be less punitive to wider MCTS distributions after Q starts changing top moves
  policy_target_quality_top1_threshold: 0.45    # Let moderately confident MCTS targets train the policy instead of only sharp roots
  policy_target_search_discovery_weighting_enabled: true # Give clean MCTS discoveries a modest extra policy push
  policy_target_search_discovery_min_q_delta: 0.06       # Require a clear Q edge before boosting changed-top targets
  policy_target_search_discovery_q_delta_ref: 0.45       # Larger reference keeps the boost gradual, not explosive
  policy_target_search_discovery_bonus: 0.10             # Small base policy-weight bonus when search changes the top move
  policy_target_search_discovery_q_bonus: 0.15           # Extra bonus from positive Q delta
  policy_target_search_discovery_rank_bonus: 0.06        # Small bonus when the prior top drops below rank 2 in visits
  policy_target_search_discovery_allow_q_neutral: true   # Let strong no-Q search discoveries teach policy too
  policy_target_search_discovery_min_top_visit_prob: 0.55 # No-Q discovery must have a clear visit winner
  policy_target_search_discovery_min_prior_rank: 2       # Prior top must fall behind the MCTS winner
  policy_target_search_discovery_neutral_min_q_delta: -0.02 # Do not boost discoveries that backed-up value clearly dislikes
  policy_target_search_discovery_neutral_bonus: 0.06     # Smaller boost for no-Q discoveries than Q-backed discoveries
  policy_target_search_discovery_neutral_rank_bonus: 0.04 # Extra no-Q boost when prior top falls clearly in visit rank
  policy_target_search_discovery_max_weight: 1.25        # Controlled uptake; enough to learn discoveries without chasing noise
  mcts_good_target_min_top_visit_prob: 0.55 # Diagnostic: search produced a clear top target
  mcts_good_target_min_visit_gap: 0.12      # Diagnostic: top move is separated from the runner-up
  
  # ---------------------------
  # Optimizer & Training
  # ---------------------------
  batch_size: 1024           # More gradient steps per iteration from the same replay buffer
  learning_rate: 0.0002      # Fallback base LR when RL auto-tune cache is unavailable
  weight_decay: 0.002         # L2 regularization (AdamW)
  backbone_lr_factor: 0.75   # Keep shared IL features stable while RL targets are still noisy
  policy_head_lr_factor: 1.25 # Policy needs to absorb Q-backed MCTS discoveries before raw play falls behind search
  value_head_lr_factor: 1.20  # Value/Q is the bottleneck for useful MCTS, so adapt the value head faster
  head_weight_decay: 0.0005    # Heads need less AdamW decay than the shared backbone
  no_decay_weight_decay: 0.0 # Do not decay BN/norm/bias parameters
  grad_clip: 0.5             # Gradient clipping
  train_epochs_per_iteration: 3  # Give policy another pass over replay so MCTS discoveries become raw-network strength
  q_disabled_training_q_threshold: 0.001 # When Q is effectively absent, avoid full-strength policy self-distillation
  q_disabled_training_after_warmup_only: true
  q_disabled_policy_loss_scale: 0.80
  q_disabled_value_loss_scale: 1.05
  q_disabled_value_loss_max: 0.54
  post_promotion_stabilization_iterations: 4 # Slow updates briefly after replacing best, so the model does not drift off the promoted baseline
  post_promotion_lr_scale: 0.70
  post_promotion_policy_loss_scale: 1.05
  post_promotion_value_loss_scale: 0.90
  rl_diagnostic_ema_alpha: 0.35 # Smoothing for MCTS/no-MCTS and Q ablation control signals

  # Replay buffer sizing:
  # Capacity now bootstraps small and then auto-resizes from observed positions/iteration.
  replay_buffer_multiplier: 10    # Smooth post-promotion target shifts with a slightly longer replay horizon
  replay_buffer_bootstrap_positions_per_iteration: auto  # auto = start from a small conservative bootstrap instead of a large fixed guess
  replay_buffer_ema_alpha: 0.15   # React more slowly so replay size does not shrink too aggressively between iterations
  replay_buffer_min_size: 4096    # Never shrink below a small practical floor
  replay_buffer_capacity_round_to: 256  # Round capacity changes to reduce realloc noise
  replay_fp16: true             # Store replay tensors in float16 to reduce RAM (~2x)
  replay_max_policy_targets: 28 # Hard cap for stored policy support; keeps replay/queue tensors aligned with pruning and cuts RAM
  replay_decisive_sampling_fraction: 0.08   # Avoid re-skewing batches toward decisive targets after draw retention was raised
  replay_decisive_value_epsilon: 0.05       # Treat |value| > epsilon as decisive for replay sampling
  replay_value_balanced_sampling_fraction: 0.30 # Reserve part of each batch for win/draw/loss-balanced targets so one recent value sign cannot dominate
  replay_value_balance_epsilon: 0.05        # Values inside +/-epsilon count as neutral for balanced replay sampling
  replay_hard_negative_sampling_fraction: 0.0   # Removed extra sampler slice; value-balanced + recent replay is enough for this RL-after-IL phase
  replay_hard_negative_min_importance: 1.35    # Threshold for positions to count as "hard" in replay sampling
  replay_weighted_sampling_power: 0.55      # Soften importance-weighted replay further while policy catches up to new Q targets
  replay_recent_sampling_fraction: 0.06       # Reduce fresh-target shock after a best promotion
  replay_recent_window_fraction: 0.25         # Keep the recent bucket focused while preserving more mid-age replay in normal sampling
  replay_quality_sampling_fraction: 0.0       # Removed redundant importance sampler that was reintroducing noisy tactical tails
  replay_quality_min_importance: 1.15         # Lower than hard negatives so quality replay includes more than just the tactical tail
  replay_quality_value_bonus: 0.20            # Slightly prefer positions with clearer value targets inside the quality slice
  replay_resize_preserve_decisive_fraction: 0.15  # On buffer shrink, preserve some older decisive samples instead of only the newest data
  replay_resize_preserve_decisive_min_count: 1024 # Floor for protected decisive positions when available
  replay_importance_gating_enabled: true       # Gate per-game positions by importance before the normal replay cap
  replay_importance_gate_fraction_decisive: 0.75 # Still prefer important decisive moments, but avoid crowding out neutral calibration
  replay_importance_gate_fraction_draw: 0.90   # Keep most draw-game timelines before capping so replay draw share can track self-play
  replay_importance_gate_min_positions: 16     # Never let importance gating erase a game completely
  replay_importance_top_fraction: 0.70         # Mostly keep top-importance moments plus some timeline coverage
  
  # Learning rate schedule
  use_lr_schedule: true
  warmup_pct: 0.10           # Longer RL warmup: early replay/value targets are noisy and benefit from gentler updates
  min_lr_ratio: 0.35         # Keep late policy updates alive while MCTS discoveries become cleaner
  
  # Entropy regularization
  entropy_weight: 0.0003      # Keep some policy spread, but do not push late self-play back toward drawish entropy
  policy_target_confidence_weighting_enabled: true # Downweight flat MCTS policy targets instead of treating tiny visit differences as equally authoritative
  policy_target_confidence_min_weight: 0.58 # Stop under-training broader but useful MCTS distributions
  policy_target_confidence_power: 1.0       # Higher sharpens the preference for confident targets; lower is more uniform
  
  # Data augmentation
  use_augmentation: true
  augment_horizontal_flip: true   # Mirror board horizontally
  augment_prob: 0.5               # 50% chance per position
  
  # ---------------------------
  # Evaluation & Promotion
  # ---------------------------
  eval_games: 100            # Fallback total games when staged eval is disabled
  eval_workers: auto         # MCTS eval uses all logical CPU threads plus central GPU inference
  eval_worker_restart_limit: 2 # Respawn a crashed MCTS eval worker and replay only unfinished games
  eval_cpu_threads_to_reserve: 0
  eval_torch_threads: 1
  eval_batch_games: 16       # Active MCTS eval games searched together inside each worker
  eval_central_inference_enabled: true
  eval_central_inference_min_games: 2
  eval_central_inference_servers: auto
  eval_central_inference_auto_min_servers: 2
  eval_central_inference_auto_workers_per_server: 6
  eval_central_inference_auto_max_servers: 3
  eval_central_inference_flush_ms: 2.0
  eval_central_inference_max_batch_size: 256
  eval_central_inference_transport_dtype: "float16"
  eval_central_inference_timeout_s: 0
  eval_central_inference_stall_warning_s: 15
  eval_central_inference_load_timeout_s: 300
  eval_central_inference_use_compile: true
  eval_central_inference_compile_warmup_batches: [1, 32, 128, 256]
  eval_central_inference_cudnn_benchmark: false
  eval_central_inference_cache_enabled: false
  eval_mcts_simulations_multiplier: 2.0  # Evaluate the same search regime we train; deeper eval can help the stronger anchor more than the learner
  eval_max_moves: 320        # Align eval with self-play so results are not dominated by ultra-long unresolved games
  eval_auto_claim_draw: true
  eval_claim_repetition_after_moves: 70
  eval_claim_draw_after_moves: 180  # Generic claimable draws after ~70 full moves
  eval_every: 2               # Slightly faster feedback loop while iterating toward surpassing IL
  eval_no_mcts_enabled: true  # Extra policy-only evaluation: no MCTS, does not affect best-model promotion
  eval_no_mcts_every: 1       # Run the no-MCTS eval every RL iteration
  eval_no_mcts_games: 60      # Cheap raw-policy signal every iteration without slowing RL too much
  eval_no_mcts_use_fixed_openings: true
  eval_q_ablation_enabled: true # Compare MCTS with current Q against MCTS with Q disabled
  eval_q_ablation_every: 2      # Run with regular MCTS eval, not every raw-policy check
  eval_q_ablation_games: 100     # Less noisy paired diagnostic; controls Q trust, not promotion
  eval_q_ablation_min_q_scale: 0.001
  eval_q_ablation_use_fixed_openings: true
  eval_sequential_enabled: true # Stop MCTS eval early when the result is already clearly bad/good enough
  eval_sequential_min_games: 60
  eval_sequential_chunk_games: 60
  eval_sequential_max_games: 180
  eval_sequential_reject_score_rate: 0.44
  eval_sequential_confidence_z: 0.90
  eval_staged_enabled: true   # true = two-stage eval vs best: short MCTS screen first, then extra MCTS games only if stage 1 looks promising
  eval_stage1_games: 60       # Fallback when sequential eval is disabled
  eval_stage2_games: 120      # Fallback when sequential eval is disabled
  eval_stage2_gate_score_rate: 0.45  # Run stage 2 if stage 1 score_rate reaches at least this threshold
  eval_stage2_gate_true_win_rate: 0.02  # Also require a small decisive edge in stage 1 to avoid paying for stage 2 on drawish noise
  eval_mcts_after_q_warmup_extra_iterations: 0 # With Q warmup=8, first MCTS eval is iteration 9; no-MCTS still runs every iteration
  eval_fixed_openings_enabled: true
  eval_fixed_openings_max_plies: 6
  early_stop_enabled: true
  early_stop_patience: 5        # Stop RL after 5 eval cycles without meaningful improvement
  early_stop_patience_increment_on_promotion: 2 # Give each promoted best one extra eval cycle to be surpassed
  early_stop_min_score_improvement: 0.01   # Require at least +1pp score-rate improvement to reset patience
  early_stop_min_true_win_improvement: 0.005 # Or at least +0.5pp true-win improvement
  score_rate_threshold: 0.55    # Promote best model only if score vs current best is clearly positive
  true_win_rate_threshold: 0.02 # Also require some real decisive edge, not only draw-heavy scoring
  promotion_confirmations_required: 2 # Require consecutive passing MCTS evals before replacing best
  promotion_require_anchor_non_regression: true # A new RL best must not regress vs the original IL anchor when that anchor is available
  promotion_anchor_min_score_rate: 0.50         # Non-regression vs IL anchor: at least equal score
  promotion_anchor_min_true_win_rate: 0.00      # Optional decisive-win floor vs IL anchor
  anchor_eval_enabled: true
  anchor_eval_every: 1          # Run anchor eval on every RL evaluation cycle
  anchor_eval_games: 60
  anchor_eval_use_fixed_openings: true
  checkpoint_every: 10        # Save checkpoint every N iterations
  
  # ---------------------------
  # Loss Weights
  # ---------------------------
  policy_loss_weight: 1.0    # Policy loss weight
  value_loss_weight: 0.50    # Value/Q must become usable, but avoid overpowering policy learning
  value_aux_scalar_loss_weight: 0.08  # Keep scalar consistency so backed-up Q has a usable ordering signal
  value_wdl_label_smoothing: 0.015    # Slightly less smoothing so value predictions do not stay too flat
  value_target_weighting_enabled: true # Downweight early-game final-outcome noise; late positions carry clearer value signal
  value_target_weight_min: 0.35
  value_target_weight_draw_min: 0.45
  value_target_weight_power: 1.75
  value_metric_weight_min: 0.20
  value_metric_max_fullmove: 80
  value_phase_opening_max_fullmove: 12
  value_phase_endgame_min_fullmove: 40
  value_phase_max_fullmove: 120
  # Value bootstrap: early supervision, then taper once Q starts entering MCTS.
  value_loss_weight_schedule:
    start: 0.50
    end: 0.40
    power: 1.00
  value_loss_weight_adaptive_enabled: true
  value_loss_weight_adaptive_max_adjustment: 0.06
  value_loss_weight_adaptive_smoothing: 0.40
  value_loss_weight_low_trust_threshold: 0.35
  value_loss_weight_high_trust_threshold: 0.58
  value_loss_weight_low_trust_bonus: 0.030
  value_loss_weight_q_disabled_bonus: 0.040
  value_loss_weight_eval_stagnation_bonus: 0.015
  value_loss_weight_high_trust_reduction: 0.020
  value_guard_enabled: false
  value_guard_mae_window: 3
  value_guard_patience: 1
  value_guard_mae_increase_tolerance: 0.006
  value_guard_min_score_gain: 0.005
  value_guard_scale: 0.90
  value_guard_min_weight: 0.70
  adaptive_dirichlet_enabled: true       # Reduce root noise when self-play turns too draw-heavy or eval stagnates
  adaptive_dirichlet_min_weight: 0.015   # Keep a small amount of root noise for exploration even under heavy draw pressure
  adaptive_dirichlet_draw_scale: 0.65    # Cut root noise harder when completed draw rate drifts above target
  adaptive_dirichlet_value_guard_scale: 0.85 # Reduce root noise further while value guard is active
  adaptive_dirichlet_eval_scale: 0.85    # Also tighten root noise when eval stops improving






# ------------------------------------------------------------------------------
# HARDWARE & OPTIMIZATION
# ------------------------------------------------------------------------------
hardware:
  device: "cuda"             # Device: cuda, cpu, or mps (Mac)
  
  # Performance optimizations
  use_amp: true              # Mixed Precision Training (~2x speedup)
  use_bfloat16: true         # bfloat16 instead of float16 (better range)
  num_workers: 5             # CPU workers for data loading
  prefetch_factor: 1         # DataLoader prefetch factor
  train_prefetch_factor: 1   # Keep one prepared batch per train worker to reduce RAM/pagefile pressure
  val_prefetch_factor: 1     # One queued val batch per worker; raise to 2 only if RAM/pagefile stays calm
  pin_memory: true           # Faster GPU data transfer
  val_pin_memory: true       # Validation still benefits from pinned transfer
  persistent_workers: true   # Keep train workers alive between epochs
  val_persistent_workers: false # Do not keep validation workers resident between evals
  dataloader_index_mmap: true # Store sampled index arrays as .npy mmap so workers share them
  dataloader_numpy_shuffle: true # Compact shuffle permutation; avoids huge Python int lists
  use_compile: true          # torch.compile: fuse Conv+BN+ReLU kernels (~3x speedup)


# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging:
  log_level: "INFO"          # DEBUG, INFO, WARNING, ERROR
  tensorboard: true          # Enable TensorBoard logging
  print_every: 10            # Print stats every N batches
  il_plot_smoothing_enabled: true # Light EMA smoothing for IL PNG curves; exact best/SWA markers stay raw
  il_plot_smoothing_alpha: 0.35   # Higher = follows raw curve more closely, lower = smoother
  il_plot_smoothing_min_points: 5 # Do not smooth very short runs


# ------------------------------------------------------------------------------
# 🆕 ELO ESTIMATION (via Stockfish matches during evaluation)
# ------------------------------------------------------------------------------
elo_estimation:
  enabled: true                # Enable Elo estimation during training
  eval_every: 2                # Estimate Elo every N epochs (expensive, don't run every epoch)
  il_eval_every: 2             # IL periodic Elo cadence
  il_games_per_level: 24       # Adaptive IL cap per useful level; most obvious levels get only probe games
  il_levels: [1320, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2600, 2800]
  il_stockfish_time_limit: 0.10 # Fast periodic IL Elo; use manual eval for precise final numbers
  il_max_moves: 120            # Shorter periodic IL games avoid slow low-signal endings
  il_workers: 0                # Auto worker count, capped by training-priority settings
  il_stockfish_threads: 1      # Throughput-oriented periodic IL Elo
  il_stockfish_hash_mb: 32     # Keep total background hash modest
  final_on_il_shutdown: true   # In IL: after normal end or first Ctrl+C, run precise final Elo for best IL and SWA; Ctrl+C during it cancels the check
  final_il_games_per_level: 40 # Final IL Elo is slower/more stable; adaptive ladder focuses only informative levels
  final_il_levels: [1320, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2600, 2800]
  final_il_stockfish_time_limit: 0.10
  final_il_max_moves: 150
  final_il_workers: 12
  final_il_stockfish_threads: 1
  final_il_stockfish_hash_mb: 32
  final_il_use_mcts: false     # Keep IL final Elo as raw-net strength; enable manually only when you want slow search strength
  final_il_mcts_simulations: 160
  rl_every_n_evals: 3          # In RL: run Stockfish Elo every Nth model-vs-best evaluation
  rl_min_score_rate_for_stockfish: 0.50     # Gate periodic Stockfish Elo by score rate vs current best
  rl_min_true_win_rate_for_stockfish: 0.02  # Also require at least a small decisive edge before paying for Elo
  stockfish_path: "stockfish"  # Path to Stockfish binary (or just "stockfish" if on PATH)
  workers: 0                   # Parallel game workers (0/auto = use full available CPU budget, adjusted by stockfish_threads in RL)
  prioritize_training: true    # Keep IL training/data-loading responsive while Elo runs
  reserve_dataloader_workers: true    # Reserve hardware.num_workers CPU slots for DataLoader
  free_threads_utilization: 1.0       # Use this fraction of free CPU threads after DataLoader reservation
  stockfish_priority: "below_normal"  # Windows process priority for Stockfish: idle|below_normal|normal
  stockfish_hide_window: true  # Windows: spawn Stockfish without console windows
  batch_model_moves: true      # Batch model-side Elo moves across active games to better use GPU/CPU, especially with MCTS
  batch_raw_model_moves: false # Raw NN Elo is Stockfish-bound; independent game workers avoid batched per-ply waits
  eval_elo_stockfish_priority: "normal" # Standalone eval_elo.py is foreground/user-visible, so do not background Stockfish
  eval_elo_raw_worker_multiplier: 2.0 # Standalone raw NN auto-workers can oversubscribe CPUs because the NN side is very cheap
  eval_elo_mcts_worker_multiplier: 1.5 # Standalone MCTS Elo benefits from more active games because the model side is batched
  eval_elo_central_inference_enabled: true # MCTS Elo uses RL-style central GPU inference with independent MCTS clients
  eval_elo_central_inference_servers: "auto" # auto ~= workers / target_workers_per_server
  eval_elo_central_inference_auto_workers_per_server: 10
  eval_elo_central_inference_auto_min_servers: 1
  eval_elo_central_client_groups: "auto"
  eval_elo_central_target_client_groups: 1 # Keep one large MCTS client by default; small client groups destroyed GPU batch size
  eval_elo_central_min_client_groups: 1
  eval_elo_central_max_client_groups: 2
  eval_elo_central_games_per_worker_chunk: 20 # Each MCTS client pulls roughly active_games * this many queued games per chunk
  eval_elo_central_inference_max_batch_size: 256
  eval_elo_central_inference_flush_ms: 2.0
  eval_elo_central_inference_transport_dtype: "float16"
  eval_elo_central_inference_use_compile: false # Keep manual Elo stable; enable only after torch.compile cache is healthy
  eval_elo_central_inference_cache_enabled: false
  eval_elo_central_inference_timeout_s: 0 # 0 = wait indefinitely; contention should slow Elo/MCTS, not abort inference
  stockfish_threads: 1         # Threads per Stockfish process; tune together with workers (e.g. 12x1, 6x2, 4x3)
  stockfish_hash_mb: 64        # Hash MB per Stockfish process; total RAM ~= workers * hash_mb plus engine overhead
  max_error_logs_per_type: 8   # Suppress repeated Stockfish error spam after N logs
  elo_verbose_adaptive: false   # Keep Elo progress readable; final table still shows per-level W/D/L
  elo_verbose_worker_stats: false
  elo_verbose_batch_stats: false
  elo_print_completion_summary: true
  elo_print_worker_summary: false
  games_per_level: 40          # Max games per informative Elo level; adaptive ladder probes/skips obvious levels
  levels: [1320, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2600, 2800]
  stockfish_time_limit: 0.1    # Seconds per Stockfish move (lower = faster but weaker play)
  max_moves: 150               # Max full moves per game before declaring draw
  adaptive_ladder_enabled: true # Probe from weakest Stockfish upward, then spend games only near the useful Elo bracket
  adaptive_probe_games_per_level: 8
  adaptive_min_batch_games: 32  # Adaptive Elo schedules multi-level waves so central MCTS keeps CPU/GPU fed
  adaptive_focus_games_per_level: 24
  adaptive_extra_games_per_level: 8
  adaptive_target_focus_levels: 3
  adaptive_focus_min_score: 0.20
  adaptive_focus_max_score: 0.80
  adaptive_skip_high_score: 0.92
  adaptive_stop_low_score: 0.08
  adaptive_max_total_games: 160
  adaptive_target_standard_error: 45.0 # Stop adaptive Elo focus once the estimate is precise enough for training decisions
  adaptive_min_games_for_se_stop: 80    # Avoid stopping from a lucky tiny probe sample
  rl_games_per_level: 24       # Periodic RL uses same adaptive ladder with a lower cap than final/manual checks
  rl_stockfish_time_limit: 0.10  # Faster periodic RL Elo; keep constant across runs for comparability
  rl_max_moves: 120            # Shorter periodic RL Elo games to avoid very long low-signal endings
  rl_workers: 12               # Fill the CPU budget during periodic RL Elo
  rl_stockfish_threads: 1      # Throughput-oriented periodic RL Elo: many 1-thread engines
  rl_stockfish_hash_mb: 32     # Enough cache for short time controls without wasting RAM
  final_rl_games_per_level: 24   # Promoted RL Elo stays accurate by focusing useful levels, not saturated extremes
  final_rl_levels: [1320, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2600, 2800]
  final_rl_stockfish_time_limit: 0.20  # Keep final RL Elo closer to the previous baseline
  final_rl_max_moves: 150      # Final RL Elo keeps the normal move horizon
  final_rl_workers: 12         # More active final Elo games keeps model-side MCTS batches useful
  final_rl_raw_worker_multiplier: 2.0 # Final raw NN Elo can run more Stockfish games in parallel because raw inference is cheap
  final_rl_mcts_worker_multiplier: 1.0 # Final MCTS Elo can overfill active games to improve shared search batches
  final_rl_stockfish_threads: 1  # Throughput-oriented final Elo: many 1-thread engines plus batched model MCTS
  final_rl_stockfish_hash_mb: 32  # Keep total Stockfish hash reasonable with 12 parallel engines
  
  # MCTS options (generic/manual Elo defaults). RL MCTS Elo uses the RL eval budget:
  # reinforcement_learning.mcts_simulations * reinforcement_learning.eval_mcts_simulations_multiplier.
  # NOTE: IL training forces this to false (raw net only for speed).
  use_mcts: false              # Enable MCTS for model moves (default false)
  mcts_simulations: 100        # Generic non-RL MCTS sims per move
  final_rl_use_mcts: true      # In RL final Elo: optionally override use_mcts for the last Stockfish test
  rl_promoted_use_mcts: true   # When a model is promoted to best, evaluate and save both raw NN Elo and MCTS Elo

  # Async worker device (used by IL background Elo and RL cancellable Elo worker).
  async_in_il: true                # true = do not block IL training loop on Elo
  async_device: "cpu"              # cpu | cuda | same (same = training device)
  async_wait_on_shutdown_sec: 0.0  # Optional wait for pending async Elo at normal end


# ------------------------------------------------------------------------------
# 🆕 DEBUG & PROFILING
# ------------------------------------------------------------------------------
debug:
  enabled: true                    # Master switch for debug mode

  # Imitation Learning diagnostics
  il:
    profile_training: true          # Time breakdown per epoch
    print_profile_to_console: false # Keep epoch timing tables in logs/debug only
    log_gpu_memory: true            # GPU memory usage
    print_batch0_diagnostics: false # Print batch-0 target stats + WDL samples
    print_wdl_loss_diagnostics: false # Print one-time WDL class distribution from loss

  # Reinforcement Learning diagnostics
  rl:
    profile_training: false         # Iteration/self-play/train/eval timing breakdown
    log_gpu_memory: false           # GPU memory usage around RL iterations
    central_inference:
      verbose: false                # Per-request/heartbeat logs; summaries still go to console, RL.csv and PNG
      stall_warning_s: 15           # When verbose=true, print if a worker waits this long for central inference


# ------------------------------------------------------------------------------
# REPRODUCIBILITY
# ------------------------------------------------------------------------------
seed: 42                     # Random seed

