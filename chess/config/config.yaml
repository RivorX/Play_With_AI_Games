# ==============================================================================
# CHESS AI CONFIGURATION - OPTIMIZED FOR RTX 5060Ti 16GB
# ==============================================================================

# ------------------------------------------------------------------------------
# FILE PATHS (relative to chess/ project root)
# ------------------------------------------------------------------------------
paths:
  data_dir: "data"
  models_dir: "models"
  logs_dir: "logs"

  # Best models (single file, overwritten when improved)
  best_model_il: "models/best_model_il.pt"
  best_model_rl: "models/best_model_rl.pt"

  # Checkpoint directories (saved every N epochs/iterations)
  il_checkpoints_dir: "models/IL"
  rl_checkpoints_dir: "models/RL"


# ------------------------------------------------------------------------------
# DATA
# Each section below matches exactly one pipeline phase.  The loader flattens
# this presentation internally, so changing a value still has the cache impact
# shown in its section title.
# ------------------------------------------------------------------------------
data:
  # Phase 1 — PGN -> binary. Changes rebuild *_positions.bin.
  phase_1_binary:
    min_elo: 2300
    max_games: "max"             # number per PGN, or "max" for full file
    max_moves_per_game: 300
    game_filters:
      enabled: true
      min_fullmove: 10
      min_fullmove_draw: 20
      min_fullmove_resign: 12
      max_elo_gap: 500
      exclude_terminations:
        - "Time forfeit"
        - "Timeout"
        - "Flag"
        - "Abandoned"
        - "Rules infraction"

  # Phase 2 — independent train/validation game split.
  phase_2_split:
    train_split: 0.85

  # Phase 3 — positions selected from each game. Main coverage/diversity knob.
  phase_3_positions:
    positions_per_game:
      enabled: true
      selection_mode: "smart"    # smart | even
      max_total: 40
      min_distance: 4
      opening_pct: 20
      middlegame_pct: 45
      endgame_pct: 35
      rare_or_eventful_pct: 0

  # Phase 4 — final-state dedup. Binary retains full games for history.
  phase_4_deduplication:
    sample_dedup:
      enabled: true
      mode: "fen"
      include_turn: true
      include_history: true
      max_count: 1

  # Phase 5 — training candidate pool. Rebuilds final index and soft cache.
  phase_5_training_pool:
    target_positions: 20000000
    target_selection:
      mode: "count_aware"        # even | count_aware
      train_pool_multiplier: 3.0 # cache more train rows than one epoch
      broad_fraction: 0.30       # candidate-pool coverage
      soft_candidate_selection:
        enabled: true            # extra train-only candidate keys
        min_distance: 2          # coverage only; does not change target probabilities
        max_total: 40

  # Phase 6 — aggregate raw split knowledge into policy/WDL soft targets.
  phase_6_soft_targets:
    soft_targets:
      enabled: true
      source: "raw_split"
      mode: "fen_no_counters"
      include_turn: true
      include_history: false

      # Store and use the target-mover's Elo; the gain is capped deliberately.
      policy_rating_weight:
        enabled: true
        min_elo: 2300
        reference_elo: 2800
        max_multiplier: 1.35
        apply_to_value: true     # use the same evidence quality for WDL aggregation


  # Phase 7 — fixed per-epoch draw from the cached pool. No cache rebuild.
  phase_7_epoch_sampling:
    train_sampling:
      enabled: true
      # Every informative soft row appears once per epoch; all remaining rows
      # are broad, non-soft coverage.
      soft_max_fraction: 0.28
      min_soft_moves: 2
      min_soft_entropy: 0.12     # skip technically multi-move but near-hard targets

  # Runtime affects preprocessing speed only, never data/cache semantics.
  runtime:
    preprocess_threads: all     # ALL logical CPU workers; ~4 balanced shards per worker
    soft_target_workers: auto
    soft_target_chunk_size: auto


# ------------------------------------------------------------------------------
# MODEL ARCHITECTURE
# ------------------------------------------------------------------------------
model:
  # Model version identifier
  version: "v9.9b"
  # Base architecture
  num_residual_blocks: 8        # Number of residual blocks (6-12 optimal)
  filters: 128                  # Convolutional filters (128-256 for RTX 5060 Ti)

  # Policy head: Conv 3x3 C->96 + BN/ReLU + Conv 1x1 -> 73 planes,
  # then fixed LC0-style gather to ACTION_SIZE=1858.
  policy_head_channels: 96      # Policy head intermediate filters
  value_head_filters: 16        # Spatial value conv filters before flatten
  value_hidden_dim: 384         # Value head hidden dimension
  moves_left_hidden_dim: 128    # Small global-mean MLP for moves-left head
  dropout: 0.08                 # Value-head dropout

  history_positions: 4       # Number of past positions to include (0 = current only, current + 4 history)

  # Advanced features
  use_se_blocks: true           # Squeeze-and-Excitation channel attention
  use_se_bottleneck: true       # Use FC bottleneck in SE block (recommended)
  se_reduction: 4               # Used when bottleneck=true (4=mid=32, 8=mid=16, 16=mid=8)
  drop_path_rate: 0.05          # Stochastic Depth
  use_coord_conv: true          # Position-aware conv

  # Advanced architectural features
  use_layer_scale: true         # LayerScale for better training stability
  layer_scale_init: 1e-5        # Initial LayerScale value (1e-6 to 1e-4)



# ------------------------------------------------------------------------------
# SHARED AUTO-TUNE (IL + RL)
# ------------------------------------------------------------------------------
auto_tune:
  # Scope/cache
  use_for_rl: false                  # IL auto-tune is enabled by default; RL should not reuse IL-sized batches
  cache_path: "logs/il_auto_tune_cache.yaml"

  # Batch search
  dedicated_vram_utilization: 0.90
  max_batch_size: 24576
  batch_round_to: 256
  batch_selection: throughput
  throughput_candidate_count: 7
  throughput_tolerance: 0.03

  # LR range test
  lr_test_min: 0.0002
  lr_test_max: 0.005
  lr_test_points: 10
  lr_test_steps: 20

  # Final LR clamp
  lr_min: 0.0002
  lr_max: 0.005


# ------------------------------------------------------------------------------
# IMITATION LEARNING (IL)
# ------------------------------------------------------------------------------
imitation_learning:
  # Core training
  epochs: 50
  batch_size: 8192              # fallback; auto-tune may override
  learning_rate: 0.001          # fallback/base LR
  weight_decay: 0.002

  # LR schedule
  min_lr_ratio: 0.005
  lr_plateau_decay: true
  lr_plateau_patience: auto     # auto = ~60% of max_patience, clamped below early stop
  lr_plateau_factor: 0.7
  lr_plateau_min_scale: 0.35
  lr_plateau_cooldown: 1
  lr_plateau_reset_patience: true

  # Losses
  policy_loss_weight: 1.0
  value_loss_weight: 1.0
  value_scalar_aux_loss_weight: 0.20
  moves_left_loss_weight: 0.05
  wdl_label_smoothing: 0.01

  # Horizontal file symmetry without rebuilding data. Positions whose visible
  # history still has castling rights are skipped because castling is asymmetric.
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5

  # Checkpoint selection
  early_stop_monitor: value_aware # total | value_aware
  max_patience: 5
  min_delta: 0.0015

  # SWA
  use_swa: true
  swa_auto_min_epoch: 36
  swa_anneal_epochs: 5
  swa_min_updates_before_stop: 8
  swa_lr_ratio: 0.08
  swa_lr_max: 0.00012
  swa_bn_refresh_max_batches: 512

# ------------------------------------------------------------------------------
# REINFORCEMENT LEARNING (RL)
# ------------------------------------------------------------------------------
reinforcement_learning:
  # Main run size.
  run:
    version: "rl40"
    iterations: 60
    games_per_iteration: 1000

  # Game generation. Runtime mechanics use tested internal defaults.
  self_play:
    device: "cuda"                 # cpu | cuda | auto
    workers: auto
    worker_auto_multiplier: 1.50       # 12 logical CPUs -> 18 workers; overlaps synchronous NN waits with tree work.
    max_batch_games_per_worker: 30
    max_moves: 190
    # Revisit difficult replay states as complete games. FEN is decoded once at
    # game start; search stays entirely on native bulletchess boards.
    hard_start_fraction: 0.18
    hard_start_min_age: 1

    opening_diversity_fraction: 0.60
    opening_diversity_min_plies: 2
    opening_diversity_max_plies: 8

    # Lc0-style default for guarded-actor games: both colours use one tree and
    # the selected child subtree becomes the next root. Different networks keep
    # separate trees so values/priors are never mixed across model versions.
    share_trees: true

    # Guarded actor self-play: one safe actor plays both colours. The learner,
    # promoted best and immutable IL anchor are compared only by evaluation.

    syzygy_paths:
      - "data/syzygy"

  # Full Gumbel AlphaZero search with Sequential Halving at the root and
  # completed-Q policy improvement below it.
  search:
    simulations: 192
    # Assign the complete budget before Sequential Halving. `simulations` is
    # the exact group average. Difficulty combines prior ambiguity/entropy,
    # branching and value uncertainty. PCR sends the easiest quota to 16 sims;
    # full searches use a smooth 16-sim grid in the strict 64-320 range.
    dynamic_budget_enabled: true
    dynamic_budget_min: 64
    dynamic_budget_max_multiplier: 1.6666667
    # KataGo-style PCR: only full searches teach policy; cheap searches still
    # finish games and provide final-outcome value targets. Full-search quota is
    # chosen by difficulty, not randomly, so hard positions receive the search.
    playout_cap_enabled: true
    playout_cap_full_search_fraction: 0.70
    playout_cap_fast_simulations: 16
    gumbel_max_considered_actions: 16
    gumbel_scale: 1.0              # self-play exploration
    gumbel_eval_scale: 0.0         # deterministic perfect-information eval
    # Earlier Q influence is valuable with the compensated dynamic budget:
    # paired ablations beat c_visit=50 at 64/192 sims and tied it at 320 sims.
    gumbel_c_visit: 100.0
    gumbel_c_scale: 0.10
    # Do not stretch tiny, noisy sibling-Q differences to the full [0, 1]
    # interval. The current value head is strongly under-dispersed in openings.
    gumbel_q_range_floor: 0.25
    gumbel_use_mixed_value: true
    # Search keeps its full completed-Q strength, while the stored policy target
    # remains broad enough for the raw NN to absorb more than one plausible move.
    gumbel_target_temperature: 1.20
    temperature: 0.0               # Gumbel winner, not visit sampling
    temperature_threshold: 0

  # Optimizer and the few regularizers worth tuning between runs.
  training:
    train_batch_size_min: 1024
    train_batch_size_max: 6144
    # Four-generation rolling-replay A/B (1,000 self-play + 256 holdout games):
    # three passes beat one by 59.4% raw NN and 57.3% MCTS. Four passes kept
    # lowering supervised loss but raw NN fell back to 50%, so three is the
    # measured quality/overfit boundary rather than simply using the maximum.
    train_epochs_per_iteration: 3

    learning_rate: 0.00002
    weight_decay: 0.002
    # One AdamW LR for the shared tower and every head. Task balance is defined
    # only by the explicit losses below, so resume/new runs use the same contract.
    # The measured pre-clip norm in rl33 stayed around 0.76-0.98, so 0.5
    # attenuated every optimizer step to only 51-66% of its intended size.
    # Keep clipping as a spike guard instead of making it the normal update.
    grad_clip: 1.0

    warmup_pct: 0.05              # 2/40 iterations: pretrained IL + conservative 2e-5 LR do not need a six-iteration ramp.
    min_lr_ratio: 0.35
    augment_prob: 0.50             # Applied only where horizontal symmetry is exact

  # Uniform FIFO replay. Keep a little more unique game coverage, but shorten
  # the horizon so RAM/training volume stays close to the previous 5 x 63% setup.
  replay:
    # 3.2 x 1000 games ~= the old 4.5 x 700 game horizon and RAM footprint.
    buffer_multiplier: 3.2
    # Keep the complete temperature-softened Gumbel distribution. 218 is the
    # chess maximum legal-move count, so no rare high-branching position loses
    # low-probability target mass in replay.
    max_policy_targets: 218
    cap_fraction_decisive: 0.70
    cap_fraction_draw: 0.65
    cap_min_positions: 24
    cap_max_positions: 120
    # Keep a small pinned reservoir from the accepted champion generation.
    # When capped, half is reserved for useful higher-Q search corrections and
    # the remainder stays uniform for phase/position diversity.
    champion_fraction: 0.15
    # A promotion selectively refreshes difficult/old policy and root-Q targets.
    reanalyse_after_promotion_enabled: true
    reanalyse_fraction: 0.03
    reanalyse_max_positions: 1500
    reanalyse_min_age: 1
    reanalyse_simulations: 256
    reanalyse_batch_positions: 16
    reanalyse_policy_mix: 0.65

  # Model comparison and promotion. Technical worker/opening settings are fixed.
  evaluation:
    eval_every: 2
    eval_workers: auto
    eval_batch_games: 32
    # Use the same 192-simulation contract in self-play, promotion and anchor
    # evaluation. Funnel stages add disjoint paired openings cumulatively.
    eval_mcts_simulations_multiplier: 1.0
    # Deterministic Gumbel eval: uncertain roots keep all 192 simulations.
    # Only roots with a clearly concentrated NN prior are trimmed, in small
    # 16-simulation steps, to no less than 160/192 of the normal budget.
    eval_mcts_dynamic_budget_enabled: true
    eval_mcts_dynamic_budget_min_fraction: 0.8333333
    eval_mcts_dynamic_budget_difficulty_threshold: 0.75
    eval_mcts_dynamic_budget_chunk: 16
    eval_max_moves: 320
    # Raw policy is cheap to test. 96 paired games makes the actor collapse
    # guard materially less noisy for only a small fraction of iteration time.
    eval_no_mcts_games: 96

    # Weak learners stop early, while a plausible actor/promotion candidate is
    # decided on 208 paired games in total. At a 55% score the one-sided 90%
    # margin is then about 4.4 pp instead of 5.3 pp for the old 144 games.
    eval_funnel_preliminary_games: 48
    eval_funnel_preliminary_score_rate: 0.45
    eval_funnel_medium_games: 64
    eval_funnel_medium_score_rate: 0.50
    eval_funnel_advanced_games: 96
    eval_funnel_later_simulations_multiplier: 1.0

    score_rate_threshold: 0.55
    true_win_rate_threshold: 0.02
    # Start with 96 and extend an inconclusive promotion candidate sequentially
    # to at most 256 games. Obvious wins/losses do not pay the full cost.
    anchor_eval_games: 96
    # One-sided non-inferiority guard. The point score still has to reach 50%,
    # and its z=1.28 lower bound may be at most 3 pp below parity.
    promotion_anchor_score_lower_bound_min: 0.47
    # Search may not hide a raw-policy regression against the immutable IL
    # anchor. Borderline results extend cheaply from 96 -> 256 -> 512 games.
    promotion_anchor_no_mcts_gate_enabled: true
    promotion_anchor_no_mcts_score_rate_min: 0.50
    promotion_anchor_no_mcts_score_lower_bound_min: 0.47
    anchor_no_mcts_max_games: 512

  # Elo reporting after promotions and at shutdown.
  stockfish_elo:
    # Reporting only. Stockfish never generates replay, targets or opponents.
    # Promotion-time raw NN Elo is automatic. Search Elo may also run during
    # training, but only for a newly promoted best and never twice inside ten
    # iterations. The same result is reused at shutdown when weights match.
    promoted_use_mcts: true
    promoted_mcts_min_iteration_gap: 10
    final_enabled: true
    final_use_mcts: true

  # Training objective. Policy CE and WDL value CE are the two equal primary
  # tasks. Remaining terms are dimensionally different auxiliary regularizers;
  # their coefficients scale those penalties, not separate optimizer speeds.
  losses:
    policy: 1.0
    value: 1.00
    value_scalar_aux: 0.25
    moves_left: 0.05
    # Distil the best Q found by MCTS into a separate local-search head. Its
    # predicted absolute error gates a conservative contribution to MCTS leaf
    # value; final WDL remains trained only from the real game outcome.
    search_q: 0.20
    search_error: 0.05
    search_value_blend_max: 0.25
    search_value_uncertainty_temperature: 0.35
    # Reduce final-outcome supervision before a later exploratory blunder, while
    # emphasizing only reliable policy corrections found by a complete search.
    deblunder_threshold: 0.15
    deblunder_width: 0.10
    deblunder_value_min_weight: 0.35
    deblunder_policy_boost_max: 1.35
    # Focus value learning on the largest current error against the final game
    # outcome. Up to the hardest 25% of each batch receive at most 1.5x relative
    # weight. The separate search-Q head keeps independent visit-based weights.
    value_error_focus_fraction: 0.25
    value_error_focus_max_multiplier: 1.50
    wdl_label_smoothing: 0.010

# ------------------------------------------------------------------------------
# HARDWARE & OPTIMIZATION
# ------------------------------------------------------------------------------
hardware:
  # Device + precision
  device: "cuda"
  use_amp: true
  use_bfloat16: true
  use_compile: true

  # DataLoader throughput
  num_workers: 4
  train_prefetch_factor: 1
  cuda_train_prefetch_queue_size: 2
  cuda_eval_prefetch_queue_size: 1
  dataloader_worker_restart_limit: 2
  dataloader_worker_failure_tail_tolerance_batches: 2
  dataloader_board_dtype: "float16"
  dataloader_return_numpy: true
  dataloader_block_shuffle: true
  dataloader_block_shuffle_size: 65536
  dataloader_train_in_order: false
  dataloader_val_in_order: false


# ------------------------------------------------------------------------------
# SHARED CENTRAL GPU INFERENCE
# ------------------------------------------------------------------------------
central_inference:
  enabled: true
  servers: auto                  # Auto = one central server per available GPU; never split one GPU into competing server processes.
  auto_min_servers: 1
  auto_workers_per_server: 9
  auto_max_servers: 3
  max_batch_size: 384             # Measured 173.1 pos/s vs 171.5 at 448 and 167.6 at 512; also a hard GPU-forward cap.
  flush_ms: 0.5                  # RTX 5060 Ti controlled A/B: larger per-model batches, ~2.4x server throughput and lower remote wait.
  transport_dtype: "float16"
  # Workers write FP16 inputs and compact outputs into private fixed slots.
  # Queues carry only tiny descriptors, never the large NumPy payloads.
  shared_memory_enabled: true
  shared_memory_slots_per_worker: 2
  shared_memory_slot_batch_size: 192
  # Exact input+history cache, cleared whenever any loaded model changes.
  cache_enabled: true
  cache_max_entries: 50000
  pinned_staging_enabled: false      # RTX 5060 Ti A/B: extra shared->pinned copy was slower for current MCTS batches.
  use_bfloat16: false          # RTX 5060 Ti benchmark: FP16 central forward was ~9% faster; training still uses global BF16.
  timeout_s: 0
  stall_warning_s: 15
  load_timeout_s: 300
  use_compile: true
  compile_warmup_batches: [1, 32, 128, 256, 384]
  cudnn_benchmark: false
  sync_timing: false


# ------------------------------------------------------------------------------
# PLAY / GUI MATCH RUNTIME
# ------------------------------------------------------------------------------
play:
  # AI-vs-AI uses the same batched evaluator and central GPU server as RL eval.
  match_workers: auto
  match_batch_games: auto
  match_max_moves: 220


# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging:
  log_level: "INFO"          # DEBUG, INFO, WARNING, ERROR
  tensorboard: true          # Enable TensorBoard logging
  print_every: 10            # Print stats every N batches
  il_plot_smoothing_enabled: true # Light EMA smoothing for IL PNG curves; exact best/SWA markers stay raw
  il_plot_smoothing_alpha: 0.65   # Higher = follows raw curve more closely, lower = smoother
  il_plot_smoothing_min_points: 5 # Do not smooth very short runs


# ------------------------------------------------------------------------------
# ELO ESTIMATION
# ------------------------------------------------------------------------------
elo_estimation:
  # Shared Stockfish match
  enabled: true
  stockfish_path: "stockfish"
  levels: [1320, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2600, 2800]
  stockfish_time_limit: 0.10
  max_moves: 150
  stockfish_threads: 1
  stockfish_hash_mb: 32

  # Runtime scheduling
  prioritize_training: true
  reserve_dataloader_workers: true
  stockfish_priority: "below_normal"

  # Adaptive ladder
  # Even counts keep every opening/color pair complete. A stored Elo seeds the
  # first probe near the useful band instead of spending games on all extremes.
  adaptive_probe_games_per_level: 4
  adaptive_min_batch_games: 24   # Probe in waves; do not pre-schedule the full ladder
  adaptive_focus_games_per_level: 20
  adaptive_extra_games_per_level: 4
  adaptive_target_focus_levels: 3
  adaptive_max_total_games: 120
  adaptive_target_standard_error: 45.0
  adaptive_min_games_for_se_stop: 64

  # Deterministic short opening suite, always evaluated with swapped colors.
  # This reduces first-move/color variance without turning the test into an
  # opening-book benchmark.
  paired_openings_enabled: true
  paired_openings_max_plies: 6

  # NN eval: shared by IL periodic checks and RL raw-network checks
  nn_eval_workers: 4             # Local benchmark sweet spot; 6-12 contend on tiny NN forwards
  nn_eval_free_threads_utilization: 0.35
  # Raw NN is cheap, but probing the entire ladder only adds noisy 4-6 game
  # outliers. Start near the checkpoint rating and spend games on the three
  # selected rating levels instead.
  nn_eval_adaptive_probe_games_per_level: 4
  nn_eval_adaptive_min_batch_games: 24
  nn_eval_adaptive_focus_games_per_level: 20
  nn_eval_adaptive_extra_games_per_level: 4
  nn_eval_adaptive_max_total_games: 120
  nn_eval_adaptive_target_standard_error: 50.0
  nn_eval_adaptive_min_games_for_se_stop: 48

  # MCTS eval: shared final/search-strength check
  mcts_eval_workers: 12
  mcts_eval_simulations: 192

  # IL scheduling
  il_eval_every: 2
  il_async_process_restart_limit: 2
  final_on_il_shutdown: true

  # Model move generation
  batch_model_moves: true
  batch_raw_model_moves: false
  # MCTS central batching for eval_elo.py and final IL/RL Elo checks
  eval_elo_central_inference_enabled: true
  eval_elo_central_inference_servers: 1
  eval_elo_central_inference_max_batch_size: 64
  eval_elo_central_inference_use_compile: true
  eval_elo_central_inference_compile_warmup_batches: [1, 8, 16]
  eval_elo_central_client_groups: 1 # One larger MCTS batch beats multiple tiny Python clients
  eval_elo_central_games_per_worker_chunk: 6
  eval_elo_central_target_chunks_per_group: 2
  eval_elo_central_max_chunk_games: 36

# ------------------------------------------------------------------------------
# 🆕 DEBUG & PROFILING
# ------------------------------------------------------------------------------
debug:
  enabled: false                   # Master switch for verbose diagnostics

  # Imitation Learning diagnostics
  il:
    profile_training: false         # Full CUDA-sync timing is expensive; false profiles only first phase epoch
    print_profile_to_console: false # Keep epoch timing tables in logs/debug only
    log_gpu_memory: false           # GPU memory logging is diagnostic, not needed in the hot training loop
    print_batch0_diagnostics: false # Print batch-0 target stats + WDL samples
    print_wdl_loss_diagnostics: false # Print one-time WDL class distribution from loss

  # Reinforcement Learning diagnostics
  rl:
    profile_training: false         # Iteration/self-play/train/eval timing breakdown
    profile_mcts_detail: false      # Enable only for diagnostics: per-leaf CPU timers slow self-play.
    profile_mcts_sample_rate: 64    # Low-overhead sampled tensor timing still feeds aggregate diagnostics.
    log_gpu_memory: false           # GPU memory usage around RL iterations
    central_inference:
      verbose: false                # Per-request/heartbeat logs; summaries still go to console, RL.csv and PNG
      stall_warning_s: 15           # When verbose=true, print if a worker waits this long for central inference


# ------------------------------------------------------------------------------
# REPRODUCIBILITY
# ------------------------------------------------------------------------------
seed: 42                     # Random seed

