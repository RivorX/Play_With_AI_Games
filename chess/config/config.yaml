# ==============================================================================
# CHESS AI CONFIGURATION - OPTIMIZED FOR RTX 5060Ti 16GB
# ==============================================================================

# ------------------------------------------------------------------------------
# FILE PATHS (relative to chess/ project root)
# ------------------------------------------------------------------------------
paths:
  data_dir: "data"
  models_dir: "models"
  logs_dir: "logs"

  # Best models (single file, overwritten when improved)
  best_model_il: "models/best_model_il.pt"
  best_model_rl: "models/best_model_rl.pt"

  # Checkpoint directories (saved every N epochs/iterations)
  il_checkpoints_dir: "models/IL"
  rl_checkpoints_dir: "models/RL"


# ------------------------------------------------------------------------------
# DATA
# ------------------------------------------------------------------------------
data:
  # --------------------------------------------------------------------------
  # 1) PGN -> BINARY DATA (requires preprocessing rebuild)
  # --------------------------------------------------------------------------
  min_elo: 2300              # Minimum Elo rating for games
  max_games: "max"           # Number of games per PGN, or "max" to use the entire file
  max_moves_per_game: 300    # Skip only extreme/corrupt games; normal long games are sampled by positions_per_game

  # Game-level quality filters (headers + length)
  game_filters:
    enabled: true
    min_fullmove: 10              # Minimum fullmoves for any decisive game
    min_fullmove_draw: 20         # Stronger filter for short draws
    min_fullmove_resign: 12       # Early resignations
    max_elo_gap: 500              # Keep useful strong-vs-strong games with moderate Elo gaps
    exclude_terminations:
      - "Time forfeit"
      - "Timeout"
      - "Flag"
      - "Abandoned"
      - "Rules infraction"

  # --------------------------------------------------------------------------
  # 2) IL SAMPLE CACHE (fast to rebuild before training)
  # --------------------------------------------------------------------------
  train_split: 0.85          # Train/validation split ratio for index selection only

  # Quick knob for making IL smaller/larger without rebuilding the binary.
  positions_per_game:
    enabled: true
    selection_mode: "smart"          # smart = scored positions with spacing; even = old evenly-spaced selector
    max_total: 40                 # Max sampled plies per game
    min_distance: 4               # Minimum ply distance between selected positions in one game
    auto_expand_max_total_before_distance: 50 # Raise max_total up to this before relaxing min_distance
    auto_relax_min_distance_for_target: true  # If target still cannot fit, relax min_distance from 4 to 3
    workers: auto                 # Parallel selector workers (auto = CPU threads - 1)
    chunk_size: 2048              # Games per selector task; larger = less overhead, smaller = smoother progress
    opening_pct: 20               # Percent of max_total from early-game positions
    middlegame_pct: 45            # Percent of max_total from middlegame positions
    endgame_pct: 35               # Percent of max_total from late-game positions
    rare_or_eventful_pct: 0       # Percent reserved for rare/eventful positions; scans full records when > 0

  # IL target after all filters/dedup. The startup prompt writes an integer here.
  # Use "max" only when you explicitly want all available selected positions.
  target_positions: 20000000

  # Training-time sampler over the final deduped rows. This changes how often a
  # selected row appears in training, not the validation set or cached targets.
  train_sampling:
    enabled: true
    mode: "policy_weighted"       # shuffle | policy_weighted
    source: "sample_weight"       # sample_weight | occurrence_count
    weight_power: 0.5             # Mild oversampling; loss still uses full sample_weight
    min_weight: 0.05
    max_weight: 64
    epoch_size_multiplier: 1.0    # 1.0 = one epoch has len(train_dataset) drawn samples
    opening_floor: 0.0            # Opening boost comes from sample_weight; avoids a huge phase-label scan at startup
    opening_progress_max: 0.25
    endgame_progress_min: 0.75
    phase_chunk_size: 1000000

  # Index-level dedup for IL samples. The binary keeps full games intact for
  # dynamic history and moves-left; only the training index list is capped.
  sample_dedup:
    enabled: true
    mode: "fen"                  # fen keeps pieces + castling + ep + counters; soft policy stores move mix
    include_turn: true           # Include side-to-move in signature
    include_history: true        # Match the model input when history_positions > 0
    max_count: 1                 # Soft targets already aggregate repeated outcomes/moves

  # Empirical soft targets from repeated positions inside each split.
  # No engine needed: policy is a move-frequency distribution, value is WDL frequency.
  soft_targets:
    enabled: true
    workers: auto                 # Parallel aggregation workers (auto = CPU threads - 1)
    chunk_size: 500000            # Source positions per aggregation task
    materialize_workers: auto     # Parallel final-array workers
    materialize_chunk_size: 250000 # Final positions per materialization task
    policy: true
    value: true
    mode: "fen"                  # Do not mix castling, en passant, halfmove/fullmove metadata
    include_turn: true
    include_history: false       # Aggregate policy targets by current board; model input still keeps history
    value_key:
      mode: "fen_no_counters"     # Value aggregates by current board + rule metadata, not full move number
      include_turn: true
      include_history: false      # Policy sees history; value target should generalize across transpositions
    value_wdl_shrinkage_alpha: 1.0 # Blend low-count WDL targets toward split prior; lower = stronger value signal
    value_sample_weight:
      enabled: true
      confidence_min: 0.60        # Singletons still teach value, repeated positions are trusted more
      confidence_k: 3.0
      progress_min: 0.25          # Opening outcome labels are noisy; endgame labels are cleaner
      progress_power: 1.5
      max: 1.0
    max_policy_moves: 32         # Sparse top-K cap; 16 can drop useful opening move mass
    policy_mass_threshold: 0.995 # Stop before max_policy_moves once this mass is retained
    sample_weight:
      enabled: true
      mode: "sqrt_count"         # occurrence_count | sqrt_count | log_count | none
      max: 32                    # Normal cap for repeated positions
      opening_progress_max: 0.25 # Opening samples are aggregated hard; restore some policy mass by weight
      opening_boost_min_count: 2 # Only boost positions that actually aggregate multiple games
      opening_multiplier: 2.0
      opening_max: 64            # Opening-specific cap; value weighting remains separately conservative

  # --------------------------------------------------------------------------
  # 3) PREPROCESSING SPEED ONLY (does not change data)
  # --------------------------------------------------------------------------
  files_at_once: 1            # PGN files per batch (1=seq, 2-4=batch)
  phase1_threads: all         # PGN parse workers (1=off, all=cpu)
  phase2_threads: all         # Position workers (1=off, all=cpu)
  phase2_chunk_size: 512      # Games per Phase 2 task; lowers Windows ProcessPool overhead


# ------------------------------------------------------------------------------
# MODEL ARCHITECTURE
# ------------------------------------------------------------------------------
model:
  # Model version identifier
  version: "v9.4"
  # Base architecture
  num_residual_blocks: 8        # Number of residual blocks (6-12 optimal)
  filters: 128                  # Convolutional filters (128-256 for RTX 5060 Ti)

  # Policy head: Conv 3x3 C->96 + BN/ReLU + Conv 1x1 -> 73 planes,
  # then fixed LC0-style gather to ACTION_SIZE=1858.
  policy_head_channels: 96      # Policy head intermediate filters
  value_head_filters: 16        # Spatial value conv filters before flatten
  value_hidden_dim: 384         # Value head hidden dimension
  moves_left_hidden_dim: 128    # Small global-mean MLP for moves-left head
  dropout: 0.08                 # Value-head dropout

  history_positions: 4       # Number of past positions to include (0 = current only, current + 4 history)

  # Advanced features
  use_se_blocks: true           # Squeeze-and-Excitation channel attention
  use_se_bottleneck: true       # Use FC bottleneck in SE block (recommended)
  se_reduction: 4               # Used when bottleneck=true (4=mid=32, 8=mid=16, 16=mid=8)
  drop_path_rate: 0.05          # Stochastic Depth
  use_coord_conv: true          # Position-aware conv

  # Advanced architectural features
  use_layer_scale: true         # LayerScale for better training stability
  layer_scale_init: 1e-5        # Initial LayerScale value (1e-6 to 1e-4)



# ------------------------------------------------------------------------------
# SHARED AUTO-TUNE (IL + RL)
# ------------------------------------------------------------------------------
auto_tune:
  use_for_il: true                   # IL may run probing + cache writes (when IL mode=auto)
  use_for_rl: false                  # RL should not reuse IL cache; huge IL-sized batches were starving RL of update steps
  cache_path: "logs/il_auto_tune_cache.yaml"
  dedicated_vram_utilization: 0.90 # Push IL harder; auto-tune still backs off on OOM
  min_batch_size: 64
  max_batch_size: 24576
  batch_round_to: 256
  batch_selection: throughput # Pick the fastest probed batch, not the smallest near-peak batch
  throughput_candidate_count: 7
  throughput_tolerance: 0.03  # Only relevant for balanced fallback; throughput mode uses the best candidate
  lr_test_enabled: true
  lr_test_min: 0.0002
  lr_test_max: 0.005
  lr_test_points: 10
  lr_test_steps: 20
  lr_test_early_stop_patience: 3   # Stop LR scan after N clearly worse candidates in a row
  lr_test_early_stop_min_candidates: 4
  lr_test_early_stop_score_margin: 0.0002
  lr_min: 0.0002
  lr_max: 0.005


# ------------------------------------------------------------------------------
# IMITATION LEARNING (IL)
# ------------------------------------------------------------------------------
imitation_learning:
  # Checkpoint content
  save_optimizer_state: true  # Save optimizer state in IL checkpoints for true resume

  # Training hyperparameters (used directly in config mode, and as fallback defaults)
  batch_size: 8192           # Fallback batch size; auto-tune may raise up to auto_tune.max_batch_size
  eval_batch_size: 0         # 0 = derive from train batch using eval_batch_size_multiplier
  eval_batch_size_multiplier: 1.0 # Keep eval batch same as train; larger eval batches spike CUDA cache/VRAM
  learning_rate: 0.001       # Base/fallback LR (used for config mode and LR-test fallback)

  # Advanced training hyperparameters
  value_head_lr_factor: 1.0  # Value head LR multiplier; value needs extra adaptation for MCTS usefulness
  epochs: 50                 # Maximum training epochs
  weight_decay: 0.002        # L2 regularization (10x stronger for value head)
  grad_clip: 1.0             # Gradient clipping threshold

  # Stochastic Weight Averaging (SWA) for better generalization
  use_swa: true              # Enable SWA (averages weights from multiple epochs)
  swa_auto_start: true       # Auto-start SWA from validation plateau instead of a fixed early epoch
  swa_auto_min_epoch: 18     # Never start SWA before this epoch in new/resume training
  swa_auto_plateau_patience: 3 # Start after N evals without meaningful val-loss improvement
  swa_auto_min_delta: 0.0015 # Meaningful val-loss improvement threshold for SWA plateau detection
  swa_transfer_unfreeze_offset: 2  # In transfer mode: start SWA N epoch(s) after first fully unfrozen epoch
  swa_anneal_epochs: 12      # Number of epochs SWALR uses to anneal from current LR to swa_lr
  swa_stop_after_anneal_no_improve: true # Once SWA LR anneal is done, stop on the first eval without meaningful improvement
  swa_stop_after_anneal_grace_evals: 3 # Number of post-anneal no-improve evals allowed before stopping
  swa_lr_mode: "auto"        # auto | manual
  swa_lr: 0.00005            # Used only when swa_lr_mode=manual
  swa_lr_ratio: 0.12         # Auto mode: target fraction of effective LR around SWA start
  swa_lr_min: 0.00003        # Auto mode lower clamp
  swa_lr_max: 0.00020        # Auto mode upper clamp

  # Advanced training features
  policy_label_smoothing: 0.03 # v9.4 ablation: soften sparse IL policy targets without changing sampler
  warmup_pct: 0.05           # Warmup fraction of epochs (e.g., 0.02-0.05)
  min_lr_ratio: 0.005        # Min LR = base_lr * ratio

  # WDL-specific options
  wdl_label_smoothing: 0.01  # Smoothing for value head (WDL is more sensitive to overconfidence)
  # Loss weights
  policy_loss_weight: 1.0    # Policy loss weight
  value_loss_weight: 1.0     # Keep value competitive with policy; MCTS needs calibrated WDL
  value_scalar_aux_loss_weight: 0.20 # SmoothL1 on W-L scalar so value improves beyond soft WDL CE
  moves_left_loss_weight: 0.05 # Auxiliary SmoothL1 on log1p(remaining plies)
  train_metrics_interval: 16 # Compute expensive train top-k/softmax metrics every N batches
  eval_metrics_interval: 32  # Validation loss stays full; expensive val Top-K/phase metrics are sampled

  # Evaluation
  eval_every: 1              # Evaluate every N epochs

  # Early stopping
  max_patience: 5            # Stop if no meaningful monitor improvement for N epochs
  min_delta: 0.0015          # Minimum improvement threshold
  early_stop_monitor: value_aware # total or value_aware
  early_stop_value_loss_weight: 1.25 # Used only by value_aware monitor
  early_stop_moves_left_loss_weight: 0.03 # Keep MLH from dominating checkpoint selection

# ------------------------------------------------------------------------------
# REINFORCEMENT LEARNING (RL)
# ------------------------------------------------------------------------------
reinforcement_learning:
  # ---------------------------
  # Core RL Loop
  # ---------------------------
  version: "rl27"                # RL run/version tag added to RL log filenames
  iterations: 40                # Total RL iterations
  games_per_iteration: 250      # Update the learner more often so one drifting self-play generation cannot dominate replay

  # ---------------------------
  # Self-Play Runtime
  # ---------------------------
  self_play_device: "cuda"      # cpu | cuda | auto (auto uses GPU if available)
  self_play_workers: auto       # Auto = ceil(available CPU threads * self_play_worker_auto_multiplier)
  self_play_worker_auto_multiplier: 1.10 # 12 CPU threads -> 13 self-play workers; enough batching without hardcoding one machine
  self_play_worker_cap_multiplier: 1.7 # Safety cap for explicit/auto workers when central inference lets workers block on GPU
  self_play_torch_threads: 1    # Keep 1 thread per worker; Python MCTS already fans out across many processes
  self_play_history_fp16: true  # Store active game history in fp16 inside workers; replay tensors are still emitted as fp32/fp16 by replay_fp16
  self_play_central_inference_enabled: true   # Use one GPU inference server for persistent self-play workers; workers keep MCTS trees on CPU
  self_play_central_inference_servers: auto # auto = shard workers across a safe number of GPU inference servers
  self_play_central_inference_auto_min_servers: 2 # Fewer GPU server processes reduce context switching on one GPU
  self_play_central_inference_auto_workers_per_server: 9 # Auto workers are sharded into a small number of larger CIL servers
  self_play_central_inference_auto_max_servers: 2 # Keep self-play on two CIL processes unless explicitly retuned
  self_play_central_inference_use_compile: true # Compile the single central GPU model; warmup happens before workers start
  self_play_central_inference_compile_warmup_batches: [1, 32, 128, 256] # Pre-warm common dynamic batch sizes outside self-play
  self_play_central_inference_flush_ms: 2.0   # Small coalescing window; two servers reduce queueing while preserving useful batch sizes
  self_play_central_inference_max_batch_size: 256 # Larger per-server batches improve GPU efficiency with sharded CIL
  self_play_central_inference_transport_dtype: "float16" # Halve IPC payloads; board planes are binary/small and CUDA inference runs under AMP
  self_play_central_inference_cache_enabled: false # Raw position hashing is usually slower than useful during self-play
  self_play_compile_lock_timeout_s: 900  # Max wait for another worker to finish compile/cache warmup before falling back

  self_play_save_every_games: 1  # Multiplier of games_per_iteration (0=off); progress still updates per finished game

  # ---------------------------
  # Self-Play Game Flow
  # ---------------------------
  use_batch_selfplay: true         # Play multiple games simultaneously (5-10x faster)
  max_batch_games_per_worker: 30     # Keep total active games/RAM near 16x20 while giving CPU more worker processes
  self_play_dispatch_chunk_games: 96 # Requested chunk cap; runtime caps it by games/worker so large chunks do not starve workers
  self_play_max_moves: 190          # Hard cap in plies; keep speed while draw claims below decide only clearly claimable games
  self_play_auto_claim_draw: true   # Allow manual draw claims from python-chess instead of waiting only for automatic terminal detection
  self_play_claim_repetition_after_moves: 64  # Plies before claiming repetition; avoid ending useful middlegame cycles too early
  self_play_claim_draw_after_moves: 120 # Plies before generic claimable draws; lets more value targets resolve naturally
  syzygy_enabled: true                   # Probe local Syzygy tablebases in tiny endgames and finish them without wasting search
  syzygy_paths:
    - "data/syzygy"                      # Relative paths are resolved from chess/ (e.g. chess/data/syzygy)
  syzygy_auto_download_enabled: true     # If local Syzygy WDL files are missing, bootstrap them automatically on RL startup
  self_play_progress_interval_games: 5  # Fewer progress file writes on Windows workers

  # ---------------------------
  # Self-Play Diversity & Opponents
  # ---------------------------
  self_play_opening_diversity_enabled: true   # Start many games from short curated opening prefixes to avoid replaying the same opening shell forever
  self_play_opening_diversity_fraction: 0.60  # More opening variety so short hour-scale runs cover more structures
  self_play_opening_diversity_min_plies: 2    # Let sharp curated lines branch early
  self_play_opening_diversity_max_plies: 8    # Allow enough depth to land in asymmetrical structures
  self_play_opponent_pool_enabled: true       # Mix current-vs-current with frozen opponents instead of only mirror self-play
  self_play_opponent_current_fraction: 0.22   # Keep mirror adaptation, but let frozen best drive most hard targets
  self_play_opponent_best_fraction: 0.72      # Main teacher until current can beat it repeatedly
  self_play_opponent_recent_fraction: 0.03    # Recent snapshots are probes, not primary teachers
  self_play_opponent_anchor_fraction: 0.18    # Keep IL anchor as a guardrail without dragging away from the promoted best
  self_play_recent_snapshots_to_keep: 10       # Keep a wider recent window, then let the smart selector choose the actually useful opponents
  self_play_recent_candidate_pool_size: 2     # Fewer simultaneous frozen recent models reduces MCTS batch fragmentation
  self_play_recent_recency_bias: 0.35         # Prefer fresher snapshots, but still let matchup quality dominate the selection
  self_play_recent_confidence_games: 24       # Avg games needed before a recent snapshot score is treated as high-confidence
  self_play_recent_uncertainty_bonus: 0.15    # Small exploration bonus for newer/under-tested recent snapshots
  self_play_recent_in_band_boost: 1.10        # Slight boost for recent snapshots already inside the preferred score band
  self_play_randomize_learner_color: true     # Let the training model play both colors against frozen opponents
  self_play_opponent_adaptive_enabled: true   # Reweight opponents cautiously inside bounded shares
  self_play_opponent_adaptive_update_every: 1 # Update each iteration, but max_share_delta below prevents abrupt swings
  self_play_opponent_adaptive_min_games: 20   # Ignore tiny matchup samples
  self_play_opponent_adaptive_history_size: 6 # Smooth score estimates over a longer recent window
  self_play_opponent_adaptive_target_score: 0.50 # Prefer opponents that are neither too easy nor too hard
  self_play_opponent_adaptive_band: 0.16      # Use a forgiving band so the scheduler reacts to trends, not one noisy batch
  self_play_opponent_adaptive_min_factor: 0.75 # Do not fully zero out hard/easy opponents
  self_play_opponent_adaptive_max_factor: 1.35 # Let the scheduler lean into useful hard opponents
  self_play_opponent_adaptive_max_share_delta: 0.12 # Max absolute bucket-share move per iteration
  self_play_opponent_current_min_fraction: 0.20 # Mirror self-play remains a real adaptation channel after promotion
  self_play_opponent_current_max_fraction: 0.30 # Avoid learner-vs-learner replay dominating before it beats best
  self_play_opponent_best_min_fraction: 0.50    # Keep the current best as the primary teacher
  self_play_opponent_best_max_fraction: 0.72
  self_play_opponent_anchor_min_fraction: 0.08  # Preserve IL-anchor pressure once unlocked
  self_play_opponent_anchor_max_fraction: 0.20
  self_play_opponent_recent_max_fraction: 0.05  # Recent snapshots stay diagnostic
  self_play_opponent_frozen_max_fraction: 0.80  # Best + anchor + recent may not crowd current mirror-play below 20%
  self_play_post_promotion_transition_iterations: 8 # Ramp anchor pressure slowly so the new best remains the main teacher
  self_play_post_promotion_current_min_fraction: 0.26 # Give the learner room to settle around the promoted checkpoint
  self_play_recent_latest_cap_count: 2          # Treat the newest N recent snapshots as one capped echo-chamber bucket
  self_play_recent_latest_max_fraction: 0.35    # Newest recent snapshots may not exceed this share of all self-play games
  self_play_opponent_min_score: 0.28            # Avoid opponent buckets that are so hard they mostly generate hopeless targets
  self_play_opponent_max_score: 0.72            # Avoid buckets that are so easy they stop challenging the policy
  self_play_opponent_best_min_score: 0.00       # Keep best-opponent channel alive even when it is temporarily hard
  self_play_opponent_anchor_min_score: 0.00     # Keep the IL-anchor channel alive once unlocked; it is a stability reference
  self_play_opponent_recent_min_score: 0.32     # Recent snapshots should usually be in the learnable band
  self_play_opponent_recent_max_score: 0.68     # Also skip recent snapshots that have become too easy
  self_play_opponent_target_draw_rate: 0.35     # Prefer matchups that stay meaningfully decisive instead of settling into draw-heavy shells
  self_play_opponent_draw_band: 0.10            # React sooner once an opponent source starts producing too many draws
  self_play_opponent_draw_penalty_min_factor: 0.45 # Penalize draw-heavy opponent sources more aggressively while still keeping some diversity
  self_play_store_frozen_best_positions: true   # Distill best-model MCTS replies too, not only learner moves from lost games
  self_play_store_frozen_anchor_positions: true # Distill stable IL-anchor search targets after RL-best diverges
  self_play_frozen_opponent_policy_weight: 1.05  # Best replies are high-value MCTS supervision, not just opponent moves
  self_play_frozen_anchor_policy_weight: 0.85    # Anchor stabilizes without overpowering the promoted best

  # ---------------------------
  # Temperature Schedule
  # ---------------------------
  use_temperature_schedule: true      # Enable adaptive temperature
  temperature_start: 0.65             # RL should start more focused; search, not policy noise, should drive improvement
  temperature_end: 0.45               # Keep late self-play from becoming too draw-stable while value is still recalibrating
  temperature_decay_iterations: auto  # Auto: decay spans the full RL run (matches iterations)
  adaptive_temperature_enabled: true  # Small telemetry-driven corrections on top of the base decay schedule
  adaptive_temperature_min: 0.42      # Keep controller close to the intended RL sampling regime
  adaptive_temperature_max: 0.68      # Also avoid over-correcting above the intended search regime
  adaptive_temperature_max_adjustment: 0.045 # Frequent but small corrections; avoid turning temperature into a moving target
  adaptive_temperature_draw_target: 0.30    # Moderate draw rate: enough neutral calibration without sterile self-play
  adaptive_temperature_draw_band: 0.05      # Ignore normal draw-rate noise, react to sustained drift
  adaptive_temperature_decisive_target: 0.70 # Aim for mostly decisive completed games
  adaptive_temperature_decisive_band: 0.07   # Ignore ordinary decisive-rate noise
  adaptive_temperature_min_eval_gain: 0.010  # Treat flat eval as a small sharpening signal
  adaptive_temperature_draw_step: 0.018      # Max temp move from draw pressure before smoothing
  adaptive_temperature_low_draw_step: 0.012  # Re-open exploration gently when games are too decisive
  adaptive_temperature_decisive_step: 0.014  # Small correction from decisive-rate pressure
  adaptive_temperature_eval_step: 0.010      # Eval stagnation should nudge, not dominate
  adaptive_temperature_smoothing: 0.25       # More responsive, while max_adjustment keeps it small
  adaptive_temperature_threshold_step: 1     # Only small threshold movement with adaptive temperature

  # ---------------------------
  # MCTS Search
  # ---------------------------
  # Core search.
  mcts_simulations: 192       # Debug showed deeper search helps this learner; train closer to the 320-sim eval regime
  mcts_batch_size: 192        # Match the 192-sim self-play regime
  mcts_reuse_tree: true      # Reuse tree across moves (faster, better)
  mcts_cache_history_tensors: true # Cache simulated history tensors on tree nodes to reduce repeated board_to_tensor work
  mcts_c_puct_base: 19652    # AZ-style slow growth; keep exploration stable as sims increase
  mcts_c_puct_init: 1.18     # Let a now-stronger policy prior resist noisy value/Q oversteering
  mcts_c_puct_max: 1.85      # Keep enough prior pressure once raw policy starts beating search
  mcts_use_fpu: true         # First Play Urgency baseline for unvisited/low-visit children
  mcts_fpu_reduction: 0.12   # Used only when mcts_fpu_absolute is null
  mcts_fpu_absolute: 0.0     # Neutral unvisited Q; avoids punishing exploration while value is still calibrating

  # Fixed Q steering.
  mcts_q_selection_weight: 0.075 # Q is a tie-breaker while value calibration lags behind raw policy strength
  mcts_q_centered: true      # Use Q as relative sibling preference, not as poorly calibrated absolute value
  mcts_q_min_child_visits: 2 # Require a little real child evidence before Q can redirect visits
  mcts_q_parent_visit_warmup: 36 # Let policy/PUCT compare moves before value challenges a locked prior
  mcts_q_tanh_scale: 0.55    # Smoothly squash value differences without turning most deltas into the same saturated bonus
  mcts_q_max_abs: 0.055      # Cap Q redirects tightly while no-MCTS eval is stronger than MCTS eval
  mcts_q_min_fullmove: 12    # Keep opening and early middlegame mostly policy-led
  mcts_q_full_weight_fullmove: 28 # Ramp Q slowly so value must prove itself before steering search
  mcts_q_eval_gap_dampen_enabled: true # Reduce Q next iteration if MCTS eval underperforms raw policy eval
  mcts_q_eval_gap_dampen_start: -0.03
  mcts_q_eval_gap_dampen_full: -0.12
  mcts_q_eval_gap_min_scale: 0.25

  # Root sampling.
  mcts_temperature: 0.65      # Sharper visit sampling produces better policy targets once the search is strong enough
  mcts_temperature_threshold: 12  # Quicker shift toward deterministic play helps convert advantages instead of drifting
  mcts_dirichlet_alpha: 0.3  # Chess-scale root noise concentration
  mcts_dirichlet_weight: 0.095 # More root exploration so search can challenge the raw prior instead of confirming it

  # Adaptive root noise.
  adaptive_dirichlet_enabled: true       # Adjust root exploration from draw pressure, eval health, and useful MCTS change yield
  adaptive_dirichlet_min_weight: 0.015   # Keep a small amount of root noise for exploration even under heavy draw pressure
  adaptive_dirichlet_max_weight: 0.110   # Low change yield may raise root noise only mildly
  adaptive_dirichlet_draw_scale: 0.65    # Cut root noise harder when completed draw rate drifts above target
  adaptive_dirichlet_eval_scale: 0.85    # Also tighten root noise when eval stops improving

  # Tactical prior nudges.
  mcts_tactical_priors_enabled: true  # Small tactical nudges help low-budget search notice forcing moves sooner
  mcts_tactical_capture_bonus: 0.06   # Small prior boost for captures
  mcts_tactical_winning_capture_bonus: 0.05  # Extra nudge for obviously favorable captures
  mcts_tactical_check_bonus: 0.04     # Checks are often tactically forcing
  mcts_tactical_promotion_bonus: 0.08 # Promotions are rare and critical
  mcts_tactical_recapture_bonus: 0.05 # Helps short tactical recapture sequences

  # Scout Budgeting.
  mcts_scout_simulations: 96       # Every root gets a cheap scout before deciding whether to stop, continue, or challenge
  mcts_scout_check_interval: 16    # Reclassify roots in coarse chunks to avoid CPU churn
  mcts_scout_low_branching_moves: 6
  mcts_scout_endgame_piece_count: 10
  mcts_scout_easy_top_visit_prob: 0.70
  mcts_scout_easy_visit_gap: 0.18
  mcts_scout_easy_max_entropy: 0.58
  mcts_scout_easy_min_explored_prior_mass: 0.92
  mcts_scout_easy_min_visited_moves: 8
  mcts_scout_target_changed_rate: 0.14 # Ask challenge to help only when normal MCTS is too prior-locked
  mcts_scout_challenge_band: 0.08
  mcts_scout_challenge_min_fraction: 0.02 # Keep a small budgeted challenge stream without forcing divergence
  mcts_scout_challenge_max_fraction: 0.35
  mcts_scout_avg_budget_target_ratio: 1.15
  mcts_scout_avg_budget_target_tolerance: 0.015
  mcts_scout_challenge_fraction: 0.0   # Runtime value; train_rl updates it from recent changed-top telemetry
  mcts_scout_challenge_budget_multiplier: 1.67 # 192 base -> ~320 sims for selected challenge roots
  mcts_scout_challenge_min_score: 0.20
  mcts_scout_challenge_prior_margin_ref: 0.24
  mcts_scout_challenge_prior_top_ref: 0.45
  mcts_scout_challenge_min_budget_fraction: 0.92
  mcts_scout_challenge_prior_temperature: 1.80 # Challenge roots flatten selection prior but keep clean base_priors for targets
  mcts_scout_challenge_uniform_mix: 0.08
  mcts_scout_challenge_delta_target_enabled: true # Train policy on challenge-phase visits, not scout+challenge visits that already favor prior top
  mcts_scout_challenge_delta_target_mix: 0.75
  mcts_scout_challenge_delta_target_min_visits: 48
  mcts_scout_challenge_delta_target_min_top_prob: 0.28
  mcts_scout_sharp_capture_min_gain: 1.0
  # ---------------------------
  # Policy Target Shaping
  # ---------------------------
  policy_target_pruning_enabled: true           # Drop low-visit exploration noise before training the policy head
  policy_target_pruning_keep_top_n: 8           # Always keep a broader top slice so uncertain positions retain more searched alternatives
  policy_target_pruning_max_moves: 28           # Let wider post-search support reach the learner before pruning the long tail
  policy_target_pruning_min_prob: 0.005         # Still trim only the weakest tail; low-probability tactical moves can survive if search supports them
  policy_target_pruning_min_fraction_of_max: 0.05 # Keep moves that are closer to the best visit count instead of over-sharpening the target
  policy_target_pruning_keep_mass: 0.96         # Preserve more of the MCTS distribution when many moves are similarly plausible
  policy_target_quality_weighting_enabled: true # Downweight flat/ambiguous targets at storage time, not only during training
  policy_target_quality_min_weight: 0.50        # MCTS targets are now cleaner; do not starve policy gradients on broader roots
  policy_target_quality_entropy_threshold: 0.78 # Be less punitive to wider MCTS distributions after Q starts changing top moves
  policy_target_quality_top1_threshold: 0.45    # Let moderately confident MCTS targets train the policy instead of only sharp roots
  policy_target_uptake_gate_enabled: true       # Keep value learning broad, but let policy absorb mainly real MCTS improvements
  policy_target_uptake_unchanged_low_kl_max: 0.16 # Same-top low-KL search mostly restates the learner prior
  policy_target_uptake_unchanged_low_kl_weight: 0.65 # Stable IL-backed moves still teach, but no longer dominate rare MCTS discoveries
  policy_target_uptake_unchanged_weight: 0.84   # Preserve broad policy structure while leaving more gradient for changed-top targets
  policy_target_search_change_weighting_enabled: true # Give clean changed-top MCTS targets a modest extra policy push
  policy_target_search_change_min_q_delta: 0.05       # Require a real Q edge before boosting changed-top targets
  policy_target_search_change_q_delta_ref: 0.35       # Useful Q deltas should matter before they are huge
  policy_target_search_change_bonus: 0.24             # Changed-top MCTS targets are rare; give them enough gradient to move raw policy
  policy_target_search_change_q_bonus: 0.30           # Extra bonus from positive Q delta
  policy_target_search_change_rank_bonus: 0.12        # Small bonus when the prior top drops below rank 2 in visits
  policy_target_search_change_allow_q_neutral: true   # Let strong search changes teach policy even when Q is near neutral
  policy_target_search_change_min_top_visit_prob: 0.55 # Neutral-Q change must have a clear visit winner
  policy_target_search_change_min_prior_rank: 2       # Prior top must fall behind the MCTS winner
  policy_target_search_change_neutral_min_q_delta: -0.02 # Do not boost changes that backed-up value clearly dislikes
  policy_target_search_change_neutral_bonus: 0.09     # Smaller boost for neutral-Q changes than Q-backed changes
  policy_target_search_change_neutral_rank_bonus: 0.06 # Extra neutral-Q boost when prior top falls clearly in visit rank
  policy_target_search_change_max_weight: 1.70        # Stronger uptake for rare clean changes without letting one sample explode

  # ---------------------------
  # Optimizer Core
  # ---------------------------
  batch_size: 8192           # Fallback only when dynamic RL batch sizing is disabled
  train_dynamic_batch_size_enabled: true # Grow batch with replay so a full pass stays near a stable optimizer-step budget
  train_batch_size_min: 1024 # Early RL still needs several updates while replay contains only the first self-play generation
  train_batch_size_max: 6144 # Cap dynamic RL batches at ~6k even after replay fills
  train_batch_size_round_to: 256 # Keep GPU-friendly batch shapes without large jumps between iterations
  train_target_steps_per_iteration: auto # auto targets about 5 steps while replay fits under the batch cap
  learning_rate: 0.00002     # Strong IL anchor needs smaller RL updates until MCTS discoveries reliably become raw-policy gains
  weight_decay: 0.002         # L2 regularization (AdamW)
  backbone_lr_factor: 0.75   # Keep shared IL features stable while RL targets are still noisy
  policy_head_lr_factor: 1.15 # Let the raw policy absorb clean MCTS discoveries faster
  value_head_lr_factor: 1.75 # Let the WDL head adapt faster; MCTS strength is limited by value discrimination, not only MAE
  head_weight_decay: 0.0005    # Heads need less AdamW decay than the shared backbone
  no_decay_weight_decay: 0.0 # Do not decay BN/norm/bias parameters
  grad_clip: 0.5             # Gradient clipping
  train_epochs_per_iteration: 1  # Reduce overfitting to noisy self-play targets
  train_max_steps_per_iteration: 0  # 0 = always train on the full unique replay pass; do not discard replay samples
  q_disabled_training_q_threshold: 0.001 # When Q is effectively absent, avoid full-strength policy self-distillation
  q_disabled_policy_loss_scale: 0.80
  q_disabled_value_loss_scale: 1.05
  q_disabled_value_loss_max: 0.54
  post_promotion_stabilization_iterations: 10 # Keep the learner close to the promoted checkpoint while replay distribution shifts
  post_promotion_lr_scale: 0.30
  post_promotion_lr_recovery_iterations: 8 # Return from the stabilization LR gradually instead of jumping back at once
  post_promotion_policy_loss_scale: 0.65 # Avoid overwriting a freshly promoted policy with noisy early post-promotion targets
  post_promotion_value_loss_scale: 1.08  # Keep value repair active without letting outcome noise dominate the fresh best
  post_promotion_best_policy_kl_weight: 0.22 # Distill toward the promoted best policy during stabilization
  post_promotion_best_value_distill_weight: 0.10 # Keep value scalar close to the promoted best while final-outcome targets settle
  post_promotion_replay_pre_fraction: 0.50 # Keep a promoted-best baseline in replay batches while those samples still exist
  post_promotion_train_replay_fraction: 0.65 # During stabilization, do not train a full pass over freshly shifted replay
  post_promotion_guard_enabled: true       # Restore current to promoted best if early post-promotion eval collapses
  post_promotion_guard_window: 12
  post_promotion_guard_min_score_rate: 0.45
  post_promotion_guard_min_anchor_score_rate: 0.50
  post_promotion_guard_extend_iterations: 4
  post_promotion_guard_max_rollbacks: 2
  rl_diagnostic_ema_alpha: 0.35 # Smoothing for MCTS/no-MCTS and Q ablation control signals

  # ---------------------------
  # Training Schedule & Regularization
  # ---------------------------
  # Learning rate schedule.
  use_lr_schedule: true
  warmup_pct: 0.15           # Slower RL ramp while the first smaller self-play generations enter replay
  min_lr_ratio: 0.35         # Keep late policy updates alive while MCTS discoveries become cleaner

  # Entropy regularization.
  entropy_weight: 0.0010      # Resist raw-policy over-narrowing so MCTS can still challenge top-1 priors
  policy_target_confidence_weighting_enabled: true # Downweight flat MCTS policy targets instead of treating tiny visit differences as equally authoritative
  policy_target_confidence_min_weight: 0.58 # Stop under-training broader but useful MCTS distributions
  policy_target_confidence_power: 1.0       # Higher sharpens the preference for confident targets; lower is more uniform

  # Data augmentation.
  use_augmentation: true
  augment_horizontal_flip: true   # Mirror board horizontally
  augment_prob: 0.5               # 50% chance per position

  # ---------------------------
  # Replay Buffer
  # ---------------------------
  replay_buffer_multiplier: 5     # Replay horizon in observed self-play generations; lower means less stale self-distillation
  replay_buffer_bootstrap_positions_per_iteration: auto
  replay_buffer_ema_alpha: 0.15   # Smooth capacity changes from observed positions/iteration
  replay_buffer_min_size: 4096
  replay_buffer_capacity_round_to: 256
  replay_fp16: true              # Store replay tensors in fp16 to reduce RAM
  replay_max_policy_targets: 28  # Stored policy support cap, aligned with target pruning

  # Per-game storage cap before positions enter replay.
  replay_dynamic_cap_enabled: true
  replay_cap_fraction_decisive: 0.80
  replay_cap_fraction_draw: 0.80
  replay_cap_min_positions: 24
  replay_cap_max_positions: 120

  # Batch sampling mix.
  replay_weighted_sampling_power: 0.55
  replay_decisive_sampling_fraction: 0.08
  replay_decisive_value_epsilon: 0.05
  replay_value_balanced_sampling_fraction: 0.30
  replay_value_balance_epsilon: 0.05
  replay_recent_sampling_fraction: 0.06
  replay_recent_window_fraction: 0.25
  replay_resize_preserve_decisive_fraction: 0.15
  replay_resize_preserve_decisive_min_count: 1024
  replay_mcts_reanalyze_enabled: true # True reanalyze: rerun MCTS from stored FENs on a small old-replay sample
  replay_mcts_reanalyze_every: 1
  replay_mcts_reanalyze_model: current # Refresh stale replay with the learner that will consume the targets
  replay_mcts_reanalyze_fraction: 0.025
  replay_mcts_reanalyze_max_positions: 192
  replay_mcts_reanalyze_min_age: 2
  replay_mcts_reanalyze_simulations_multiplier: 1.0 # Match self-play search budget; 192 -> 192 sims
  replay_mcts_reanalyze_batch_positions: 16
  replay_mcts_reanalyze_policy_mix: 0.35 # Nudge old targets toward fresh search without overwriting replay too fast
  replay_mcts_reanalyze_value_mix: 0.00  # Do not refresh value from search while Q/value calibration is being repaired
  replay_mcts_reanalyze_importance_bonus: 0.00
  replay_mcts_reanalyze_challenge_fraction: 0.0

  # ---------------------------
  # Evaluation, Diagnostics & Promotion
  # ---------------------------
  eval_workers: auto         # Dynamic MCTS eval workers; small evals use fewer fuller workers, large evals use all CPU
  eval_worker_restart_limit: 2 # Respawn a crashed MCTS eval worker and replay only unfinished games
  eval_cpu_threads_to_reserve: 0
  eval_torch_threads: 1
  eval_batch_games: 32       # Active MCTS eval games searched together inside each worker
  eval_min_games_per_worker: 6 # Use more CPU during small evals while keeping central inference batches reasonably full
  eval_central_inference_enabled: true
  eval_central_inference_min_games: 2
  eval_central_inference_servers: auto
  eval_central_inference_auto_min_servers: 1
  eval_central_inference_auto_workers_per_server: 8
  eval_central_inference_auto_max_servers: 2
  eval_central_inference_flush_ms: 3.0
  eval_central_inference_max_batch_size: 256
  eval_central_inference_transport_dtype: "float16"
  eval_central_inference_timeout_s: 0
  eval_central_inference_stall_warning_s: 15
  eval_central_inference_load_timeout_s: 300
  eval_central_inference_use_compile: true
  eval_central_inference_compile_warmup_batches: [1, 32, 128, 256]
  eval_central_inference_cudnn_benchmark: false
  eval_central_inference_cache_enabled: false
  eval_mcts_simulations_multiplier: 1.25 # Generic MCTS eval budget when a caller does not pin exact sims
  eval_max_moves: 320        # Align eval with self-play so results are not dominated by ultra-long unresolved games
  eval_auto_claim_draw: true
  eval_claim_repetition_after_moves: 70
  eval_claim_draw_after_moves: 180  # Generic claimable draws after ~70 full moves
  eval_every: 2               # Slightly faster feedback loop while iterating toward surpassing IL
  # Cheap diagnostics. These do not promote models.
  eval_no_mcts_enabled: true  # Extra policy-only evaluation: no MCTS, does not affect best-model promotion
  eval_no_mcts_every: 1       # Run the no-MCTS eval every RL iteration
  eval_no_mcts_games: 50      # Cheap raw-policy signal every iteration without slowing RL too much
  eval_no_mcts_use_fixed_openings: true
  # Three-stage promotion funnel. The current learner is promoted immediately
  # after passing one strict exam; weights are never frozen across iterations.
  eval_funnel_preliminary_games: 40
  eval_funnel_preliminary_simulations: auto
  eval_funnel_preliminary_simulations_multiplier: 1.0 # Phase 1 uses the same MCTS budget as self-play training
  eval_funnel_preliminary_score_rate: 0.45 # Permissive filter: tolerate ordinary variance in a small preliminary sample
  eval_funnel_preliminary_true_win_rate: 0.0
  eval_funnel_preliminary_result_weight: 0.50 # Count phase 1 in the final verdict, but weaker than full-budget games
  eval_funnel_medium_games: 60
  eval_funnel_medium_simulations: auto
  eval_funnel_later_simulations_multiplier: 1.25 # Phase 2/3 are stricter, but not a different 320-sim regime
  eval_funnel_medium_score_rate: 0.53
  eval_funnel_medium_true_win_rate: 0.02
  eval_funnel_advanced_games: 80
  eval_funnel_advanced_simulations: auto

  # Shared MCTS eval conditions.
  eval_fixed_openings_enabled: true
  eval_fixed_openings_pair_games: true # Compare both colors from the same opening before moving to the next line
  eval_fixed_openings_max_plies: 6

  # Promotion gate and stability checks.
  score_rate_threshold: 0.55    # Promote only after medium + advanced score at least 55%
  true_win_rate_threshold: 0.02 # Also require a real decisive edge, not only draw-heavy scoring
  promotion_reset_optimizer_state: true # Old Adam moments should not immediately push the promoted baseline away
  promotion_playoff_enabled: true       # One good eval becomes a candidate; promotion needs a second confirmed pass
  promotion_playoff_confirmations: 2
  promotion_stat_gate_enabled: true     # SPRT-lite: require the lower confidence bound to clear parity
  promotion_stat_gate_z: 1.28           # About 80% one-sided confidence; stricter than raw score, not as slow as full SPRT
  promotion_score_lower_bound_min: 0.50
  promotion_require_anchor_non_regression: true # A new RL best must not regress vs the original IL anchor
  promotion_anchor_min_score_rate: 0.50
  promotion_anchor_min_true_win_rate: 0.00
  anchor_eval_enabled: true
  anchor_eval_every: 1          # Run anchor eval on every RL evaluation cycle
  anchor_eval_games: 50
  anchor_eval_mcts_simulations: auto
  anchor_eval_mcts_simulations_multiplier: 1.25
  anchor_eval_use_fixed_openings: true

  # Stop prolonged runs without a new useful direction.
  early_stop_enabled: true
  early_stop_patience: 10        # Stop RL after 10 eval cycles without meaningful improvement
  early_stop_patience_increment_on_promotion: 2 # Give each promoted best one extra eval cycle to be surpassed
  early_stop_min_score_improvement: 0.01   # Require at least +1pp score-rate improvement to reset patience
  early_stop_min_true_win_improvement: 0.005 # Or at least +0.5pp true-win improvement
  checkpoint_every: 10        # Save checkpoint every N iterations

  # ---------------------------
  # Loss Weights
  # ---------------------------
  policy_loss_weight: 1.0    # Policy loss weight
  policy_anchor_kl_weight: 0.14 # Keep the IL-policy floor, but stop it from overpowering clean MCTS discoveries
  value_loss_weight: 0.78    # Value/Q must become usable enough for deeper MCTS, not only low-loss on outcomes
  value_aux_scalar_loss_weight: 0.15  # Small optional W-L scalar auxiliary
  moves_left_loss_weight: 0.05        # Auxiliary SmoothL1 on log1p(remaining plies)
  value_root_q_target_mix: 0.08       # Blend a little root MCTS Q into final-outcome value targets to reduce outcome noise
  value_std_floor_loss_weight: 0.85   # Penalize value collapse when pred std falls far below target std
  value_std_floor_target_ratio: 0.95  # Aim for most of the target value spread before the penalty vanishes
  value_wdl_label_smoothing: 0.010    # Preserve calibration without encouraging overly flat WDL probabilities
  value_metric_weight_min: 0.20
  value_metric_max_fullmove: 80
  value_phase_opening_max_fullmove: 12
  value_phase_endgame_min_fullmove: 40
  value_phase_max_fullmove: 120
  # Value supervision: start slightly stronger, then taper once scalar calibration improves.
  value_loss_weight_schedule:
    start: 0.82
    end: 0.74
    power: 1.00
  value_loss_weight_adaptive_enabled: true
  value_loss_weight_adaptive_max_adjustment: 0.06
  value_loss_weight_adaptive_smoothing: 0.40
  value_loss_weight_q_disabled_bonus: 0.040
  value_loss_weight_eval_stagnation_bonus: 0.015

# ------------------------------------------------------------------------------
# HARDWARE & OPTIMIZATION
# ------------------------------------------------------------------------------
hardware:
  device: "cuda"             # Device: cuda, cpu, or mps (Mac)

  # Performance optimizations
  use_amp: true              # Mixed Precision Training (~2x speedup)
  use_bfloat16: true         # bfloat16 instead of float16 (better range)
  num_workers: 5             # CPU workers for data loading
  prefetch_factor: 1         # DataLoader prefetch factor
  train_prefetch_factor: 2   # Two prepared train batches per worker smooth out GPU feed stalls
  val_prefetch_factor: 1     # One queued val batch per worker; raise to 2 only if RAM/pagefile stays calm
  pin_memory: true           # Faster GPU data transfer
  val_pin_memory: true       # Validation still benefits from pinned transfer
  cuda_prefetch_batches: true # Overlap CPU->GPU batch copies with current CUDA compute
  cuda_prefetch_queue_size: 2 # GPU-side prefetched batches; smooths DataLoader stalls without growing CPU queue
  cuda_eval_prefetch_queue_size: 1 # Avoid holding multiple large eval batches on GPU
  persistent_workers: true   # Keep train workers alive between epochs
  val_persistent_workers: false # Release validation workers after eval; avoids pinned/shared-memory buildup
  dataloader_index_mmap: true # Store sampled index arrays as .npy mmap so workers share them
  dataloader_numpy_shuffle: true # Compact shuffle permutation; avoids huge Python int lists
  dataloader_board_dtype: "float16" # Halve board tensor RAM/pinned/H2D traffic; cast on GPU for model
  dataloader_train_in_order: false # Let train yield first-ready worker batch; smoother GPU feed with shuffled data
  dataloader_val_in_order: false # Eval metrics are order-independent; avoid waiting for slowest worker
  use_compile: true          # torch.compile: fuse Conv+BN+ReLU kernels (~3x speedup)


# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging:
  log_level: "INFO"          # DEBUG, INFO, WARNING, ERROR
  tensorboard: true          # Enable TensorBoard logging
  print_every: 10            # Print stats every N batches
  il_plot_smoothing_enabled: true # Light EMA smoothing for IL PNG curves; exact best/SWA markers stay raw
  il_plot_smoothing_alpha: 0.65   # Higher = follows raw curve more closely, lower = smoother
  il_plot_smoothing_min_points: 5 # Do not smooth very short runs
  il_plot_every: 3                # Heavy matplotlib PNG update every N logged IL evals; final plot is still saved


# ------------------------------------------------------------------------------
# ELO ESTIMATION
# ------------------------------------------------------------------------------
elo_estimation:
  # Base Stockfish match settings used by manual Elo, final checks, and mode overrides.
  enabled: true
  stockfish_path: "stockfish"
  levels: [1320, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2600, 2800]
  games_per_level: 40
  stockfish_time_limit: 0.10
  max_moves: 150
  workers: 0
  stockfish_threads: 1
  stockfish_hash_mb: 32
  stockfish_hide_window: true
  max_error_logs_per_type: 8

  # Training-friendly process scheduling.
  prioritize_training: true
  reserve_dataloader_workers: true
  free_threads_utilization: 1.0
  stockfish_priority: "below_normal"

  # Adaptive ladder: always probe all levels lightly, then spend games near the useful bracket.
  adaptive_probe_games_per_level: 5
  adaptive_min_batch_games: 70
  adaptive_focus_games_per_level: 24
  adaptive_extra_games_per_level: 5
  adaptive_target_focus_levels: 3
  adaptive_focus_min_score: 0.20
  adaptive_focus_max_score: 0.80
  adaptive_skip_high_score: 0.92
  adaptive_stop_low_score: 0.08
  adaptive_max_total_games: 160
  adaptive_target_standard_error: 45.0
  adaptive_min_games_for_se_stop: 80

  # IL Elo overrides.
  il_eval_every: 2
  il_games_per_level: 12
  il_max_moves: 120
  il_workers: 2
  il_free_threads_utilization: 0.35
  il_adaptive_probe_games_per_level: 2
  il_adaptive_focus_games_per_level: 12
  il_adaptive_extra_games_per_level: 4
  il_adaptive_max_total_games: 128
  il_adaptive_min_games_for_se_stop: 64
  il_adaptive_target_standard_error: 55.0
  final_on_il_shutdown: true
  final_il_workers: 12
  final_il_games_per_level: 40
  final_il_max_moves: 220
  final_il_adaptive_probe_games_per_level: 5
  final_il_adaptive_focus_games_per_level: 40
  final_il_adaptive_extra_games_per_level: 8
  final_il_adaptive_target_focus_levels: 4
  final_il_adaptive_max_total_games: 320
  final_il_adaptive_min_games_for_se_stop: 140
  final_il_adaptive_target_standard_error: 30.0
  final_il_raw_games_multiplier: 2.0 # Raw NN is fast; run more games for a stabler final IL Elo
  final_il_mcts_simulations: 192

  # RL promoted-best Elo overrides.
  promoted_rl_stockfish_time_limit: 0.20 # Normal final Elo uses this slower Stockfish setting
  promoted_rl_workers: 12               # Base promoted/final Elo worker count; raw/MCTS multipliers may raise it
  promoted_rl_raw_worker_multiplier: 2.0 # Raw NN Elo is Stockfish-bound, so it can use more parallel games
  promoted_rl_mcts_worker_multiplier: 1.0 # MCTS Elo keeps fewer workers to preserve useful central inference batches
  rl_promoted_use_mcts: true            # Normal final Elo: after raw NN, also run MCTS Elo
  rl_promoted_fast_enabled: true        # During RL, promoted bests get only a quick rough Elo instead of a long normal check
  rl_promoted_fast_use_mcts: false      # Keep promotion-time Elo cheap; normal final Elo still measures MCTS
  rl_promoted_fast_total_games: 50
  rl_promoted_fast_stockfish_time_limit: 0.06
  rl_promoted_fast_probe_games_per_level: 2
  rl_promoted_fast_focus_games_per_level: 8
  rl_promoted_fast_extra_games_per_level: 2
  rl_promoted_fast_target_focus_levels: 3
  rl_promoted_fast_mcts_simulations: 128
  rl_final_elo_enabled: true            # After RL finishes cleanly, run the normal slower Elo on the best checkpoint
  rl_final_use_mcts: true

  # Generic/manual Elo model move generation.
  batch_model_moves: true
  batch_raw_model_moves: false
  use_mcts: false              # Default for manual/generic Elo; RL promoted Elo forces raw NN first
  mcts_simulations: 100        # Manual/generic MCTS Elo only; RL promoted MCTS uses the RL eval MCTS budget
  elo_mcts_scout_simulations: 128 # Elo uses deterministic scout stops only; no challenge expansion
  elo_mcts_scout_easy_top_visit_prob: 0.74
  elo_mcts_scout_easy_visit_gap: 0.22
  elo_mcts_scout_easy_max_entropy: 0.54
  elo_mcts_scout_easy_min_explored_prior_mass: 0.95
  elo_mcts_scout_easy_min_visited_moves: 6

  # Standalone eval_elo.py tuning.
  eval_elo_stockfish_priority: "normal"
  eval_elo_raw_worker_multiplier: 2.0
  eval_elo_mcts_worker_multiplier: 1.5
  eval_elo_central_inference_enabled: true
  eval_elo_central_inference_servers: 1
  eval_elo_central_inference_auto_workers_per_server: 16
  eval_elo_central_inference_auto_min_servers: 1
  eval_elo_central_client_groups: "auto"
  eval_elo_central_target_client_groups: 6
  eval_elo_central_min_client_groups: 4
  eval_elo_central_max_client_groups: 8
  eval_elo_central_games_per_worker_chunk: 4
  eval_elo_central_target_chunks_per_group: 2
  eval_elo_central_max_chunk_games: 12
  eval_elo_central_inference_max_batch_size: 256
  eval_elo_central_inference_flush_ms: 3.0
  eval_elo_central_inference_transport_dtype: "float16"
  eval_elo_central_inference_use_compile: true
  eval_elo_central_inference_cache_enabled: false
  eval_elo_central_inference_timeout_s: 0

  # Output verbosity.
  elo_verbose_adaptive: false
  elo_verbose_worker_stats: false
  elo_verbose_batch_stats: false
  elo_print_completion_summary: true
  elo_print_worker_summary: false

  # Async worker device used by IL background Elo and RL cancellable Elo worker.
  async_in_il: true
  async_device: "cpu"
  async_wait_on_shutdown_sec: 0.0


# ------------------------------------------------------------------------------
# 🆕 DEBUG & PROFILING
# ------------------------------------------------------------------------------
debug:
  enabled: false                   # Master switch for verbose diagnostics

  # Imitation Learning diagnostics
  il:
    profile_training: false         # Full CUDA-sync timing is expensive; false profiles only first phase epoch
    print_profile_to_console: false # Keep epoch timing tables in logs/debug only
    log_gpu_memory: false           # GPU memory logging is diagnostic, not needed in the hot training loop
    print_batch0_diagnostics: false # Print batch-0 target stats + WDL samples
    print_wdl_loss_diagnostics: false # Print one-time WDL class distribution from loss

  # Reinforcement Learning diagnostics
  rl:
    profile_training: false         # Iteration/self-play/train/eval timing breakdown
    profile_mcts_detail: true       # Detailed CPU MCTS timers for data-quality/performance plots; CUDA sync stays off while profile_training=false
    profile_mcts_sample_rate: 64     # Approximate low-overhead tensor timing sample rate for data-quality diagnostics
    log_gpu_memory: false           # GPU memory usage around RL iterations
    central_inference:
      verbose: false                # Per-request/heartbeat logs; summaries still go to console, RL.csv and PNG
      stall_warning_s: 15           # When verbose=true, print if a worker waits this long for central inference


# ------------------------------------------------------------------------------
# REPRODUCIBILITY
# ------------------------------------------------------------------------------
seed: 42                     # Random seed

