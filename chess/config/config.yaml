# ==============================================================================
# CHESS AI CONFIGURATION - OPTIMIZED FOR RTX 5060Ti 16GB v4.2
# 🆕 POV (Point of View) + Dynamic Sliding Window Support
# ==============================================================================

# ------------------------------------------------------------------------------
# FILE PATHS (relative to chess/ project root)
# ------------------------------------------------------------------------------
paths:
  data_dir: "data"
  models_dir: "models"
  logs_dir: "logs"
  
  # Best models (single file, overwritten when improved)
  best_model_il: "models/best_model_il.pt"
  best_model_rl: "models/best_model_rl.pt"
  
  # Checkpoint directories (saved every N epochs/iterations)
  il_checkpoints_dir: "models/IL"
  rl_checkpoints_dir: "models/RL"


# ------------------------------------------------------------------------------
# DATA PROCESSING - 🆕 v4.3 TEMPORAL DISCOUNTING + v4.2 POV + SLIDING WINDOW
# ------------------------------------------------------------------------------
data:
  min_elo: 2000              # Minimum Elo rating for games
  max_games: 100000          # Top N games to use per PGN file
  train_split: 0.9           # Train/validation split ratio
  max_moves_per_game: 200    # Skip longer games
  
  # Quality filtering
  select_top_games: true     # Sort by Elo and take top max_games (higher quality)
  sort_by_avg_elo: true      # Sort by average Elo of both players
  
  # 🆕 SLIDING WINDOW CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════════
  # The sliding window system allows dynamic history assembly at load time
  # instead of storing redundant history data in binary files.
  # ═══════════════════════════════════════════════════════════════════════════
  
  sliding_window_stride: 2   # 🆕 Sample every Nth position (1 = all, 2 = every other, etc.)
                             # - stride=1: All positions (~100% data, slower training)
                             # - stride=2: Every other position (~50% data, 2x faster) ⭐ RECOMMENDED
                             # - stride=3: Every 3rd position (~33% data, 3x faster)
                             # Higher stride = less data but faster iterations
                             # Note: History is still built dynamically from ALL positions
  
  # 4-PHASE PROCESSING (LOW RAM MODE)
  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 1: PGN extraction (multi-processing, TRUE parallelism)
  # PHASE 2: Position extraction (multi-processing, TRUE parallelism)
  # PHASE 3: Disk writing (single-threaded I/O)
  # PHASE 4: Cleanup (🆕 automatic cleanup + tracking)
  # ═══════════════════════════════════════════════════════════════════════════
  
  files_at_once: 1           # How many PGN files to process simultaneously
                             # 1 = SEQUENTIAL (minimal RAM, most stable)
                             # 2-4 = BATCH (more RAM, faster)
                             # ⚠️ Set to 1 if you have RAM issues!
  
  phase1_threads: 11          # 🆕 PROCESSES for PGN parsing (Phase 1)
                             # PHASE 1: Multi-processing (bypasses GIL!)
                             # ✅ TRUE parallelism - each process has own Python interpreter
                             # ✅ Real CPU utilization - you'll see all cores working!
                             # Recommended: 4-8 processes (2-4x speedup)
                             # Set to 1 to disable multi-processing
  
  phase2_threads: 11          # 🆕 PROCESSES for position extraction (Phase 2)
                             # PHASE 2: Multi-processing (bypasses GIL!)
                             # ✅ TRUE parallelism for CPU-bound position processing
                             # ✅ Real CPU utilization - all cores working!
                             # Recommended: 8-16 processes (2-4x speedup)
                             # More processes = faster, but more RAM per file
                             # Set to 1 to disable multi-processing


# ------------------------------------------------------------------------------
# MODEL ARCHITECTURE 
# ------------------------------------------------------------------------------
model:
  # Base architecture
  num_residual_blocks: 8     # Number of residual blocks (6-12 optimal)
  filters: 128               # Convolutional filters (128-256 for RTX 5060 Ti)
  policy_head_filters: 32    # Policy head filters
  value_head_filters: 32     # Value head filters (reduced to prevent overfitting)
  value_hidden_dim: 256      # Value head hidden dimension (reduced to prevent overfitting)
  dropout: 0.5               # Dropout rate (increased for stronger regularization)

  # 🆕 v4.3: WDL VALUE HEAD
  use_wdl_value: true         # 🆕 Use WDL (Win/Draw/Loss) classification (RECOMMENDED!)

  # 🆕 DYNAMIC HISTORY CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════════
  # History is now assembled DYNAMICALLY at load time using mmap and GameID tracking
  # This eliminates redundant storage and enables flexible history depths
  # ═══════════════════════════════════════════════════════════════════════════
  history_positions: 4       # Number of previous positions to include (dynamic)
                             # - 0: Current position only (12 planes)
                             # - 1: Current + 1 previous (24 planes)
                             # - 4: Current + 4 previous (60 planes) ⭐ RECOMMENDED
                             # - 8: Current + 8 previous (108 planes)
                             # History is built by walking backwards through mmap using GameID
  
  # Advanced features
  use_se_blocks: false          # ❌ Standard SE (global pooling) - mniej przydatne dla szachów
  use_se2d_blocks: true          # ✅ SE-Net v2 with spatial info (+0.5-1%, +5% time) - LEPSZE DLA SZACHÓW!
  use_spatial_attention: true    # 👁️ Spatial attention
  spatial_attention_mode: 'last_2' # 'all', 'last_2', 'last_3', 'none'
  
  drop_path_rate: 0.2           # 🎲 Stochastic Depth (increased for better regularization)
  activation: 'relu'            # ⚡ ReLU activation (5-10x FASTER than ELU!)
  use_coord_conv: true          # 🗺️ Position-aware conv (+0.5% params, +4% quality)
  
  # Advanced architectural features
  use_layer_scale: true         # LayerScale for better training stability (+0% params)
  layer_scale_init: 1e-5        # Initial LayerScale value (1e-6 to 1e-4)
  
  # 🆕 v4.0: Pre-activation ResNet
  use_preactivation: true       # Pre-activation residual blocks (better gradients)

  # Multi-Task Learning
  use_multitask_learning: true        # Enable auxiliary tasks
  win_prediction_weight: 0.3          # Weight for win prediction (reduced to prevent overfitting)
  material_prediction_weight: 0.15    # Weight for material count (reduced)
  check_prediction_weight: 0.1        # Weight for check prediction (reduced)
  
  # 🆕 v4.3: Advanced MTL options
  use_focal_loss_check: true          # Use Focal Loss for check prediction (vs BCE)


# ------------------------------------------------------------------------------
# IMITATION LEARNING (IL)
# ------------------------------------------------------------------------------
imitation_learning:
  # Training hyperparameters
  batch_size: 8192           # Batch size (maximized for GPU utilization)
  learning_rate: 0.002       # Learning rate (lower for CosineAnnealing - no warmup)
  value_head_lr_factor: 0.5  # 🆕 Value head LR multiplier (0.5 = half LR to prevent overfitting)
  epochs: 200                # Maximum training epochs
  weight_decay: 0.001        # L2 regularization (10x stronger for value head)
  grad_clip: 1.0             # Gradient clipping threshold
  
  # 🆕 Stochastic Weight Averaging (SWA) for better generalization
  use_swa: true              # Enable SWA (averages weights from multiple epochs)
  swa_start_epoch: 15        # Start SWA after this epoch
  swa_lr: 0.0005             # SWA learning rate (lower than base LR)
  
  # Advanced training features
  label_smoothing: 0.1       # Label smoothing (0.0 = off, 0.1 = standard)
  scheduler_type: 'cosine_warm_restarts'  # Options: 'onecycle', 'cosine_warm_restarts', 'reduce_on_plateau', 'none'
  cosine_t0: 10              # 🔄 Epochs per cosine cycle (restarts every T0 epochs)
  cosine_t_mult: 2           # 🔄 Multiply T0 after each restart (10→20→40 epochs)
  
  # 🆕 v4.3: WDL-specific options
  wdl_label_smoothing: 0.20  # Label smoothing for WDL (maximum - prevents overfitting)
  
  # Loss weights
  policy_loss_weight: 1.0    # Policy loss weight
  value_loss_weight: 1.0     # Value loss weight (balanced with policy)
  
  # Evaluation & checkpointing
  eval_every: 1              # Evaluate every N epochs
  checkpoint_every: 5        # Save checkpoint every N epochs
  
  # Early stopping
  max_patience: 40           # ℹ️ Stop if no improvement for N epochs
  min_delta: 0.001           # Minimum improvement threshold


# ------------------------------------------------------------------------------
# REINFORCEMENT LEARNING (RL)
# ------------------------------------------------------------------------------
reinforcement_learning:
  # 🚀 Self-play configuration (PARALLEL)
  use_prioritized_replay: true        # Enable prioritized experience replay (default: false)
  games_per_iteration: 2048    # ⬇️ Reduced for faster iterations (adjust based on CPU)
  iterations: 1000           # Total RL iterations
  self_play_workers: 4       # 🚀 Parallel game workers (Windows: CPU only, Linux: can use GPU)
  
  # 🚀 Batch self-play mode
  use_batch_selfplay: true         # 🚀 NEW: Play multiple games simultaneously (5-10x faster)
  batch_games_per_worker: 512       # 🚀 NEW: Games per worker in batch mode (adjust for VRAM)

  # 🆕 TEMPERATURE SCHEDULE
  use_temperature_schedule: true      # Enable adaptive temperature
  temperature_start: 1.5              # High exploration at start
  temperature_end: 0.5                # Lower exploration at end
  temperature_decay_iterations: 500   # Decay over N iterations

  # 🚀 MCTS parameters (BATCH OPTIMIZED)
  mcts_simulations: 400      # 🔧 v4.4: Increased from 100→400 for better evaluation quality
  mcts_batch_size: 256       # Batch MCTS evaluations (32-128 optimal)
  mcts_reuse_tree: true      # Reuse tree across moves (faster, better)
  mcts_c_puct: 1.5           # Exploration constant (UCB)
  mcts_temperature: 1.0      # Temperature for move selection
  mcts_temperature_threshold: 15  # Move number to reduce temperature
  mcts_dirichlet_alpha: 0.3  # Dirichlet noise alpha
  mcts_dirichlet_weight: 0.25  # Weight of Dirichlet noise
  
  # Training parameters
  batch_size: 4096           # Training batch size (GPU)
  learning_rate: 0.0002       # Learning rate
  weight_decay: 0.05         # L2 regularization (AdamW)
  grad_clip: 0.5             # Gradient clipping
  train_epochs_per_iteration: 3  # ⬇️ Reduced from 5 (faster iteration)
  replay_buffer_size: 500000  # Max positions in replay buffer
  
  # Evaluation
  eval_games: 30             # ⬇️ Reduced from 20 (faster eval)
  eval_every: 2              # Evaluate every N iterations
  win_rate_threshold: 0.53   # Win rate to update best model
  checkpoint_every: 10        # Save checkpoint every N iterations
  
  # Loss weights
  policy_loss_weight: 1.0    # Policy loss weight
  value_loss_weight: 1.0     # Value loss weight


# ------------------------------------------------------------------------------
# HARDWARE & OPTIMIZATION
# ------------------------------------------------------------------------------
hardware:
  device: "cuda"             # Device: cuda, cpu, or mps (Mac)
  
  # Performance optimizations
  use_amp: true              # 🚀 Mixed Precision Training (~2x speedup)
  use_bfloat16: true         # 💾 bfloat16 instead of float16 (better range)
  num_workers: 4             # CPU workers for data loading
  prefetch_factor: 4         # DataLoader prefetch factor
  pin_memory: true           # Faster GPU data transfer


# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging:
  log_level: "INFO"          # DEBUG, INFO, WARNING, ERROR
  tensorboard: true          # Enable TensorBoard logging
  print_every: 10            # Print stats every N batches


# ------------------------------------------------------------------------------
# 🆕 DEBUG & PROFILING
# ------------------------------------------------------------------------------
debug:
  enabled: true                    # Master switch for debug mode
  profile_training: true           # Time breakdown per epoch
  log_gpu_memory: false             # GPU memory usage
  profile_every_n_epochs: 1         # Profile frequency (if enabled)


# ------------------------------------------------------------------------------
# REPRODUCIBILITY
# ------------------------------------------------------------------------------
seed: 42                     # Random seed